<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RWL • Random Code Generator</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f4f3ff;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 10%,#38206d,transparent 35%),radial-gradient(circle at 10% 80%,#092d6b,transparent 30%),#020617}.wrap{width:min(1100px,94%);margin:25px auto}.top{display:flex;justify-content:space-between}.ps{font-size:42px;font-weight:900;text-shadow:0 0 25px #7d5cff}.gear{background:#090e27;border:1px solid #5865ff;color:white;border-radius:14px;font-size:23px;padding:10px 15px}.rwl{text-align:center;font-size:clamp(80px,15vw,155px);font-weight:900;font-style:italic;letter-spacing:12px;color:#ddd8ff;text-shadow:0 0 10px white,0 0 35px #7158ff,0 0 70px #df4cff}h1{text-align:center;font-size:clamp(28px,5vw,48px);margin:10px 0}.sub{text-align:center;color:#c0c6ff;letter-spacing:2px}.card{margin-top:35px;padding:30px;border:1px solid #4c59ff;border-radius:28px;background:#07102bcc;box-shadow:0 0 45px #4b42ff30;backdrop-filter:blur(15px)}.grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:25px}.section{padding:5px 20px;border-left:1px solid #7880ff33}.section:last-child{border:0}.label{font-weight:bold;font-size:19px;margin-bottom:13px}.length{display:flex;gap:8px}input{background:#080e2b;color:white;border:1px solid #4d54ff;border-radius:14px;padding:14px;font-size:20px;text-align:center}.length input{width:100%}.smallbtn,.copy{border:1px solid #5865ff;background:#11194a;color:white;border-radius:14px;padding:0 17px;font-size:22px}.check{display:block;margin:12px 0;color:#d7dbff}.check input{width:18px;height:18px;vertical-align:middle;accent-color:#9a5cff}.modes{display:flex;border:1px solid #35428d;border-radius:15px;overflow:hidden}.mode{flex:1;padding:14px;background:transparent;color:#c2c8ff;border:0}.mode.active{background:linear-gradient(135deg,#5a4aff,#c34cff);color:white}.generate{width:100%;margin:30px 0 22px;padding:17px;border-radius:17px;border:1px solid #cbd0ff;color:white;font-size:21px;font-weight:bold;background:linear-gradient(90deg,#4c8dff,#604bff,#df4cff);box-shadow:0 0 30px #8255ff55}.result{display:flex;gap:10px}.result input{flex:1;direction:ltr;text-align:left}.copy{height:53px;cursor:pointer}.footer{text-align:center;color:#7d84c0;letter-spacing:5px;margin-top:25px}.note{position:fixed;left:18px;bottom:18px;color:#caa8ff;font-style:italic}@media(max-width:800px){.grid{grid-template-columns:1fr}.section{border:0;border-bottom:1px solid #7880ff33;padding:18px 0}.note{display:none}}
.psapp{width:100%;padding:16px;margin:0 0 25px;border-radius:17px;border:1px solid #6d7cff;color:white;font-size:20px;font-weight:bold;background:linear-gradient(90deg,#111b4d,#263a9b);box-shadow:0 0 24px #4169ff33;cursor:pointer}.psapp:active{transform:scale(.99)}
</style></head><body><div class="wrap"><div class="top"><div class="ps">◉</div><button class="gear">⚙</button></div><div class="rwl">RWL</div><h1>مولّد الأكواد العشوائية</h1><div class="sub">بسيط ✦ سريع ✦ آمن</div><div class="card"><div class="grid"><div class="section"><div class="label">✦ الطول</div><div class="length"><button class="smallbtn" id="minus">−</button><input id="length" type="number" min="4" max="64" value="16"><button class="smallbtn" id="plus">+</button></div></div><div class="section"><div class="label">✓ يتضمن</div><label class="check"><input id="upper" type="checkbox" checked> أحرف كبيرة (A-Z)</label><label class="check"><input id="lower" type="checkbox" checked> أحرف صغيرة (a-z)</label><label class="check"><input id="numbers" type="checkbox" checked> أرقام (0-9)</label><label class="check"><input id="symbols" type="checkbox" checked> رموز (!@#...)</label></div><div class="section"><div class="label">✦ الخيارات</div><div class="modes"><button class="mode active" id="rwlMode">RWL Mode</button><button class="mode" id="normalMode">عادي</button></div><p style="color:#9098c8">وضع RWL يضمن وجود RWL داخل الكود.</p></div></div><button class="generate" id="generate">✦ توليد كود جديد →</button><button class="psapp" id="psapp">🎮 فتح تطبيق PlayStation</button><div class="label">⌘ الكود الخاص بك</div><div class="result"><input id="result" readonly><button class="copy" id="copy">▣</button></div></div><div class="footer">RWL • CODE GENERATOR</div></div><div class="note">Good Vibes<br>Only ♡</div><script>
const $=id=>document.getElementById(id),C={u:"ABCDEFGHIJKLMNOPQRSTUVWXYZ",l:"abcdefghijklmnopqrstuvwxyz",n:"0123456789",s:"!@#$%^&*()_+-=[]{}<>?"};let rwl=true;function rnd(n){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}function gen(){let len=Math.max(4,Math.min(64,+$("length").value||16));$("length").value=len;let p="";if($("upper").checked)p+=C.u;if($("lower").checked)p+=C.l;if($("numbers").checked)p+=C.n;if($("symbols").checked)p+=C.s;if(!p){alert("اختر نوعاً واحداً على الأقل");return}let x=rwl?"RWL".slice(0,Math.min(3,len)):"";while(x.length<len)x+=p[rnd(p.length)];if(rwl&&len>=3)x="RWL"+x.slice(3);$("result").value=x}$("minus").onclick=()=>{$("length").value=Math.max(4,+$("length").value-1)};$("plus").onclick=()=>{$("length").value=Math.min(64,+$("length").value+1)};$("generate").onclick=gen;$("rwlMode").onclick=()=>{rwl=true;$("rwlMode").classList.add("active");$("normalMode").classList.remove("active");gen()};$("normalMode").onclick=()=>{rwl=false;$("normalMode").classList.add("active");$("rwlMode").classList.remove("active");gen()};$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("result").value)}catch(e){$("result").select();document.execCommand("copy")}$("copy").textContent="✓";setTimeout(()=>$("copy").textContent="▣",800)};gen();

const PS_APP_SCHEME="scepsapp://";const PS_APP_STORE="https://apps.apple.com/app/playstation-app/id410896080";let psOpened=false;$("psapp").onclick=()=>{psOpened=false;const cancel=()=>{psOpened=true;clearTimeout(t);window.removeEventListener("pagehide",cancel);document.removeEventListener("visibilitychange",cancel)};window.addEventListener("pagehide",cancel,{once:true});document.addEventListener("visibilitychange",cancel,{once:true});const t=setTimeout(()=>{if(!psOpened)window.location.href=PS_APP_STORE},1200);window.location.href=PS_APP_SCHEME};
</script></body></html>
