<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RwL</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top,#3b2b75 0,#17132b 35%,#08080d 75%);
    color:white;
    padding:18px;
}

.container{
    max-width:560px;
    margin:auto;
}

.card{
    background:rgba(18,18,28,.88);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(18px);
    border-radius:28px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

/* الغلاف */

.cover{
    text-align:center;
    padding:18px 0 28px;
}

.logo{
    width:92px;
    height:92px;
    margin:auto;
    border-radius:28px;
    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    box-shadow:
        0 10px 35px rgba(139,92,246,.35);

    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
}

.title{
    font-size:32px;
    font-weight:900;
    margin-top:17px;
}

.subtitle{
    color:#aaa;
    margin-top:7px;
}

/* الصفحات */

.page{
    display:none;
}

.page.active{
    display:block;
}

h2{
    margin-top:0;
}

/* الأزرار */

.menu{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.menu button,
.back,
.action{
    border:0;
    border-radius:16px;
    padding:16px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.menu button{
    color:white;
    background:#222231;
    border:1px solid rgba(255,255,255,.07);
}

.menu button:hover{
    transform:translateY(-2px);
    background:#2c2c40;
}

.back{
    width:100%;
    background:#292936;
    color:white;
    margin-bottom:16px;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:15px 0;
}

.action{
    background:#fff;
    color:#111;
}

.action.refresh{
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    color:white;
}

/* القائمة */

.list{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.item{
    background:#20202b;
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    direction:ltr;
}

.username{
    font-size:17px;
    font-weight:800;
}

.tag{
    font-size:12px;
    color:#b9a7ff;
    direction:rtl;
}

/* ستور */

.code{
    background:#20202b;
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:16px;
    margin-bottom:9px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    direction:ltr;
}

.note{
    margin-top:15px;
    background:#211f30;
    color:#bdb7d9;
    border-radius:14px;
    padding:13px;
    line-height:1.7;
    font-size:13px;
}

.counter{
    text-align:center;
    color:#888;
    font-size:13px;
    margin:10px 0;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<!-- الرئيسية -->

<div id="home" class="page active">

<div class="cover">

<div class="logo">
RwL
</div>

<div class="title">
RwL Tools
</div>

<div class="subtitle">
Username & Code Generator
</div>

</div>

<div class="menu">

<button onclick="showPage('tiktok')">
🎵 يوزرات تيك توك
</button>

<button onclick="showPage('snap')">
👻 يوزرات سناب
</button>

<button onclick="showPage('store')">
🎟️ تخمين ستور
</button>

</div>

</div>


<!-- تيك توك -->

<div id="tiktok" class="page">

<button class="back" onclick="showPage('home')">
← رجوع
</button>

<h2>🎵 يوزرات تيك توك</h2>

<div class="buttons">

<button class="action refresh"
onclick="generateTikTok()">
🔄 تجديد
</button>

<button class="action"
onclick="copyTikTok()">
📋 نسخ
</button>

</div>

<div class="counter" id="tikCounter"></div>

<div class="list" id="tikList"></div>

</div>


<!-- سناب -->

<div id="snap" class="page">

<button class="back" onclick="showPage('home')">
← رجوع
</button>

<h2>👻 يوزرات سناب</h2>

<div class="buttons">

<button class="action refresh"
onclick="generateSnap()">
🔄 تجديد
</button>

<button class="action"
onclick="copySnap()">
📋 نسخ
</button>

</div>

<div class="counter" id="snapCounter"></div>

<div class="list" id="snapList"></div>

</div>


<!-- ستور -->

<div id="store" class="page">

<button class="back" onclick="showPage('home')">
← رجوع
</button>

<h2>🎟️ تخمين ستور</h2>

<div class="buttons">

<button class="action refresh"
onclick="generateCodes()">
🔄 تجديد
</button>

<button class="action"
onclick="copyCodes()">
📋 نسخ
</button>

</div>

<div id="codes"></div>

<div class="note">
هذه رموز عشوائية تجريبية من 12 خانة.
ليست أكواد Store حقيقية ولا يوجد ضمان أنها قابلة للاسترداد.
</div>

</div>

</div>
</div>


<script>

/* =========================
   الإعدادات
========================= */

const letters =
"abcdefghijklmnopqrstuvwxyz";

const numbers =
"0123456789";

let tikUsers = [];
let snapUsers = [];
let storeCodes = [];


/* =========================
   الانتقال بين الصفحات
========================= */

function showPage(page){

    document
    .querySelectorAll(".page")
    .forEach(p =>
        p.classList.remove("active")
    );

    document
    .getElementById(page)
    .classList.add("active");

    if(page === "tiktok"){
        generateTikTok();
    }

    if(page === "snap"){
        generateSnap();
    }

    if(page === "store"){
        generateCodes();
    }
}


/* =========================
   مولد اليوزرات
   أغلبها 4 خانات
   وبعضها أطول
========================= */

function randomUsername(){

    /*
       70% رباعي
       20% خماسي
       10% أطول
    */

    const chance =
        Math.random();

    let length;

    if(chance < 0.70){
        length = 4;
    }
    else if(chance < 0.90){
        length = 5;
    }
    else{
        length =
            Math.floor(Math.random()*5)+6;
    }

    let username =
        letters[
            Math.floor(
                Math.random()*letters.length
            )
        ];

    const chars =
        letters + numbers;

    for(let i=1;i<length;i++){

        username +=
            chars[
                Math.floor(
                    Math.random()*chars.length
                )
            ];
    }

    return username;
}


/* =========================
   إنشاء قائمة بدون تكرار
========================= */

function createUsers(amount){

    const set =
        new Set();

    while(set.size < amount){

        set.add(
            randomUsername()
        );
    }

    return [...set];
}


/* =========================
   عرض اليوزرات
========================= */

function renderUsers(list, elementId){

    const box =
        document.getElementById(elementId);

    box.innerHTML = "";

    list.forEach(username => {

        const row =
            document.createElement("div");

        row.className = "item";

        row.innerHTML = `
            <span class="username">
                @${username}
            </span>

            <span class="tag">
                مرشح
            </span>
        `;

        box.appendChild(row);
    });
}


/* =========================
   تيك توك
========================= */

function generateTikTok(){

    tikUsers =
        createUsers(30);

    renderUsers(
        tikUsers,
        "tikList"
    );

    document
    .getElementById("tikCounter")
    .textContent =
        tikUsers.length +
        " يوزر";
}


/* =========================
   سناب
========================= */

function generateSnap(){

    snapUsers =
        createUsers(30);

    renderUsers(
        snapUsers,
        "snapList"
    );

    document
    .getElementById("snapCounter")
    .textContent =
        snapUsers.length +
        " يوزر";
}


/* =========================
   نسخ تيك
========================= */

function copyTikTok(){

    if(!tikUsers.length) return;

    navigator.clipboard.writeText(
        tikUsers
        .map(x => "@" + x)
        .join("\n")
    );

    alert("✅ تم نسخ يوزرات تيك توك");
}


/* =========================
   نسخ سناب
========================= */

function copySnap(){

    if(!snapUsers.length) return;

    navigator.clipboard.writeText(
        snapUsers
        .map(x => "@" + x)
        .join("\n")
    );

    alert("✅ تم نسخ يوزرات سناب");
}


/* =========================
   ستور
========================= */

function randomCode(){

    const chars =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let code = "";

    for(let i=0;i<12;i++){

        code +=
            chars[
                Math.floor(
                    Math.random()*chars.length
                )
            ];
    }

    return code;
}


function generateCodes(){

    storeCodes = [];

    const used =
        new Set();

    while(used.size < 5){

        used.add(
            randomCode()
        );
    }

    storeCodes =
        [...used];

    const box =
        document.getElementById("codes");

    box.innerHTML = "";

    storeCodes.forEach(code => {

        const div =
            document.createElement("div");

        div.className = "code";

        div.textContent =
            code;

        box.appendChild(div);
    });
}


/* =========================
   نسخ الأكواد
========================= */

function copyCodes(){

    if(!storeCodes.length) return;

    navigator.clipboard.writeText(
        storeCodes.join("\n")
    );

    alert("✅ تم نسخ الأكواد");
}


/* تشغيل أولي */

generateTikTok();

</script>

</body>
</html>
