<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>LaGranny</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    color:white;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* القائمة */

.screen{
    position:fixed;
    inset:0;
    z-index:30;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle at center,
        #191919 0%,
        #070707 55%,
        #000 100%
    );
}

.panel{
    width:90%;
    max-width:500px;

    padding:30px;

    text-align:center;

    background:rgba(5,5,5,.88);

    border:1px solid #444;
    border-radius:15px;

    box-shadow:
    0 0 50px #000,
    inset 0 0 30px #000;
}

h1{
    font-size:58px;
    margin:0 0 10px;

    letter-spacing:4px;

    color:#ddd;

    text-shadow:
    0 0 10px #700,
    0 0 30px #300;
}

h2{
    margin:10px 0 20px;
}

.sub{
    color:#888;
    margin-bottom:25px;
}

button{
    width:100%;
    padding:15px;

    margin:7px 0;

    border:1px solid #555;
    border-radius:9px;

    background:#111;
    color:white;

    font-size:18px;
}

button:active{
    transform:scale(.97);
    background:#292929;
}

.hidden{
    display:none!important;
}

/* HUD */

#hud{
    position:fixed;
    inset:0;

    z-index:8;

    pointer-events:none;
}

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:20px;

    text-shadow:
    0 0 5px black;
}

#objective{
    position:absolute;

    top:18px;
    right:18px;

    padding:10px 14px;

    border-radius:8px;

    background:#0009;

    font-size:14px;
}

#message{
    position:absolute;

    bottom:18%;

    left:50%;

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    font-size:18px;

    text-shadow:
    0 2px 8px black;
}

/* العصا */

#joystick{
    position:fixed;

    left:18px;
    bottom:20px;

    width:130px;
    height:130px;

    z-index:12;

    border:
    2px solid rgba(255,255,255,.25);

    border-radius:50%;

    touch-action:none;
}

#stick{
    position:absolute;

    left:35px;
    top:35px;

    width:56px;
    height:56px;

    border-radius:50%;

    background:#ffffff30;

    border:1px solid #fff5;
}

/* منطقة النظر */

#lookZone{
    position:fixed;

    right:0;
    top:0;

    width:62%;
    height:78%;

    z-index:10;

    touch-action:none;
}

/* أزرار اللعبة */

.action{
    position:fixed;

    right:20px;
    bottom:28px;

    width:68px;
    height:68px;

    z-index:13;

    border-radius:50%;

    background:#111b;

    border:1px solid #aaa;

    font-size:26px;
}

#runBtn{
    position:fixed;

    right:105px;
    bottom:32px;

    width:60px;
    height:60px;

    z-index:13;

    border-radius:50%;

    background:#111b;

    border:1px solid #777;

    font-size:24px;
}

#fade{
    position:fixed;
    inset:0;

    z-index:50;

    background:#000;

    opacity:0;

    pointer-events:none;

    transition:
    opacity 1s;
}

.small{
    color:#888;
    font-size:13px;
    line-height:1.7;
}
</style>
</head>

<body>

<!-- القائمة الرئيسية -->

<div id="menu" class="screen">

    <div class="panel">

        <h1>LaGranny</h1>

        <div class="sub">
            لا تثق بالظلام...
        </div>

        <button id="play">
            لعب
        </button>

        <button id="settings">
            إعدادات
        </button>

        <div class="small">
            ابحث عن طريق الهروب قبل أن يجدك شيء في البيت.
        </div>

    </div>

</div>


<!-- اختيار الصعوبة -->

<div id="modes" class="screen hidden">

    <div class="panel">

        <h2>
            اختر وضع اللعب
        </h2>

        <button data-mode="easy">
            سهل
        </button>

        <button data-mode="normal">
            عادي
        </button>

        <button data-mode="hard">
            صعب
        </button>

        <button id="back1">
            رجوع
        </button>

    </div>

</div>


<!-- الإعدادات -->

<div id="settingsPanel" class="screen hidden">

    <div class="panel">

        <h2>
            الإعدادات
        </h2>

        <button id="soundBtn">
            الصوت: تشغيل
        </button>

        <button id="lookBtn">
            حساسية النظر: متوسطة
        </button>

        <button id="back2">
            رجوع
        </button>

    </div>

</div>


<!-- المشهد السينمائي -->

<div id="intro" class="screen hidden">

    <div class="panel">

        <h2 id="introText">
            ...
        </h2>

        <div class="small">
            المشهد السينمائي
        </div>

    </div>

</div>


<!-- واجهة اللعب -->

<div id="hud" class="hidden">

    <div id="objective">
        الهدف: استكشف البيت
    </div>

    <div id="crosshair">
        +
    </div>

    <div id="message"></div>

</div>


<!-- التحكم -->

<div id="joystick" class="hidden">

    <div id="stick"></div>

</div>


<div id="lookZone" class="hidden"></div>


<button id="runBtn" class="hidden">
    🏃
</button>


<button id="action" class="action hidden">
    ✋
</button>


<div id="fade"></div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================
   المتغيرات
========================= */

const $ = id =>
document.getElementById(id);


const menu =
$("menu");

const modes =
$("modes");

const settings =
$("settingsPanel");

const intro =
$("intro");

const hud =
$("hud");

const joystick =
$("joystick");

const lookZone =
$("lookZone");

const action =
$("action");

const runBtn =
$("runBtn");

const fade =
$("fade");


let scene;

let camera;

let renderer;

let flashlight;

let enemy;

let key;

let battery;

let exitDoor;

let game = false;

let dead = false;

let won = false;

let mode = "normal";

let sound = true;

let sensitivity = .004;

let yaw = 0;

let pitch = 0;

let enemyAwake = false;

let cinematic = false;

let hasKey = false;

let stamina = 1;

let audioCtx;


/* =========================
   اللاعب
========================= */

const player = {

    x:0,

    y:1.65,

    z:7

};


/* =========================
   الصعوبة
========================= */

const difficulty = {

    easy:{
        enemy:.7
    },

    normal:{
        enemy:1
    },

    hard:{
        enemy:1.45
    }

};


/* =========================
   القائمة
========================= */

$("play").onclick = ()=>{

    menu.classList.add("hidden");

    modes.classList.remove("hidden");

};


$("settings").onclick = ()=>{

    menu.classList.add("hidden");

    settings.classList.remove("hidden");

};


$("back1").onclick = ()=>{

    modes.classList.add("hidden");

    menu.classList.remove("hidden");

};


$("back2").onclick = ()=>{

    settings.classList.add("hidden");

    menu.classList.remove("hidden");

};


$("soundBtn").onclick = ()=>{

    sound = !sound;

    $("soundBtn").textContent =
    "الصوت: " +
    (sound ? "تشغيل" : "إيقاف");

};


$("lookBtn").onclick = ()=>{

    if(sensitivity === .004){

        sensitivity = .006;

        $("lookBtn").textContent =
        "حساسية النظر: عالية";

    }else{

        sensitivity = .004;

        $("lookBtn").textContent =
        "حساسية النظر: متوسطة";

    }

};


document
.querySelectorAll("[data-mode]")
.forEach(button=>{

    button.onclick = ()=>{

        mode =
        button.dataset.mode;

        modes.classList.add("hidden");

        startGame();

    };

});


/* =========================
   الصوت
========================= */

function beep(
    frequency=100,
    duration=.15,
    type="sine",
    volume=.04
){

    if(!sound)return;

    try{

        audioCtx ||=

        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        const oscillator =
        audioCtx.createOscillator();

        const gain =
        audioCtx.createGain();

        oscillator.type =
        type;

        oscillator.frequency.value =
        frequency;

        gain.gain.value =
        volume;

        oscillator.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        oscillator.start();

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioCtx.currentTime + duration
        );

        oscillator.stop(
            audioCtx.currentTime + duration
        );

    }catch(e){}

}


function horrorSound(){

    beep(
        45,
        .7,
        "sawtooth",
        .025
    );

    setTimeout(()=>{

        beep(
            30,
            .8,
            "triangle",
            .02
        );

    },180);

}


/* =========================
   المواد
========================= */

function material(
    color,
    roughness=1,
    metalness=0
){

    return new THREE.MeshStandardMaterial({

        color,

        roughness,

        metalness

    });

}


/* =========================
   إنشاء جدار
========================= */

function wall(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color=0x302a28
){

    const mesh =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            sx,
            sy,
            sz
        ),

        material(color)

    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;

}


/* =========================
   إنشاء غرض
========================= */

function object(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color,
    rotation=0
){

    const mesh =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            sx,
            sy,
            sz
        ),

        material(color)

    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.rotation.y =
    rotation;

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;

}


/* =========================
   رسالة
========================= */

function message(
    text,
    duration=2200
){

    $("message").textContent =
    text;

    clearTimeout(
        message.timer
    );

    message.timer =
    setTimeout(()=>{

        $("message").textContent =
        "";

    },duration);

}


/* =========================
   الهدف
========================= */

function objective(text){

    $("objective").textContent =
    "الهدف: " + text;

}


/* =========================
   بناء البيت
========================= */

function createHouse(){

    /* الأرض */

    const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            28,
            24
        ),

        material(0x25201e)

    );

    floor.rotation.x =
    -Math.PI/2;

    floor.receiveShadow =
    true;

    scene.add(floor);


    /* الجدران الخارجية */

    wall(
        0,
        2,
        -11,
        22,
        4,
        .35
    );

    wall(
        -11,
        2,
        0,
        .35,
        4,
        22
    );

    wall(
        11,
        2,
        0,
        .35,
        4,
        22
    );


    /* تقسيمات البيت */

    wall(
        -5.5,
        2,
        -2,
        .3,
        4,
        10
    );

    wall(
        5.5,
        2,
        -2,
        .3,
        4,
        10
    );


    /* طاولة */

    object(
        -8,
        1.1,
        6,
        2.2,
        2.2,
        .25,
        0x3a2c22
    );


    /* كرسي */

    object(
        8,
        1,
        4,
        2,
        2,
        .2,
        0x242424
    );


    /* السرير */

    object(
        0,
        .55,
        7,
        3,
        .35,
        5,
        0x2d2020
    );

    object(
        0,
        .9,
        7,
        2.8,
        .45,
        4.8,
        0x16171a
    );


    /* مصابيح البيت */

    const lights = [

        [0,3.7,3],

        [-8,3,7],

        [8,3,-7]

    ];


    lights.forEach(position=>{

        const light =
        new THREE.PointLight(
            0xffb36b,
            .45,
            6
        );

        light.position.set(
            ...position
        );

        scene.add(light);


        const bulb =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .08,
                10,
                10
            ),

            new THREE.MeshBasicMaterial({
                color:0xffd0a0
            })

        );

        bulb.position.set(
            ...position
        );

        scene.add(bulb);

    });


    /* باب الخروج */

    exitDoor =
    object(
        0,
        1.5,
        -10.75,
        2.5,
        3,
        .25,
        0x3a1e17
    );


    /* المفتاح */

    key =
    object(
        -7,
        1.05,
        6,
        .65,
        .08,
        .12,
        0xd7a72d
    );

    key.rotation.z =
    .35;


    /* البطارية */

    battery =
    object(
        8,
        .75,
        4,
        .28,
        .55,
        .28,
        0x888888
    );

}


/* =========================
   إنشاء الوحش
========================= */

function createEnemy(){

    enemy =
    new THREE.Group();


    const body =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .48,
            1.15,
            8,
            16
        ),

        material(0x241719)

    );

    body.position.y =
    1.05;

    enemy.add(body);


    const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .48,
            20,
            20
        ),

        material(0x9d8c80)

    );

    head.position.y =
    2.05;

    enemy.add(head);


    /* العيون */

    const eyeMaterial =
    new THREE.MeshBasicMaterial({
        color:0xff1111
    });


    for(
        const x of [-.16,.16]
    ){

        const eye =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .045,
                8,
                8
            ),

            eyeMaterial

        );

        eye.position.set(
            x,
            2.12,
            .42
        );

        enemy.add(eye);

    }


    enemy.position.set(
        0,
        0,
        -7
    );


    enemy.visible =
    false;


    scene.add(enemy);

}


/* =========================
   إنشاء اللعبة
========================= */

function init(){

    scene =
    new THREE.Scene();


    scene.background =
    new THREE.Color(
        0x030303
    );


    scene.fog =
    new THREE.Fog(
        0x030303,
        3,
        27
    );


    camera =
    new THREE.PerspectiveCamera(
        74,
        innerWidth / innerHeight,
        .05,
        100
    );


    camera.rotation.order =
    "YXZ";


    renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });


    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            1.7
        )
    );


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.shadowMap.enabled =
    true;


    document.body.insertBefore(
        renderer.domElement,
        document.body.firstChild
    );


    /* إضاءة عامة */

    const ambient =
    new THREE.HemisphereLight(
        0x777777,
        0x070707,
        .28
    );

    scene.add(ambient);


    /* ضوء القمر */

    const moon =
    new THREE.DirectionalLight(
        0x8b9bb0,
        .55
    );

    moon.position.set(
        -5,
        10,
        4
    );

    moon.castShadow =
    true;

    scene.add(moon);


    /* الكشاف */

    flashlight =
    new THREE.SpotLight(
        0xfff4dc,
        5,
        18,
        Math.PI/8,
        .5,
        1
    );

    flashlight.castShadow =
    true;

    scene.add(flashlight);

    scene.add(
        flashlight.target
    );


    createHouse();

    createEnemy();

    bindControls();


    window.addEventListener(
        "resize",
        resize
    );

}


/* =========================
   تغيير حجم الشاشة
========================= */

function resize(){

    camera.aspect =
    innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

}


/* =========================
   التحكم
========================= */

function bindControls(){

    /* كيبورد */

    window.addEventListener(
        "keydown",
        event=>{

            keys.add(
                event.code
            );

            if(
                event.code ===
                "KeyE"
            ){

                interact();

            }

        }
    );


    window.addEventListener(
        "keyup",
        event=>{

            keys.delete(
                event.code
            );

        }
    );


    /* العصا */

    let startX=0;

    let startY=0;

    let joystickActive=false;


    joystick.addEventListener(
        "pointerdown",
        event=>{

            joystickActive=true;

            startX =
            event.clientX;

            startY =
            event.clientY;

            joystick.setPointerCapture(
                event.pointerId
            );

        }
    );


    joystick.addEventListener(
        "pointermove",
        event=>{

            if(!joystickActive)
                return;


            const dx =
            event.clientX -
            startX;

            const dy =
            event.clientY -
            startY;


            const x =
            Math.max(
                -30,
                Math.min(
                    30,
                    dx
                )
            );


            const y =
            Math.max(
                -30,
                Math.min(
                    30,
                    dy
                )
            );


            $("stick").style.transform =
            `translate(${x}px,${y}px)`;

        }
    );


    joystick.addEventListener(
        "pointerup",
        event=>{

            joystickActive=false;

            $("stick").style.transform =
            "translate(0,0)";

        }
    );


    /* النظر */

    let lookActive=false;

    let lastX=0;

    let lastY=0;


    lookZone.addEventListener(
        "pointerdown",
        event=>{

            lookActive=true;

            lastX =
            event.clientX;

            lastY =
            event.clientY;

            lookZone.setPointerCapture(
                event.pointerId
            );

        }
    );


    lookZone.addEventListener(
        "pointermove",
        event=>{

            if(!lookActive)
                return;


            const dx =
            event.clientX -
            lastX;


            const dy =
            event.clientY -
            lastY;


            lastX =
            event.clientX;

            lastY =
            event.clientY;


            yaw -=
            dx * sensitivity;


            pitch -=
            dy * sensitivity;


            pitch =
            Math.max(
                -1.25,
                Math.min(
                    1.25,
                    pitch
                )
            );

        }
    );


    lookZone.addEventListener(
        "pointerup",
        ()=>{

            lookActive=false;

        }
    );


    /* زر الركض */

    runBtn.addEventListener(
        "pointerdown",
        ()=>{
            keys.add("ShiftLeft");
        }
    );


    runBtn.addEventListener(
        "pointerup",
        ()=>{
            keys.delete("ShiftLeft");
        }
    );


    /* زر التفاعل */

    action.onclick =
    interact;

}


/* =========================
   لوحة المفاتيح
========================= */

const keys =
new Set();


/* =========================
   بدء اللعبة
========================= */

function startGame(){

    init();

    game=true;

    intro.classList.remove(
        "hidden"
    );

    cinematic=true;

    introSequence();

}


/* =========================
   المشهد السينمائي
========================= */

function introSequence(){

    const lines = [

        "أين أنا؟",

        "البيت... كان فارغًا.",

        "سمعت شيئًا في الطابق السفلي.",

        "لازم أطلع من هنا."

    ];


    let index=0;


    $("introText").textContent =
    lines[index++];


    beep(
        80,
        .25
    );


    const timer =
    setInterval(()=>{

        if(
            index <
            lines.length
        ){

            $("introText").textContent =
            lines[index++];

            horrorSound();

        }else{

            clearInterval(timer);


            intro.classList.add(
                "hidden"
            );


            hud.classList.remove(
                "hidden"
            );


            joystick.classList.remove(
                "hidden"
            );


            lookZone.classList.remove(
                "hidden"
            );


            action.classList.remove(
                "hidden"
            );


            runBtn.classList.remove(
                "hidden"
            );


            cinematic=false;


            enemyAwake=true;

            enemy.visible=true;


            objective(
                "ابحث عن المفتاح 🔑"
            );


            message(
                "المفتاح في مكان ما داخل البيت..."
            );

        }

    },2200);

}


/* =========================
   حساب المسافة
========================= */

function distance(
    a,
    b
){

    return Math.hypot(
        a.x-b.x,
        a.z-b.z
    );

}


/* =========================
   حركة اللاعب
========================= */

function move(dt){

    let forward=0;

    let side=0;


    if(
        keys.has("KeyW")
    )
        forward++;


    if(
        keys.has("KeyS")
    )
        forward--;


    if(
        keys.has("KeyD")
    )
        side++;


    if(
        keys.has("KeyA")
    )
        side--;


    /* قراءة العصا */

    const transform =
    getComputedStyle(
        $("stick")
    ).transform;


    if(
        transform &&
        transform !== "none"
    ){

        const matrix =
        new DOMMatrix(
            transform
        );


        side +=
        matrix.m41 / 30;


        forward -=
        matrix.m42 / 30;

    }


    const length =
    Math.hypot(
        forward,
        side
    );


    if(length>0){

        forward/=length;

        side/=length;

    }


    /* الركض */

    const running =
    keys.has("ShiftLeft") &&
    stamina>.02;


    const speed =
    running ?
    4 :
    2.35;


    if(running){

        stamina =
        Math.max(
            0,
            stamina -
            dt*.32
        );

    }else{

        stamina =
        Math.min(
            1,
            stamina +
            dt*.18
        );

    }


    const movement =
    speed*dt;


    const sin =
    Math.sin(yaw);


    const cos =
    Math.cos(yaw);


    player.x +=
    (
        side*cos +
        forward*sin
    ) * movement;


    player.z +=
    (
        -side*sin +
        forward*cos
    ) * movement;


    /* حدود البيت */

    player.x =
    Math.max(
        -9.7,
        Math.min(
            9.7,
            player.x
        )
    );


    player.z =
    Math.max(
        -9.7,
        Math.min(
            9.7,
            player.z
        )
    );


    camera.position.set(
        player.x,
        player.y,
        player.z
    );


    camera.rotation.set(
        pitch,
        yaw,
        0
    );

}


/* =========================
   التفاعل مع الأشياء
========================= */

function interact(){

    if(
        !game ||
        dead ||
        won
    )
        return;


    /* المفتاح */

    if(
        key.visible &&
        distance(
            player,
            key.position
        ) < 1.6
    ){

        hasKey=true;

        key.visible=false;

        beep(
            700,
            .15
        );


        message(
            "أخذت المفتاح 🔑"
        );


        objective(
            "اذهب إلى باب الخروج"
        );


        return;

    }


    /* البطارية */

    if(
        battery.visible &&
        distance(
            player,
            battery.position
        ) < 1.5
    ){

        battery.visible=false;

        beep(
            500,
            .12
        );


        flashlight.intensity=8;


        message(
            "وجدت بطارية. الكشاف أصبح أقوى."
        );


        return;

    }


    /* باب الخروج */

    if(
        distance(
            player,
            exitDoor.position
        ) < 2
    ){

        if(hasKey){

            won=true;

            endGame(true);

        }else{

            message(
                "الباب مقفل... تحتاج إلى المفتاح."
            );

        }

        return;

    }


    message(
        "لا يوجد شيء مهم هنا."
    );

}


/* =========================
   ذكاء الشرير
========================= */

function enemyAI(dt){

    if(!enemyAwake)
        return;


    const dx =
    player.x -
    enemy.position.x;


    const dz =
    player.z -
    enemy.position.z;


    const dist =
    Math.hypot(
        dx,
        dz
    );


    if(dist<12){

        const speed =
        .55 *
        difficulty[mode].enemy *
        (
            dist<7 ?
            1.25 :
            .5
        );


        enemy.position.x +=
        (
            dx/dist
        ) *
        Math.min(
            speed*dt,
            .04
        );


        enemy.position.z +=
        (
            dz/dist
        ) *
        Math.min(
            speed*dt,
            .04
        );


        enemy.lookAt(
            player.x,
            1,
            player.z
        );

    }


    /* إذا اقترب */

    if(dist<1.15){

        dead=true;

        endGame(false);

    }


    /* أصوات عشوائية */

    if(
        Math.random()<.002
    ){

        horrorSound();

    }

}


/* =========================
   نهاية اللعبة
========================= */

function endGame(win){

    game=false;


    hud.classList.add(
        "hidden"
    );


    joystick.classList.add(
        "hidden"
    );


    lookZone.classList.add(
        "hidden"
    );


    action.classList.add(
        "hidden"
    );


    runBtn.classList.add(
        "hidden"
    );


    fade.style.opacity=1;


    setTimeout(()=>{

        fade.style.opacity=0;


        menu.classList.remove(
            "hidden"
        );


        const panel =
        menu.querySelector(
            ".panel"
        );


        if(win){

            panel.innerHTML = `

                <h1>
                    LaGranny
                </h1>

                <h2>
                    نجوت... مؤقتًا.
                </h2>

                <p class="sub">
                    خرجت من البيت، لكن الكابوس لم ينتهِ.
                </p>

                <button id="again">
                    العب من جديد
                </button>

            `;

        }else{

            panel.innerHTML = `

                <h1>
                    LaGranny
                </h1>

                <h2>
                    لقد وجدتك...
                </h2>

                <p class="sub">
                    المحاولة انتهت.
                </p>

                <button id="again">
                    حاول مرة أخرى
                </button>

            `;

        }


        $("again").onclick =
        ()=>{
            location.reload();
        };


    },1000);

}


/* =========================
   حلقة اللعبة
========================= */

function animate(time){

    requestAnimationFrame(
        animate
    );


    const dt =
    Math.min(
        .05,
        (time -
        (animate.last || time))
        /1000
    );


    animate.last=time;


    if(
        game &&
        !cinematic
    ){

        move(dt);

        enemyAI(dt);


        /* الكشاف */

        flashlight.position.copy(
            camera.position
        );


        flashlight.target.position.set(

            camera.position.x -
            Math.sin(yaw),

            camera.position.y +
            Math.sin(pitch),

            camera.position.z -
            Math.cos(yaw)

        );

    }


    if(renderer){

        renderer.render(
            scene,
            camera
        );

    }

}


animate(0);


/* تشغيل القائمة بدون WebGL قبل البداية */

</script>
