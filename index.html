<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RwL Store Checker</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;

  display: flex;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(circle at 15% 20%, rgba(55,90,255,.20), transparent 35%),
    radial-gradient(circle at 85% 80%, rgba(145,40,220,.20), transparent 35%),
    #020205;

  font-family: Arial, sans-serif;
  color: white;
}

/* خلفية */

body::before {
  content: "";
  position: fixed;

  width: 420px;
  height: 420px;

  border-radius: 50%;

  background: rgba(50,90,255,.18);

  filter: blur(100px);

  top: -180px;
  left: -150px;

  animation: glow1 8s infinite alternate;
}

body::after {
  content: "";
  position: fixed;

  width: 420px;
  height: 420px;

  border-radius: 50%;

  background: rgba(150,40,220,.16);

  filter: blur(100px);

  right: -150px;
  bottom: -180px;

  animation: glow2 9s infinite alternate;
}

@keyframes glow1 {
  from {
    transform: translate(0,0);
  }

  to {
    transform: translate(120px,80px);
  }
}

@keyframes glow2 {
  from {
    transform: translate(0,0);
  }

  to {
    transform: translate(-100px,-70px);
  }
}

/* النجوم */

.stars {
  position: fixed;
  inset: 0;

  pointer-events: none;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.7) 1px,
      transparent 1px
    );

  background-size: 55px 55px;

  opacity: .12;

  animation: stars 15s linear infinite;
}

@keyframes stars {

  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(55px);
  }

}

/* البطاقة */

.card {
  position: relative;
  z-index: 2;

  width: min(100%, 370px);

  padding: 28px;

  border-radius: 28px;

  background:
    linear-gradient(
      145deg,
      rgba(32,32,42,.97),
      rgba(7,7,11,.98)
    );

  border: 1px solid rgba(255,255,255,.13);

  box-shadow:
    0 30px 90px rgba(0,0,0,.8),
    inset 0 1px 0 rgba(255,255,255,.08);

  backdrop-filter: blur(20px);

  animation: floating 5s ease-in-out infinite;
}

@keyframes floating {

  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-6px);
  }

}

/* RwL */

.brand {

  text-align: center;

  font-size: 48px;

  font-weight: 900;

  letter-spacing: 8px;

  background:
    linear-gradient(
      90deg,
      #fff,
      #80aaff,
      #fff,
      #c58cff,
      #fff
    );

  background-size: 300%;

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  animation: shine 4s linear infinite;
}

@keyframes shine {

  from {
    background-position: 0%;
  }

  to {
    background-position: 300%;
  }

}

/* العنوان */

.subtitle {

  text-align: center;

  color: #888;

  font-size: 10px;

  letter-spacing: 3px;

  margin-top: 4px;
  margin-bottom: 23px;
}

/* عنوان الإدخال */

.label {

  display: block;

  color: #bbb;

  font-size: 12px;

  margin-bottom: 8px;
}

/* الإدخال */

#codeInput {

  width: 100%;
  height: 54px;

  padding: 0 14px;

  border-radius: 14px;

  border: 1px solid #34343e;

  outline: none;

  background: #030305;

  color: white;

  text-align: center;

  direction: ltr;

  font-size: 16px;

  font-weight: bold;

  letter-spacing: 2px;

  transition: .25s;
}

#codeInput:focus {

  border-color: #637cff;

  box-shadow:
    0 0 22px rgba(80,110,255,.20);
}

/* النتيجة */

.status {

  min-height: 58px;

  display: flex;

  align-items: center;

  justify-content: center;

  text-align: center;

  margin-top: 12px;

  padding: 12px;

  border-radius: 14px;

  background: #08080c;

  border: 1px solid #25252d;

  color: #999;

  font-size: 12px;

  line-height: 1.6;
}

/* الأزرار */

button {

  width: 100%;

  min-height: 47px;

  margin-top: 9px;

  padding: 11px;

  border: 0;

  border-radius: 12px;

  font-size: 14px;

  font-weight: bold;

  cursor: pointer;

  transition: .2s;
}

button:active {
  transform: scale(.96);
}

/* فحص */

.check {

  background:
    linear-gradient(
      90deg,
      #fff,
      #dce6ff,
      #fff
    );

  color: #050507;
}

/* نسخ */

.copy {

  background: #292930;

  color: white;
}

/* الاسترداد */

.redeem {

  background:
    linear-gradient(
      90deg,
      #00bfff,
      #4169ff
    );

  color: white;

  box-shadow:
    0 8px 28px rgba(40,100,255,.22);
}

/* مسح */

.clear {

  background: transparent;

  border: 1px solid #30303a;

  color: #999;
}

/* المعلومة */

.info {

  margin-top: 17px;

  padding-top: 14px;

  border-top: 1px solid rgba(255,255,255,.08);

  text-align: center;

  font-size: 9px;

  line-height: 1.8;

  color: #666;
}

.footer {

  margin-top: 12px;

  text-align: center;

  font-size: 8px;

  color: #555;

  letter-spacing: 3px;
}

</style>
</head>


<body>

<div class="stars"></div>


<div class="card">

  <div class="brand">
    RwL
  </div>

  <div class="subtitle">
    PLAYSTATION STORE CHECKER
  </div>


  <label class="label">
    أدخل رمز PlayStation Store
  </label>


  <input
    id="codeInput"
    type="text"
    maxlength="12"
    autocomplete="off"
    autocapitalize="characters"
    spellcheck="false"
    placeholder="XXXXXXXXXXXX"
  >


  <div
    id="status"
    class="status"
    aria-live="polite">

    بانتظار إدخال الرمز

  </div>


  <button
    class="check"
    type="button"
    onclick="checkCode()">

    فحص الرمز

  </button>


  <button
    class="copy"
    type="button"
    onclick="copyCode()">

    نسخ الرمز

  </button>


  <button
    class="redeem"
    type="button"
    onclick="openRedeem()">

    التحقق الرسمي من PlayStation

  </button>


  <button
    class="clear"
    type="button"
    onclick="clearCode()">

    مسح

  </button>


  <div class="info">

    الفحص الأولي يتم داخل الأداة فقط.<br>
    لمعرفة صلاحية الرمز فعليًا استخدم التحقق الرسمي.

  </div>


  <div class="footer">
    RwL • STORE • CHECKER
  </div>

</div>


<script>

/* =========================
   عناصر الصفحة
========================= */

const input =
  document.getElementById("codeInput");

const status =
  document.getElementById("status");


/* =========================
   تنظيف الإدخال
========================= */

input.addEventListener(
  "input",
  function () {

    let value =
      input.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

    input.value = value;

  }
);


/* =========================
   فحص الرمز
========================= */

function checkCode() {

  const code =
    input.value.trim();


  if (code.length === 0) {

    setStatus(
      "اكتب الرمز أولًا.",
      "#ffcc66"
    );

    return;
  }


  if (code.length !== 12) {

    setStatus(
      "✕ الرمز يجب أن يتكون من 12 خانة.",
      "#ff7777"
    );

    return;
  }


  const valid =
    /^[A-Z0-9]{12}$/.test(code);


  if (!valid) {

    setStatus(
      "✕ صيغة الرمز غير صحيحة.",
      "#ff7777"
    );

    return;
  }


  setStatus(
    "✓ صيغة الرمز صحيحة.\n\nالصلاحية الفعلية تحتاج التحقق من PlayStation.",
    "#8cffb0"
  );

}


/* =========================
   تغيير الحالة
========================= */

function setStatus(
  message,
  color
) {

  status.textContent =
    message;

  status.style.color =
    color;

}


/* =========================
   نسخ
========================= */

function copyCode() {

  const code =
    input.value.trim();


  if (!code) {

    setStatus(
      "لا يوجد رمز لنسخه.",
      "#ffcc66"
    );

    return;
  }


  if (
    navigator.clipboard &&
    window.isSecureContext
  ) {

    navigator.clipboard
      .writeText(code)
      .then(function () {

        setStatus(
          "✓ تم نسخ الرمز.",
          "#8cffb0"
        );

      })
      .catch(function () {

        fallbackCopy(code);

      });

  } else {

    fallbackCopy(code);

  }

}


/* =========================
   نسخ احتياطي
========================= */

function fallbackCopy(code) {

  const textarea =
    document.createElement("textarea");

  textarea.value = code;

  textarea.style.position =
    "fixed";

  textarea.style.opacity =
    "0";

  document.body.appendChild(
    textarea
  );

  textarea.select();

  try {

    document.execCommand("copy");

    setStatus(
      "✓ تم نسخ الرمز.",
      "#8cffb0"
    );

  } catch (error) {

    setStatus(
      "تعذر النسخ تلقائيًا.",
      "#ff7777"
    );

  }

  document.body.removeChild(
    textarea
  );

}


/* =========================
   فتح PlayStation
========================= */

function openRedeem() {

  window.open(
    "https://store.playstation.com/",
    "_blank"
  );

}


/* =========================
   مسح
========================= */

function clearCode() {

  input.value = "";

  setStatus(
    "بانتظار إدخال الرمز",
    "#999"
  );

  input.focus();

}


/* =========================
   Enter
========================= */

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      checkCode();

    }

  }
);

</script>

</body>
</html>
