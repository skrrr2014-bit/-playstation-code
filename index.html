<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RwL — فك الشفرة</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
    overflow:hidden;
}

body{
    min-height:100vh;
}

/* ===== الخلفية المرعبة ===== */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,
        #350008 0%,
        #100005 18%,
        #030003 48%,
        #000 100%);
}

.bg:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            rgba(255,0,35,.035) 1px,
            transparent 3px
        );
    animation:scan 4s linear infinite;
}

@keyframes scan{
    from{transform:translateY(-30px)}
    to{transform:translateY(30px)}
}

/* ضباب */

.fog{
    position:absolute;
    width:65vw;
    height:65vw;
    border-radius:50%;
    filter:blur(100px);
    opacity:.25;
    background:#800018;
    animation:fog 8s infinite alternate ease-in-out;
}

.fog1{
    top:-25%;
    right:-20%;
}

.fog2{
    bottom:-30%;
    left:-20%;
    animation-delay:-4s;
}

@keyframes fog{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(120px,-80px) scale(1.4);
    }
}

/* جسيمات */

.particles span{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#ff1744;
    box-shadow:0 0 10px #ff1744;
    animation:rise linear infinite;
}

@keyframes rise{
    from{
        transform:translateY(110vh);
        opacity:0;
    }
    15%{opacity:1}
    80%{opacity:.8}
    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}

/* ===== العين ===== */

.eye{
    position:absolute;
    left:50%;
    top:50%;
    width:210px;
    height:110px;
    transform:translate(-50%,-50%);
    opacity:.12;
    animation:eyeFloat 5s ease-in-out infinite;
}

.eyeShape{
    position:absolute;
    inset:0;
    border:3px solid #ff1744;
    border-radius:80% 5% 80% 5%;
    transform:rotate(45deg);
    box-shadow:
        0 0 20px #ff1744,
        inset 0 0 30px rgba(255,0,40,.4);
}

.pupil{
    position:absolute;
    left:50%;
    top:50%;
    width:48px;
    height:48px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:#050000;
    border:5px solid #ff1744;
    box-shadow:
        0 0 15px #ff1744,
        0 0 60px #ff003c;
}

.pupil:after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:12px;
    height:12px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    background:#fff;
    box-shadow:0 0 15px #fff;
}

@keyframes eyeFloat{
    0%,100%{
        transform:translate(-50%,-50%) scale(1);
    }
    50%{
        transform:translate(-50%,-51%) scale(1.08);
    }
}

/* ===== الشاشة ===== */

.screen{
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:min(420px,100%);
    padding:35px 25px;
    border-radius:25px;
    background:rgba(4,2,4,.86);
    border:1px solid rgba(255,20,65,.3);
    box-shadow:
        0 0 35px rgba(255,0,40,.15),
        0 0 100px rgba(255,0,40,.05);
    backdrop-filter:blur(18px);
    text-align:center;
}

/* ===== الشعار ===== */

.logo{
    font-size:65px;
    font-weight:900;
    letter-spacing:12px;
    margin-right:-12px;
    text-shadow:
        0 0 8px #fff,
        0 0 20px #ff1744,
        0 0 50px #ff003c;
    animation:glitch 3s infinite;
}

@keyframes glitch{
    0%,88%,100%{
        transform:none;
        text-shadow:
        0 0 8px #fff,
        0 0 20px #ff1744,
        0 0 50px #ff003c;
    }

    89%{
        transform:skewX(12deg);
    }

    90%{
        transform:translateX(-8px);
        text-shadow:
        5px 0 #00ffff,
        -5px 0 #ff003c;
    }

    91%{
        transform:translateX(8px);
    }

    92%{
        transform:none;
    }
}

.sub{
    color:#777;
    font-size:11px;
    letter-spacing:5px;
    margin-top:3px;
}

.skull{
    font-size:38px;
    margin:25px 0 10px;
    filter:drop-shadow(0 0 12px #ff1744);
}

.title{
    font-size:24px;
    font-weight:bold;
}

.desc{
    color:#777;
    font-size:12px;
    margin:8px 0 25px;
}

/* ===== الإدخال ===== */

.pin{
    width:100%;
    height:58px;
    background:#030203;
    color:#fff;
    border:1px solid #40101c;
    border-radius:14px;
    outline:none;
    text-align:center;
    font-size:28px;
    letter-spacing:16px;
    direction:ltr;
    transition:.3s;
}

.pin:focus{
    border-color:#ff1744;
    box-shadow:
        0 0 15px rgba(255,0,50,.2),
        inset 0 0 15px rgba(255,0,50,.05);
}

button{
    width:100%;
    height:55px;
    border:0;
    border-radius:14px;
    margin-top:15px;
    color:#fff;
    font-weight:bold;
    font-size:16px;
    background:
        linear-gradient(135deg,#ff1744,#65000f);
    box-shadow:0 0 25px rgba(255,0,45,.2);
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

.error{
    height:20px;
    margin-top:12px;
    color:#ff4568;
    font-size:12px;
}

/* ===== تأثير وميض ===== */

.flash{
    position:fixed;
    inset:0;
    background:#ff003c;
    opacity:0;
    pointer-events:none;
    z-index:20;
}

.flash.active{
    animation:flash .25s;
}

@keyframes flash{
    0%{opacity:.2}
    100%{opacity:0}
}

/* ===== التطبيق ===== */

#app{
    display:none;
    position:relative;
    z-index:10;
    min-height:100vh;
    padding:20px;
    overflow:auto;
}

.container{
    max-width:850px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.brand{
    font-size:32px;
    font-weight:900;
    letter-spacing:5px;
    text-shadow:0 0 25px #ff1744;
}

.status{
    padding:8px 12px;
    border-radius:30px;
    font-size:11px;
    color:#ff5270;
    border:1px solid #3b0d19;
    background:#080307;
}

.panel{
    background:rgba(5,3,5,.88);
    border:1px solid rgba(255,20,65,.2);
    border-radius:22px;
    padding:20px;
    backdrop-filter:blur(18px);
}

label{
    color:#888;
    font-size:12px;
}

.search{
    display:flex;
    gap:10px;
    margin-top:9px;
}

.search input{
    flex:1;
    min-width:0;
    height:54px;
    border-radius:13px;
    border:1px solid #35101b;
    background:#020102;
    color:#fff;
    outline:none;
    padding:0 15px;
    font-size:16px;
    direction:ltr;
}

.search button{
    width:110px;
    margin:0;
}

.info{
    margin-top:20px;
    padding:20px;
    border-radius:17px;
    background:#070507;
    border:1px solid #251018;
}

.profile{
    display:flex;
    gap:15px;
    align-items:center;
}

.avatar{
    width:72px;
    height:72px;
    border-radius:50%;
    border:2px solid #ff1744;
    box-shadow:0 0 20px rgba(255,0,50,.3);
    object-fit:cover;
    background:#100308;
}

.name{
    font-size:20px;
    font-weight:bold;
}

.handle{
    color:#ff5270;
    direction:ltr;
    text-align:right;
    margin-top:5px;
}

.bio{
    color:#888;
    margin-top:6px;
    font-size:12px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.stat{
    text-align:center;
    padding:14px 5px;
    border-radius:12px;
    background:#0b070a;
    border:1px solid #211018;
}

.stat b{
    display:block;
    font-size:18px;
}

.stat span{
    color:#666;
    font-size:10px;
}

.notice{
    margin-top:15px;
    text-align:center;
    color:#666;
    font-size:10px;
    line-height:1.7;
}

@media(max-width:500px){
    .logo{font-size:53px}
    .search{flex-direction:column}
    .search button{width:100%}
}
</style>
</head>

<body>

<div class="bg">
    <div class="fog fog1"></div>
    <div class="fog fog2"></div>

    <div class="eye">
        <div class="eyeShape"></div>
        <div class="pupil"></div>
    </div>

    <div class="particles" id="particles"></div>
</div>

<div class="flash" id="flash"></div>

<!-- LOGIN -->

<section class="screen" id="login">

    <div class="box">

        <div class="logo">RwL</div>
        <div class="sub">DARK ACCESS SYSTEM</div>

        <div class="skull">☠</div>

        <div class="title">فك الشفرة</div>

        <div class="desc">
            أدخل رمز الوصول المكوّن من أربعة أرقام
        </div>

        <input
            id="pin"
            class="pin"
            type="password"
            maxlength="4"
            inputmode="numeric"
            autocomplete="off"
            placeholder="••••"
        >

        <button onclick="unlock()">
            فتح النظام
        </button>

        <div class="error" id="error"></div>

    </div>

</section>


<!-- APP -->

<section id="app">

    <div class="container">

        <div class="header">
            <div class="brand">RwL</div>
            <div class="status">● SYSTEM ACTIVE</div>
        </div>

        <div class="panel">

            <label>أدخل اسم مستخدم TikTok</label>

            <div class="search">

                <input
                    id="username"
                    placeholder="@username"
                    autocomplete="off"
                >

                <button onclick="searchUser()">
                    فحص
                </button>

            </div>

            <div class="info" id="info" style="display:none">

                <div class="profile">

                    <img
                        id="avatar"
                        class="avatar"
                        alt=""
                    >

                    <div>

                        <div
                            class="name"
                            id="name">
                            —
                        </div>

                        <div
                            class="handle"
                            id="handle">
                            —
                        </div>

                        <div
                            class="bio"
                            id="bio">
                            —
                        </div>

                    </div>

                </div>

                <div class="stats">

                    <div class="stat">
                        <b id="followers">—</b>
                        <span>المتابعون</span>
                    </div>

                    <div class="stat">
                        <b id="following">—</b>
                        <span>يتابع</span>
                    </div>

                    <div class="stat">
                        <b id="likes">—</b>
                        <span>الإعجابات</span>
                    </div>

                </div>

                <div class="notice">
                    هذه الواجهة مخصصة لعرض المعلومات العامة المتاحة
                    عن الحساب فقط، ولا تتجاوز إعدادات الخصوصية أو حماية TikTok.
                </div>

            </div>

        </div>

    </div>

</section>


<script>

/* جسيمات الرعب */

const particles =
document.getElementById("particles");

for(let i=0;i<70;i++){

    const p=document.createElement("span");

    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=
        (5+Math.random()*12)+"s";

    p.style.animationDelay=
        (-Math.random()*15)+"s";

    p.style.opacity=
        (.2+Math.random()*.8);

    particles.appendChild(p);
}


/* فتح الواجهة */

function unlock(){

    const pin =
        document.getElementById("pin").value;

    const error =
        document.getElementById("error");

    if(pin.length !== 4){
        error.textContent="يجب إدخال 4 أرقام";
        return;
    }

    /*
      ضع نظام التحقق الذي تريده هنا.
      لا يوجد تجاوز للحماية.
    */

    if(pin === "5831"){

        document.getElementById("login").style.display="none";
        document.getElementById("app").style.display="block";

        document.getElementById("flash")
            .classList.add("active");

        setTimeout(()=>{
            document.getElementById("flash")
                .classList.remove("active");
        },300);

    }else{

        error.textContent="رمز خاطئ";

        document.getElementById("pin").value="";

        document.getElementById("flash")
            .classList.add("active");

        setTimeout(()=>{
            document.getElementById("flash")
                .classList.remove("active");
        },300);

        if(navigator.vibrate){
            navigator.vibrate([100,60,100]);
        }
    }
}


/* فحص اليوزر */

function searchUser(){

    let username =
        document.getElementById("username").value.trim();

    username=username.replace(/^@/,"");

    if(!username){
        alert("اكتب اليوزر أولاً");
        return;
    }

    /*
      هنا تعرض بيانات الحساب العامة
      من مصدر رسمي/مصرح به.
      لا يتم استخراج معلومات خاصة.
    */

    document.getElementById("info").style.display="block";

    document.getElementById("name").textContent=
        "الحساب: "+username;

    document.getElementById("handle").textContent=
        "@"+username;

    document.getElementById("bio").textContent=
        "المعلومات العامة ستظهر هنا عند ربط مصدر بيانات مصرح به.";

    document.getElementById("followers").textContent="—";
    document.getElementById("following").textContent="—";
    document.getElementById("likes").textContent="—";

    document.getElementById("avatar").src=
        "https://placehold.co/150x150/080307/ff1744?text=RwL";
}


/* Enter */

document.getElementById("pin")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        unlock();
    }

});

</script>

</body>
</html>
