<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RwL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0b0b0b;
  font-family: Arial, sans-serif;
  color: white;
}

/* الغلاف */
.card {
  width: 270px;
  background: #171717;
  border: 1px solid #2d2d2d;
  border-radius: 16px;
  padding: 16px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.35);
}

/* RwL */
.brand {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 3px;
}

/* شعار PlayStation بشكل بسيط */
.ps-logo {
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 12px;
  opacity: .85;
}

.code {
  background: #050505;
  border: 1px solid #292929;
  border-radius: 9px;
  padding: 12px 5px;
  direction: ltr;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1.5px;
  white-space: nowrap;
  margin-bottom: 8px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 8px;
  padding: 9px;
  margin-top: 6px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.generate {
  background: white;
  color: black;
}

.copy {
  background: #3a3a3a;
  color: white;
}

.playstation {
  background: #075da8;
  color: white;
}
</style>
</head>

<body>

<div class="card">

  <div class="brand">RwL</div>

  <div class="ps-logo">◉ PLAYSTATION</div>

  <div class="code" id="code">
    اضغط توليد
  </div>

  <button class="generate" onclick="generateCode()">
    توليد
  </button>

  <button class="copy" onclick="copyCode()">
    نسخ
  </button>

  <button class="playstation" onclick="openPlayStation()">
    فتح PlayStation
  </button>

</div>

<script>

/* =========================
   توليد كود 12 خانة
   المسموح فقط:
   A-Z + 0-9
========================= */

function generateCode() {

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  let code = "";

  for (let i = 0; i < 12; i++) {

    const randomIndex =
      Math.floor(Math.random() * characters.length);

    code += characters[randomIndex];
  }

  document.getElementById("code").textContent = code;
}


/* =========================
   نسخ الكود
========================= */

function copyCode() {

  const code =
    document.getElementById("code").textContent;

  if (code === "اضغط توليد") {
    return;
  }

  navigator.clipboard.writeText(code)
    .then(() => {
      alert("تم نسخ الكود ✅");
    })
    .catch(() => {
      alert("تعذر النسخ");
    });
}


/* =========================
   فتح PlayStation
========================= */

function openPlayStation() {

  /*
    نحاول فتح تطبيق PlayStation
    مباشرة.
  */

  window.location.href = "playstation://";
}

</script>

</body>
</html>
