<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RwL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at top, #242424 0%, #0a0a0a 45%, #000 100%);
  font-family: Arial, sans-serif;
  color: white;
}

/* الغلاف الفخم */
.card {
  width: 285px;
  padding: 19px;
  text-align: center;
  border-radius: 20px;

  background: linear-gradient(
    145deg,
    #222,
    #101010 55%,
    #080808
  );

  border: 1px solid #3a3a3a;

  box-shadow:
    0 20px 50px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.08);
}

/* RwL */
.brand {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 5px;

  background: linear-gradient(
    180deg,
    #ffffff,
    #8f8f8f
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow: 0 5px 20px rgba(255,255,255,.12);

  margin-bottom: 2px;
}

/* Sony */
.sony {
  font-family: Georgia, serif;
  font-size: 15px;
  letter-spacing: 3px;
  color: #d7d7d7;
  margin-bottom: 2px;
}

/* PlayStation */
.playstation-logo {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #8f8f8f;
  margin-bottom: 15px;
}

/* الكود */
#code {
  width: 100%;
  background: #050505;

  border: 1px solid #303030;
  border-radius: 10px;

  padding: 12px 5px;

  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1.7px;

  direction: ltr;
  white-space: nowrap;

  box-shadow:
    inset 0 0 15px rgba(255,255,255,.03);

  margin-bottom: 8px;
}

/* الأزرار */
button {
  width: 100%;
  border: 0;
  border-radius: 9px;

  padding: 9px;
  margin-top: 6px;

  font-size: 13px;
  font-weight: bold;

  cursor: pointer;
  transition: .2s;
}

button:active {
  transform: scale(.97);
}

.generate {
  background: linear-gradient(
    180deg,
    #ffffff,
    #cfcfcf
  );

  color: #000;
}

.copy {
  background: #303030;
  color: white;
}

.open-ps {
  background: linear-gradient(
    180deg,
    #1475c9,
    #07549a
  );

  color: white;
}

.footer {
  margin-top: 12px;
  font-size: 9px;
  color: #666;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="card">

  <!-- RwL -->
  <div class="brand">RwL</div>

  <!-- Sony -->
  <div class="sony">SONY</div>

  <!-- PlayStation -->
  <div class="playstation-logo">
    PLAYSTATION
  </div>

  <!-- الكود -->
  <div id="code">
    اضغط توليد
  </div>

  <!-- توليد -->
  <button class="generate" onclick="generateCode()">
    توليد كود
  </button>

  <!-- نسخ -->
  <button class="copy" onclick="copyCode()">
    نسخ
  </button>

  <!-- فتح PlayStation -->
  <button class="open-ps" onclick="openPlayStation()">
    فتح PlayStation
  </button>

  <div class="footer">
    RwL • 12 CHARACTERS
  </div>

</div>


<script>

/* ==========================
   مولد الأكواد
   12 خانة فقط
   A-Z + 0-9
========================== */

function generateCode() {

  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  let code = "";

  for (let i = 0; i < 12; i++) {

    const random =
      Math.floor(
        Math.random() * characters.length
      );

    code += characters[random];
  }

  document.getElementById("code").textContent = code;
}


/* ==========================
   نسخ
========================== */

function copyCode() {

  const code =
    document.getElementById("code").textContent;

  if (code === "اضغط توليد") {
    return;
  }

  navigator.clipboard.writeText(code)
    .then(() => {
      alert("تم نسخ الكود ✅");
    })
    .catch(() => {
      alert("تعذر نسخ الكود");
    });
}


/* ==========================
   فتح تطبيق PlayStation
========================== */

function openPlayStation() {

  window.location.href = "playstation://";
}

</script>

</body>
</html>
