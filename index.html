<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولد يوزرات Snapchat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 20px;
}

.box {
    background: #1d1d1d;
    padding: 16px;
    border-radius: 16px;
}

label {
    display: block;
    margin: 10px 0 6px;
}

select,
button {
    border: 0;
    border-radius: 11px;
    padding: 12px;
    font-size: 15px;
}

select {
    width: 100%;
    background: #292929;
    color: white;
    margin-bottom: 8px;
}

.generate {
    width: 100%;
    background: #fffc00;
    color: #111;
    font-weight: bold;
    margin-top: 10px;
}

#status {
    text-align: center;
    color: #aaa;
    margin: 18px 0 10px;
}

.result {
    background: #202020;
    padding: 12px;
    border-radius: 13px;
    margin-bottom: 9px;

    display: flex;
    align-items: center;
    gap: 8px;
    direction: ltr;
}

.username {
    flex: 1;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
}

.action {
    width: auto;
    margin: 0;
    padding: 8px 10px;
    color: white;
    background: #333;
    font-size: 13px;
}

.snap {
    background: #fffc00;
    color: #111;
}

.note {
    margin-top: 15px;
    background: #1d1d1d;
    padding: 14px;
    border-radius: 13px;
    color: #aaa;
    font-size: 13px;
    line-height: 1.7;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ مولد يوزرات Snapchat</h1>

<div class="subtitle">
    توليد سريع + نسخ + فتح Snapchat للتحقق
</div>

<div class="box">

<label>طول اليوزر</label>

<select id="length">
    <option value="3">3 خانات</option>
    <option value="4" selected>4 خانات</option>
</select>

<label>عدد اليوزرات</label>

<select id="amount">
    <option value="10">10</option>
    <option value="25">25</option>
    <option value="50">50</option>
    <option value="100">100</option>
</select>

<label>نوع اليوزر</label>

<select id="mode">
    <option value="mixed">حروف + أرقام</option>
    <option value="letters">حروف فقط</option>
    <option value="numbers">أرقام فقط</option>
</select>

<button class="generate" onclick="generate()">
    🎲 توليد اليوزرات
</button>

</div>

<div id="status">
    جاهز
</div>

<div id="results"></div>

<div class="note">
    🔎 للتحقق الحقيقي، اضغط «تحقق» بجانب اليوزر.
    سيتم فتح Snapchat لتبحث عن الاسم بنفسك.
    الأداة لا تعرض نتيجة متاحة/غير متاحة من عندها بشكل وهمي.
</div>

</div>


<script>

const letters =
    "abcdefghijklmnopqrstuvwxyz";

const numbers =
    "0123456789";


function createUsername(length, mode) {

    let chars;

    if (mode === "letters") {
        chars = letters;
    }

    else if (mode === "numbers") {
        chars = numbers;
    }

    else {
        chars = letters + numbers;
    }

    let username = "";

    for (let i = 0; i < length; i++) {

        const index =
            Math.floor(
                Math.random() * chars.length
            );

        username += chars[index];
    }

    return username;
}


function generate() {

    const length =
        Number(
            document.getElementById("length").value
        );

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const mode =
        document.getElementById("mode").value;

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    const usernames = new Set();

    while (usernames.size < amount) {

        usernames.add(
            createUsername(
                length,
                mode
            )
        );
    }


    usernames.forEach(username => {

        const row =
            document.createElement("div");

        row.className = "result";

        row.innerHTML = `

            <span class="username">
                @${username}
            </span>

            <button
                class="action snap"
                onclick="checkOnSnapchat('${username}')">
                🔎 تحقق
            </button>

            <button
                class="action"
                onclick="copyUsername('${username}')">
                📋 نسخ
            </button>

        `;

        results.appendChild(row);

    });


    document.getElementById("status").textContent =
        `✅ تم توليد ${amount} يوزر`;
}


function checkOnSnapchat(username) {

    /*
      فتح صفحة Snapchat الرسمية.
      إذا لم يفتح الرابط مباشرة داخل التطبيق،
      يمكن البحث عن اليوزر داخل Snapchat يدويًا.
    */

    const url =
        "https://www.snapchat.com/add/" +
        encodeURIComponent(username);

    window.open(url, "_blank");
}


async function copyUsername(username) {

    try {

        await navigator.clipboard.writeText(
            username
        );

        const oldTitle =
            document.title;

        document.title =
            "✅ تم النسخ";

        setTimeout(() => {
            document.title = oldTitle;
        }, 900);

    }

    catch {

        const textarea =
            document.createElement("textarea");

        textarea.value = username;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        alert("✅ تم نسخ @" + username);
    }
}

</script>

</body>
</html>
