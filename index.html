<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Web Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        
        #desktop {
            width: 100%;
            height: calc(100% - 48px);
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2560&auto=format&fit=crop') no-repeat center center/cover;
            position: relative;
            display: grid;
            grid-template-columns: repeat(auto-fill, 90px);
            grid-template-rows: repeat(auto-fill, 90px);
            grid-auto-flow: column;
            padding: 10px;
            gap: 10px;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 85px;
            height: 85px;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            text-align: center;
            font-size: 12px;
            transition: background 0.2s;
        }
        .desktop-icon:hover { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
        .desktop-icon img { width: 40px; height: 40px; margin-bottom: 5px; }

        #taskbar {
            width: 100%;
            height: 48px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 99999;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .taskbar-center { display: flex; gap: 4px; align-items: center; }
        .tb-btn {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .tb-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .tb-btn img { width: 24px; height: 24px; }

        .window {
            position: absolute;
            top: 50px;
            left: 100px;
            width: 800px;
            height: 500px;
            background: #202020;
            color: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            resize: both;
            z-index: 10;
        }

        .window-header {
            height: 35px;
            background: #181818;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            cursor: grab;
        }
        .window-title { font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .window-title img { width: 16px; height: 16px; }
        .window-controls { display: flex; gap: 0; }
        .win-ctrl-btn {
            width: 45px;
            height: 35px;
            background: transparent;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
        .win-ctrl-btn:hover { background: rgba(255, 255, 255, 0.1); }
        .win-ctrl-btn.close:hover { background: #e81123; }

        .window-body { flex: 1; background: #121212; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        iframe { width: 100%; height: 100%; border: none; background: white; }
        
        .app-internal { padding: 20px; color: #fff; height: 100%; overflow-y: auto; }
        .app-internal h2 { margin-bottom: 15px; font-weight: 400; }
        .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; background: #1a1a1a; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>

    <div id="desktop">
        <div class="desktop-icon" onclick="openApp('chrome')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%282011%29.svg" alt="Chrome">
            <span>Google Chrome</span>
        </div>
        <div class="desktop-icon" onclick="openApp('settings')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Windows_Settings_app_icon_%282020–present%29.svg" alt="Settings">
            <span>Settings</span>
        </div>
        <div class="desktop-icon" onclick="openApp('terminal')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/34/Windows_Terminal_logo.svg" alt="Terminal">
            <span>Terminal</span>
        </div>
    </div>

    <div id="taskbar">
        <div class="taskbar-center">
            <button class="tb-btn" onclick="openApp('start')"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e4/Windows_11_logo.svg" alt="Start"></button>
            <button class="tb-btn" onclick="openApp('chrome')"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%282011%29.svg" alt="Chrome"></button>
            <button class="tb-btn" onclick="openApp('settings')"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Windows_Settings_app_icon_%282020–present%29.svg" alt="Settings"></button>
            <button class="tb-btn" onclick="openApp('terminal')"><img src="https://upload.wikimedia.org/wikipedia/commons/3/34/Windows_Terminal_logo.svg" alt="Terminal"></button>
        </div>
    </div>

    <div id="window-container"></div>

    <script>
        let zIndexCounter = 100;

        function openApp(appId) {
            const container = document.getElementById('window-container');
            const win = document.createElement('div');
            win.className = 'window';
            win.style.zIndex = ++zIndexCounter;
            win.style.top = `${50 + (zIndexCounter % 5) * 20}px`;
            win.style.left = `${100 + (zIndexCounter % 5) * 20}px`;

            let title = '';
            let icon = '';
            let content = '';

            if (appId === 'chrome') {
                title = 'Google Chrome';
                icon = 'https://upload.wikimedia.org/wikipedia/commons/e/e1/Google_Chrome_icon_%282011%29.svg';
                content = `<div style="background:#35363a; padding:5px; display:flex; gap:5px; align-items:center;">
                    <input type="text" id="url-${zIndexCounter}" value="https://www.wikipedia.org" style="flex:1; padding:6px 12px; border-radius:15px; border:none; background:#202124; color:white; outline:none;" onkeydown="if(event.key==='Enter') navigateIframe(this, ${zIndexCounter})">
                </div><iframe id="iframe-${zIndexCounter}" src="https://www.wikipedia.org"></iframe>`;
            } else if (appId === 'settings') {
                title = 'Settings - System Info';
                icon = 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Windows_Settings_app_icon_%282020–present%29.svg';
                content = `<div class="app-internal">
                    <h2>Device specifications</h2>
                    <div class="specs-grid">
                        <div>Processor</div><div>Virtual Quantum i9-14900KS @ 6.20GHz</div>
                        <div>Installed RAM</div><div>128 GB High-Speed DDR5</div>
                        <div>System type</div><div>64-bit operating system, x64-based processor</div>
                        <div>Graphics</div><div>NVIDIA RTX 5090 Ti (Simulated)</div>
                        <div>Windows Edition</div><div>Windows 11 Pro Enterprise Ultimate</div>
                    </div>
                </div>`;
            } else if (appId === 'terminal') {
                title = 'Windows Terminal';
                icon = 'https://upload.wikimedia.org/wikipedia/commons/3/34/Windows_Terminal_logo.svg';
                content = `<div class="app-internal" style="background:#0c0c0c; font-family:Consolas, monospace;">
                    <p>Windows PowerShell [Version 11.0.26100]</p>
                    <p>(c) Microsoft Corporation. All rights reserved.</p><br>
                    <p>PS C:\\Users\\Administrator> <span id="term-input" contenteditable="true" style="outline:none; color:white;"></span></p>
                </div>`;
            }

            win.innerHTML = `
                <div class="window-header" onmousedown="dragWindow(event, this.parentElement)">
                    <div class="window-title"><img src="${icon}"><span>${title}</span></div>
                    <div class="window-controls">
                        <button class="win-ctrl-btn" onclick="minimizeWindow(this)">&#xF090;</button>
                        <button class="win-ctrl-btn" onclick="maximizeWindow(this)">&#xF092;</button>
                        <button class="win-ctrl-btn close" onclick="closeWindow(this)">&#xF071;</button>
                    </div>
                </div>
                <div class="window-body">${content}</div>
            `;

            win.onmousedown = () => { win.style.zIndex = ++zIndexCounter; };
            container.appendChild(win);
        }

        function closeWindow(btn) {
            btn.closest('.window').remove();
        }

        function maximizeWindow(btn) {
            const win = btn.closest('.window');
            if (!win.dataset.maximized) {
                win.dataset.prevStyle = JSON.stringify({top: win.style.top, left: win.style.left, width: win.style.width, height: win.style.height});
                win.style.top = '0'; win.style.left = '0'; win.style.width = '100vw'; win.style.height = 'calc(100vh - 48px)';
                win.dataset.maximized = 'true';
            } else {
                const prev = JSON.parse(win.dataset.prevStyle);
                win.style.top = prev.top; win.style.left = prev.left; win.style.width = prev.width; win.style.height = prev.height;
                delete win.dataset.maximized;
            }
        }

        function minimizeWindow(btn) {
            btn.closest('.window').style.display = 'none';
        }

        function navigateIframe(input, id) {
            let url = input.value;
            if(!url.startsWith('http')) url = 'https://' + url;
            document.getElementById(`iframe-${id}`).src = url;
        }

        function dragWindow(e, win) {
            if (e.target.closest('.window-controls')) return;
            let startX = e.clientX, startY = e.clientY;
            let startTop = win.offsetTop, startLeft = win.offsetLeft;

            function moveAt(evt) {
                win.style.top = `${Math.max(0, startTop + evt.clientY - startY)}px`;
                win.style.left = `${startLeft + evt.clientX - startX}px`;
            }

            document.addEventListener('mousemove', moveAt);
            document.onmouseup = () => {
                document.removeEventListener('mousemove', moveAt);
                document.onmouseup = null;
            };
        }
    </script>
</body>
</html>
