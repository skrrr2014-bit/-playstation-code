<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Web Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        /* Desktop Grid & Icons */
        #desktop {
            position: relative;
            width: 100%;
            height: calc(100vh - 48px);
            padding: 10px;
        }

        .desktop-icon {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid transparent;
            transition: background 0.2s, border-color 0.2s;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .desktop-icon img {
            width: 40px;
            height: 40px;
            margin-bottom: 4px;
            pointer-events: none;
        }

        .desktop-icon span {
            font-size: 11px;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .taskbar-center {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .taskbar-btn {
            background: transparent;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            position: relative;
        }

        .taskbar-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .taskbar-btn.active::after {
            content: '';
            position: absolute;
            bottom: 2px;
            width: 6px;
            height: 3px;
            background: #60cdff;
            border-radius: 2px;
        }

        .taskbar-btn img {
            width: 24px;
            height: 24px;
            pointer-events: none;
        }

        /* System Tray */
        .system-tray {
            position: absolute;
            right: 10px;
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            height: 80%;
        }

        .system-tray:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Start Menu */
        #start-menu {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            width: 550px;
            height: 500px;
            background: rgba(32, 32, 32, 0.85);
            backdrop-filter: blur(40px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: none;
            flex-direction: column;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            z-index: 100000;
            opacity: 0;
            transition: all 0.15s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        #start-menu.active {
            display: flex;
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        .start-menu-title {
            font-size: 14px;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
        }

        .start-apps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .start-app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-size: 12px;
            transition: background 0.2s;
        }

        .start-app-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .start-app-item img {
            width: 36px;
            height: 36px;
            margin-bottom: 8px;
        }

        /* Windows */
        .window {
            position: absolute;
            top: 50px;
            left: 100px;
            width: 750px;
            height: 480px;
            background: #202020;
            color: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
            resize: both;
            min-width: 300px;
            min-height: 200px;
        }

        .window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: calc(100vh - 48px) !important;
            border-radius: 0 !important;
            resize: none !important;
        }

        .window-header {
            height: 40px;
            background: #2d2d2d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            cursor: default;
        }

        .window-title {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .window-title img {
            width: 16px;
            height: 16px;
        }

        .window-controls {
            display: flex;
            height: 100%;
        }

        .window-controls button {
            background: transparent;
            border: none;
            color: white;
            width: 45px;
            height: 100%;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .window-controls button:hover {
            background: rgba(255,255,255,0.1);
        }

        .window-controls .close-btn:hover {
            background: #e81123;
        }

        .window-body {
            flex: 1;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Chrome App Specifics */
        .chrome-toolbar {
            height: 40px;
            background: #353535;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 8px;
        }

        .chrome-toolbar input {
            flex: 1;
            height: 28px;
            background: #202020;
            border: 1px solid #4f4f4f;
            border-radius: 14px;
            padding: 0 15px;
            color: white;
            font-size: 12px;
            outline: none;
        }

        .chrome-toolbar button {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
        }
    </style>
</head>
<body>

    <!-- Desktop -->
    <div id="desktop">
        <!-- Chrome Icon -->
        <div class="desktop-icon" style="top: 20px; left: 20px;" onmousedown="initDragIcon(event, this)" ondblclick="openWindow('chromeWin')">
            <img src="https://img.icons8.com/color/96/google-chrome--v2.png" alt="Chrome">
            <span>Google Chrome</span>
        </div>
        <!-- Notepad Icon -->
        <div class="desktop-icon" style="top: 120px; left: 20px;" onmousedown="initDragIcon(event, this)" ondblclick="openWindow('notepadWin')">
            <img src="https://img.icons8.com/color/96/notepad.png" alt="Notepad">
            <span>Notepad</span>
        </div>
        <!-- CMD Icon -->
        <div class="desktop-icon" style="top: 220px; left: 20px;" onmousedown="initDragIcon(event, this)" ondblclick="openWindow('cmdWin')">
            <img src="https://img.icons8.com/color/96/cmd.png" alt="Terminal">
            <span>Command Prompt</span>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div class="taskbar-center">
            <button class="taskbar-btn" onclick="toggleStartMenu()" title="Start">
                <img src="https://img.icons8.com/fluency/48/windows-11.png" alt="Start">
            </button>
            <button class="taskbar-btn" id="taskbar-chrome" onclick="toggleWindow('chromeWin')" title="Google Chrome">
                <img src="https://img.icons8.com/color/48/google-chrome--v2.png" alt="Chrome">
            </button>
            <button class="taskbar-btn" id="taskbar-notepad" onclick="toggleWindow('notepadWin')" title="Notepad">
                <img src="https://img.icons8.com/color/48/notepad.png" alt="Notepad">
            </button>
            <button class="taskbar-btn" id="taskbar-cmd" onclick="toggleWindow('cmdWin')" title="Command Prompt">
                <img src="https://img.icons8.com/color/48/cmd.png" alt="CMD">
            </button>
        </div>
        <div class="system-tray">
            <span id="clock">00:00</span>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="start-menu-title">Pinned Apps</div>
        <div class="start-apps-grid">
            <div class="start-app-item" onclick="openWindow('chromeWin'); toggleStartMenu();">
                <img src="https://img.icons8.com/color/48/google-chrome--v2.png" alt="Chrome">
                <span>Chrome</span>
            </div>
            <div class="start-app-item" onclick="openWindow('notepadWin'); toggleStartMenu();">
                <img src="https://img.icons8.com/color/48/notepad.png" alt="Notepad">
                <span>Notepad</span>
            </div>
            <div class="start-app-item" onclick="openWindow('cmdWin'); toggleStartMenu();">
                <img src="https://img.icons8.com/color/48/cmd.png" alt="CMD">
                <span>Terminal</span>
            </div>
        </div>
    </div>

    <!-- Chrome Window -->
    <div class="window" id="chromeWin">
        <div class="window-header" onmousedown="initDragWindow(event, this)">
            <div class="window-title">
                <img src="https://img.icons8.com/color/48/google-chrome--v2.png" alt=""> Google Chrome
            </div>
            <div class="window-controls">
                <button onclick="minimizeWindow('chromeWin')">🗕</button>
                <button onclick="maximizeWindow('chromeWin')">🗖</button>
                <button class="close-btn" onclick="closeWindow('chromeWin')">✕</button>
            </div>
        </div>
        <div class="window-body">
            <div class="chrome-toolbar">
                <button onclick="navigateChrome('back')">⬅</button>
                <button onclick="navigateChrome('forward')">➡</button>
                <button onclick="navigateChrome('reload')">🔄</button>
                <input type="text" id="chromeUrlInput" value="https://www.wikipedia.org" onkeydown="if(event.key==='Enter') loadUrl(this.value)">
            </div>
            <iframe id="chromeFrame" src="https://www.wikipedia.org" style="width:100%; height:100%; border:none; background:white;"></iframe>
        </div>
    </div>

    <!-- Notepad Window -->
    <div class="window" id="notepadWin">
        <div class="window-header" onmousedown="initDragWindow(event, this)">
            <div class="window-title">
                <img src="https://img.icons8.com/color/48/notepad.png" alt=""> Notepad
            </div>
            <div class="window-controls">
                <button onclick="minimizeWindow('notepadWin')">🗕</button>
                <button onclick="maximizeWindow('notepadWin')">🗖</button>
                <button class="close-btn" onclick="closeWindow('notepadWin')">✕</button>
            </div>
        </div>
        <div class="window-body">
            <textarea style="width:100%; height:100%; background:#1e1e1e; color:white; border:none; padding:10px; resize:none; outline:none; font-family:monospace; font-size:14px;" placeholder="Type something..."></textarea>
        </div>
    </div>

    <!-- CMD Window -->
    <div class="window" id="cmdWin">
        <div class="window-header" onmousedown="initDragWindow(event, this)">
            <div class="window-title">
                <img src="https://img.icons8.com/color/48/cmd.png" alt=""> Command Prompt
            </div>
            <div class="window-controls">
                <button onclick="minimizeWindow('cmdWin')">🗕</button>
                <button onclick="maximizeWindow('cmdWin')">🗖</button>
                <button class="close-btn" onclick="closeWindow('cmdWin')">✕</button>
            </div>
        </div>
        <div class="window-body" style="background:black; color:#00ff00; padding:10px; font-family:monospace; font-size:13px;">
            <div style="margin-bottom:5px;">Microsoft Windows [Version 10.0.22631.3810]</div>
            <div style="margin-bottom:10px;">(c) Microsoft Corporation. All rights reserved.</div>
            <div id="cmd-output"></div>
            <div style="display:flex;">
                <span>C:\Users\Win11&gt;&nbsp;</span>
                <input type="text" id="cmdInput" style="background:transparent; border:none; color:#00ff00; outline:none; flex:1; font-family:monospace;" onkeydown="handleCmd(event)">
            </div>
        </div>
    </div>

    <script>
        // Clock Update
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // Desktop Icons Free Dragging System
        function initDragIcon(e, elm) {
            if (e.button !== 0) return;
            let startX = e.clientX;
            let startY = e.clientY;
            let origLeft = elm.offsetLeft;
            let origTop = elm.offsetTop;

            function onMouseMove(moveEvent) {
                let dx = moveEvent.clientX - startX;
                let dy = moveEvent.clientY - startY;
                elm.style.left = (origLeft + dx) + 'px';
                elm.style.top = (origTop + dy) + 'px';
            }

            function onMouseUp() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            e.stopPropagation();
        }

        // Window Management
        let zIndexCounter = 1000;

        function bringToFront(winId) {
            const win = document.getElementById(winId);
            win.style.zIndex = ++zIndexCounter;
        }

        function openWindow(winId) {
            const win = document.getElementById(winId);
            win.style.display = 'flex';
            bringToFront(winId);
            updateTaskbarIndicator(winId, true);
        }

        function closeWindow(winId) {
            document.getElementById(winId).style.display = 'none';
            updateTaskbarIndicator(winId, false);
        }

        function minimizeWindow(winId) {
            document.getElementById(winId).style.display = 'none';
        }

        function maximizeWindow(winId) {
            document.getElementById(winId).classList.toggle('maximized');
            bringToFront(winId);
        }

        function toggleWindow(winId) {
            const win = document.getElementById(winId);
            if (win.style.display === 'none' || win.style.display === '') {
                openWindow(winId);
            } else {
                minimizeWindow(winId);
                updateTaskbarIndicator(winId, true);
            }
        }

        function updateTaskbarIndicator(winId, isOpen) {
            const btnMap = {
                'chromeWin': 'taskbar-chrome',
                'notepadWin': 'taskbar-notepad',
                'cmdWin': 'taskbar-cmd'
            };
            const btn = document.getElementById(btnMap[winId]);
            if (btn) {
                if (isOpen) btn.classList.add('active');
                else btn.classList.remove('active');
            }
        }

        // Window Dragging Mechanics
        function initDragWindow(e, headerElm) {
            if (e.button !== 0) return;
            const win = headerElm.parentElement;
            if (win.classList.contains('maximized')) return;

            bringToFront(win.id);
            let startX = e.clientX;
            let startY = e.clientY;
            let origLeft = win.offsetLeft;
            let origTop = win.offsetTop;

            function onMouseMove(moveEvent) {
                let dx = moveEvent.clientX - startX;
                let dy = moveEvent.clientY - startY;
                win.style.left = (origLeft + dx) + 'px';
                win.style.top = (origTop + dy) + 'px';
            }

            function onMouseUp() {
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            }

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        // Start Menu Toggle
        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.classList.toggle('active');
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('start-menu');
            const startBtn = document.querySelector('.taskbar-btn');
            if (menu.classList.contains('active') && !menu.contains(e.target) && !startBtn.contains(e.target)) {
                menu.classList.remove('active');
            }
        });

        // Chrome Browser Logic
        function loadUrl(url) {
            if(!url.startsWith('http')) url = 'https://' + url;
            document.getElementById('chromeFrame').src = url;
            document.getElementById('chromeUrlInput').value = url;
        }
        function navigateChrome(action) {
            const frame = document.getElementById('chromeFrame');
            if(action === 'reload') frame.src = frame.src;
        }

        // CMD Logic
        function handleCmd(e) {
            if(e.key === 'Enter') {
                const input = document.getElementById('cmdInput');
                const output = document.getElementById('cmd-output');
                const val = input.value.trim();
                
                output.innerHTML += `<div>C:\\Users\\Win11&gt; ${val}</div>`;
                if(val === 'cls') {
                    output.innerHTML = '';
                } else if(val === 'ver') {
                    output.innerHTML += `<div>Microsoft Windows [Version 10.0.22631]</div>`;
                } else if(val !== '') {
                    output.innerHTML += `<div>'${val}' is not recognized as an internal or external command.</div>`;
                }
                input.value = '';
                output.scrollTop = output.scrollHeight;
            }
        }
    </script>
</body>
</html>
