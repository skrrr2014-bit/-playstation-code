<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>LaGranny</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial;
}

#game{
    width:100vw;
    height:100vh;
}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:22px;
    z-index:5;
    pointer-events:none;
}

#title{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    color:#ddd;
    font-size:24px;
    z-index:5;
    text-shadow:0 0 10px #000;
}

#message{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:18px;
    z-index:5;
    text-align:center;
}

#joystick{
    position:fixed;
    left:25px;
    bottom:25px;
    width:120px;
    height:120px;
    border:2px solid rgba(255,255,255,.25);
    border-radius:50%;
    z-index:10;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:32px;
    top:32px;
    background:rgba(255,255,255,.25);
    border-radius:50%;
}

#look{
    position:fixed;
    right:0;
    top:0;
    width:55%;
    height:75%;
    z-index:4;
}

#flash{
    position:fixed;
    right:25px;
    bottom:30px;
    width:65px;
    height:65px;
    border-radius:50%;
    border:2px solid white;
    background:rgba(255,255,255,.12);
    color:white;
    z-index:20;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="title">LAGRANNY</div>
<div id="crosshair">+</div>

<div id="message">
    ابحث عن المفتاح... واخرج من البيت.
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="look"></div>

<button id="flash">🔦</button>

<script type="module">

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020202);

scene.fog = new THREE.Fog(
    0x020202,
    2,
    18
);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    100
);

camera.position.set(0,1.7,5);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* الإضاءة */

const ambient = new THREE.HemisphereLight(
    0x444444,
    0x080808,
    0.35
);

scene.add(ambient);


/* مصباح اللاعب */

const flashlight = new THREE.SpotLight(
    0xffffff,
    5,
    20,
    Math.PI/7,
    0.5,
    1
);

flashlight.position.set(0,1.7,5);

flashlight.castShadow = true;

scene.add(flashlight);

scene.add(flashlight.target);


/* الأرض */

const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(40,40),
    new THREE.MeshStandardMaterial({
        color:0x252525,
        roughness:1
    })
);

floor.rotation.x = -Math.PI/2;

floor.receiveShadow = true;

scene.add(floor);


/* الجدران */

function wall(x,y,z,sx,sy,sz){

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx,sy,sz),
        new THREE.MeshStandardMaterial({
            color:0x292525,
            roughness:1
        })
    );

    mesh.position.set(x,y,z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    return mesh;
}

wall(0,2,-10,20,4,0.4);
wall(-10,2,0,0.4,4,20);
wall(10,2,0,0.4,4,20);


/* غرفة داخلية */

wall(-4,2,-3,0.4,4,8);
wall(4,2,-3,0.4,4,8);

wall(0,2,-7,8,4,0.4);


/* باب */

const door = new THREE.Mesh(
    new THREE.BoxGeometry(2.5,3,0.25),
    new THREE.MeshStandardMaterial({
        color:0x321c15
    })
);

door.position.set(
    0,
    1.5,
    -9.7
);

scene.add(door);


/* المفتاح */

const key = new THREE.Mesh(
    new THREE.BoxGeometry(.2,.05,.7),
    new THREE.MeshStandardMaterial({
        color:0xffcc33,
        metalness:.8
    })
);

key.position.set(
    -3,
    1.2,
    -5
);

scene.add(key);


/* الوحش */

const enemy = new THREE.Group();

const body = new THREE.Mesh(
    new THREE.CylinderGeometry(
        .55,
        .7,
        1.7,
        16
    ),
    new THREE.MeshStandardMaterial({
        color:0x301515
    })
);

body.position.y = 1;

enemy.add(body);


const head = new THREE.Mesh(
    new THREE.SphereGeometry(
        .5,
        20,
        20
    ),
    new THREE.MeshStandardMaterial({
        color:0xbca99a
    })
);

head.position.y = 2.2;

enemy.add(head);


enemy.position.set(
    0,
    0,
    -7
);

scene.add(enemy);


/* التحكم */

let forward = false;
let backward = false;
let left = false;
let right = false;

const speed = 0.045;

function move(){

    if(forward)
        camera.translateZ(-speed);

    if(backward)
        camera.translateZ(speed);

    if(left)
        camera.translateX(-speed);

    if(right)
        camera.translateX(speed);

}


/* عصا التحكم */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joyStart = null;

joystick.addEventListener(
    "touchstart",
    e=>{
        joyStart = e.touches[0];
    }
);

joystick.addEventListener(
    "touchmove",
    e=>{

        if(!joyStart)return;

        const t=e.touches[0];

        const dx=t.clientX-joyStart.clientX;
        const dy=t.clientY-joyStart.clientY;

        forward = dy < -15;
        backward = dy > 15;
        left = dx < -15;
        right = dx > 15;

        stick.style.transform =
            `translate(${Math.max(-30,
            Math.min(30,dx))}px,
            ${Math.max(-30,
            Math.min(30,dy))}px)`;
    }
);

joystick.addEventListener(
    "touchend",
    ()=>{
        forward=false;
        backward=false;
        left=false;
        right=false;

        stick.style.transform="translate(0,0)";
    }
);


/* تحريك النظر */

let looking=false;
let lastX=0;

const look =
    document.getElementById("look");

look.addEventListener(
    "touchstart",
    e=>{
        looking=true;
        lastX=e.touches[0].clientX;
    }
);

look.addEventListener(
    "touchmove",
    e=>{

        if(!looking)return;

        const x=e.touches[0].clientX;

        const dx=x-lastX;

        camera.rotation.y -= dx*0.004;

        lastX=x;
    }
);

look.addEventListener(
    "touchend",
    ()=>{
        looking=false;
    }
);


/* المصباح */

let lightOn=true;

document
    .getElementById("flash")
    .onclick=()=>{

        lightOn=!lightOn;

        flashlight.visible=lightOn;
    };


/* الذكاء الاصطناعي البسيط */

function enemyAI(){

    const dx =
        camera.position.x -
        enemy.position.x;

    const dz =
        camera.position.z -
        enemy.position.z;

    const distance =
        Math.sqrt(dx*dx+dz*dz);

    if(distance < 9){

        enemy.position.x +=
            dx/distance*0.012;

        enemy.position.z +=
            dz/distance*0.012;
    }

    if(distance < 1.2){

        document.getElementById(
            "message"
        ).textContent =
        "هربت؟ لا... LAGRANNY وجدتك ☠️";

        flashlight.intensity=0;
    }
}


/* اللعبة */

function animate(){

    requestAnimationFrame(animate);

    move();

    flashlight.position.copy(
        camera.position
    );

    flashlight.target.position.set(
        camera.position.x -
        Math.sin(camera.rotation.y),

        camera.position.y,

        camera.position.z -
        Math.cos(camera.rotation.y)
    );

    enemyAI();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* تغيير حجم الشاشة */

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
