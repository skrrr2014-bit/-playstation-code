<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RwL Username Checker</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:
      radial-gradient(circle at 50% 0%,#29445f 0,#0a1422 38%,#03060b 100%);
}

.snow{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:10;
}

.flake{
    position:absolute;
    top:-20px;
    color:#fff;
    opacity:.55;
    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:translate3d(var(--x),110vh,0) rotate(360deg);
    }
}

.app{
    width:min(760px,94%);
    margin:auto;
    padding:18px 0 35px;
}

.hero{
    height:300px;
    position:relative;
    overflow:hidden;
    border-radius:30px;
    border:1px solid #ffffff20;
    background:
      linear-gradient(180deg,#0001,#000b),
      url("RwL.png") center/cover no-repeat;
    box-shadow:0 25px 80px #0009;
}

.heroText{
    position:absolute;
    left:25px;
    bottom:25px;
    direction:ltr;
}

.logo{
    font-size:64px;
    font-weight:900;
    letter-spacing:-4px;
}

.sub{
    font-size:11px;
    letter-spacing:4px;
    color:#d5dfec;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:12px 0;
}

button{
    font:inherit;
    cursor:pointer;
}

.tab{
    padding:14px 8px;
    border-radius:15px;
    border:1px solid #ffffff18;
    color:white;
    background:#ffffff0b;
}

.tab.active{
    background:#fff;
    color:#111;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.card{
    padding:20px;
    border-radius:23px;
    border:1px solid #ffffff15;
    background:#09111ed9;
    backdrop-filter:blur(18px);
    box-shadow:0 20px 50px #0005;
}

.lock{
    max-width:420px;
    margin:45px auto;
    text-align:center;
}

.icon{
    font-size:35px;
    margin-bottom:10px;
}

h2{
    margin:5px 0;
}

.muted{
    color:#9aa9bc;
    font-size:12px;
    margin:7px 0 18px;
}

input,select{
    width:100%;
    padding:13px;
    margin:5px 0 10px;
    color:white;
    background:#050b13;
    border:1px solid #ffffff18;
    border-radius:13px;
    outline:none;
}

.main{
    width:100%;
    padding:14px;
    margin-top:6px;
    border:0;
    border-radius:14px;
    color:white;
    font-weight:800;
    background:linear-gradient(135deg,#ff3d9a,#775cff);
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.result{
    margin-top:15px;
    padding:17px;
    border-radius:17px;
    text-align:center;
    background:#ffffff08;
    border:1px solid #ffffff10;
}

.result .name{
    font-size:20px;
    font-weight:800;
    direction:ltr;
}

.status{
    margin-top:10px;
    font-size:14px;
    font-weight:700;
}

.green{color:#35e5a4}
.red{color:#ff5873}
.yellow{color:#ffd166}

.results{
    margin-top:14px;
    display:grid;
    gap:8px;
    max-height:430px;
    overflow:auto;
}

.item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    direction:ltr;
    padding:11px;
    border-radius:13px;
    background:#ffffff08;
}

.copy{
    padding:7px 10px;
    color:#fff;
    border:1px solid #ffffff14;
    border-radius:9px;
    background:#182231;
}

.note{
    margin-top:12px;
    color:#8493a8;
    font-size:10px;
    line-height:1.8;
}

.error{
    min-height:18px;
    color:#ff607a;
    font-size:12px;
}

@media(max-width:520px){
    .hero{height:250px}
    .logo{font-size:52px}
    .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="snow" id="snow"></div>

<div class="app">

<section class="hero">
    <div class="heroText">
        <div class="logo">RwL</div>
        <div class="sub">USERNAME LAB</div>
    </div>
</section>

<div class="tabs">
    <button class="tab active" onclick="openTab('tik')">🎵 TikTok</button>
    <button class="tab" onclick="openTab('snap')">👻 Snapchat</button>
    <button class="tab" onclick="openTab('store')">🎟️ Store</button>
</div>


<section id="tik" class="panel active">

    <div id="login" class="card lock">

        <div class="icon">🔐</div>

        <h2>دخول TikTok</h2>

        <div class="muted">
            أدخل رمز RwL للمتابعة
        </div>

        <input
            id="access"
            type="password"
            inputmode="numeric"
            placeholder="رمز الدخول">

        <button class="main" onclick="unlock()">
            دخول
        </button>

        <div id="loginError" class="error"></div>

    </div>


    <div id="checker" style="display:none">

        <div class="card">

            <h2>🎵 فحص يوزر TikTok</h2>

            <div class="muted">
                أدخل يوزرًا واحدًا للفحص.
            </div>

            <input
                id="username"
                placeholder="مثال: username"
                autocomplete="off">

            <button class="main" onclick="checkUser()">
                ⚡ فحص اليوزر
            </button>

            <div id="result" class="result" style="display:none">

                <div id="resultName" class="name"></div>

                <div id="resultStatus" class="status"></div>

            </div>

            <div class="note">
                ⚠️ مصدر الفحص المستخدم غير رسمي من TikTok.
                لذلك عند عدم وجود استجابة مؤكدة سيظهر
                «تعذر الفحص» بدل إعطاء نتيجة وهمية.
            </div>

        </div>


        <div class="card" style="margin-top:12px">

            <h2>⚡ توليد يوزرات</h2>

            <div class="row">

                <div>
                    <label>الطول</label>
                    <input id="length" type="number" min="3" max="20" value="6">
                </div>

                <div>
                    <label>العدد</label>
                    <input id="count" type="number" min="1" max="100" value="20">
                </div>

            </div>

            <select id="type">
                <option value="mixed">حروف + أرقام</option>
                <option value="letters">حروف فقط</option>
                <option value="underscore">حروف + _</option>
            </select>

            <button class="main" onclick="generate()">
                توليد
            </button>

            <div id="results" class="results"></div>

        </div>

    </div>

</section>


<section id="snap" class="panel">

    <div class="card">

        <h2>👻 Snapchat</h2>

        <div class="muted">
            مولد يوزرات محلي.
        </div>

        <button class="main" onclick="snapGenerate()">
            توليد يوزرات
        </button>

        <div id="snapResults" class="results"></div>

    </div>

</section>


<section id="store" class="panel">

    <div class="card">

        <h2>🎟️ Store</h2>

        <div class="muted">
            مولد أكواد تجريبية فقط.
        </div>

        <button class="main" onclick="codes()">
            توليد 12 خانة
        </button>

        <div id="codeResults" class="results"></div>

    </div>

</section>


</div>


<script>

/* الثلج */

const snow=document.getElementById("snow");

for(let i=0;i<65;i++){

    const f=document.createElement("span");

    f.className="flake";
    f.textContent=Math.random()>.5?"❄":"•";

    f.style.left=Math.random()*100+"%";
    f.style.fontSize=(4+Math.random()*7)+"px";
    f.style.animationDuration=(7+Math.random()*10)+"s";
    f.style.animationDelay=(-Math.random()*15)+"s";

    f.style.setProperty(
        "--x",
        (Math.random()*160-80)+"px"
    );

    snow.appendChild(f);
}


/* التبويبات */

function openTab(id){

    document
    .querySelectorAll(".panel")
    .forEach(x=>x.classList.remove("active"));

    document
    .querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");

    const index={
        tik:0,
        snap:1,
        store:2
    }[id];

    document
    .querySelectorAll(".tab")[index]
    .classList.add("active");
}


/* الدخول */

function unlock(){

    const value=
        document.getElementById("access").value;

    if(value==="2112"){

        document.getElementById("login")
            .style.display="none";

        document.getElementById("checker")
            .style.display="block";

    }else{

        document.getElementById("loginError")
            .textContent="❌ رمز الدخول غير صحيح.";

    }
}


/* فحص اليوزر */

async function checkUser(){

    let username=
        document.getElementById("username")
        .value.trim()
        .toLowerCase();

    if(username.startsWith("@"))
        username=username.slice(1);

    const result=
        document.getElementById("result");

    const name=
        document.getElementById("resultName");

    const status=
        document.getElementById("resultStatus");

    if(!username){

        result.style.display="block";
        name.textContent="";
        status.className="status red";
        status.textContent="🔴 أدخل يوزر أولاً";
        return;
    }

    name.textContent="@"+username;

    result.style.display="block";

    status.className="status yellow";
    status.textContent="⏳ جاري الفحص...";

    try{

        /*
         * ملاحظة:
         * المتصفح قد يمنع هذا الطلب بسبب CORS.
         * إذا حدث ذلك تظهر حالة تعذر الفحص.
         */

        const url=
        "https://www.tiktok.com/api/unique/check/?aid=1988&unique_id="
        +encodeURIComponent(username);

        const response=
            await fetch(url,{
                method:"GET",
                headers:{
                    "Accept":"application/json"
                }
            });

        if(!response.ok){
            throw new Error("HTTP");
        }

        const data=
            await response.json();


        if(
            data &&
            data.statusCode===0 &&
            data.isAvailable===true
        ){

            status.className="status green";
            status.textContent="متاح ✅";

            return;
        }


        if(
            data &&
            data.statusCode===0 &&
            data.isAvailable===false
        ){

            status.className="status red";
            status.textContent="غير متاح 🔴";

            return;
        }


        status.className="status yellow";
        status.textContent="تعذر الفحص ⚠️";

    }catch(error){

        status.className="status yellow";
        status.textContent="تعذر الفحص ⚠️";

    }
}


/* المولد */

function makeUser(length,type){

    let chars;

    if(type==="letters")
        chars="abcdefghijklmnopqrstuvwxyz";

    else if(type==="underscore")
        chars="abcdefghijklmnopqrstuvwxyz_";

    else
        chars="abcdefghijklmnopqrstuvwxyz0123456789";

    let value="";

    for(let i=0;i<length;i++){

        value+=chars[
            Math.floor(Math.random()*chars.length)
        ];

    }

    return value;
}


function generate(){

    const length=
        Math.max(
            3,
            Math.min(
                20,
                Number(
                    document.getElementById("length").value
                )||6
            )
        );

    const count=
        Math.max(
            1,
            Math.min(
                100,
                Number(
                    document.getElementById("count").value
                )||20
            )
        );

    const type=
        document.getElementById("type").value;

    const set=new Set();

    while(set.size<count){

        set.add(
            makeUser(length,type)
        );

    }

    const box=
        document.getElementById("results");

    box.innerHTML="";

    [...set].forEach(username=>{

        const row=
            document.createElement("div");

        row.className="item";

        const text=
            document.createElement("span");

        text.textContent="@"+username;

        const copy=
            document.createElement("button");

        copy.className="copy";
        copy.textContent="نسخ";

        copy.onclick=async()=>{

            try{

                await navigator.clipboard
                    .writeText("@"+username);

                copy.textContent="تم ✓";

                setTimeout(()=>{
                    copy.textContent="نسخ";
                },800);

            }catch{

                copy.textContent="فشل";

            }

        };

        row.append(text,copy);
        box.appendChild(row);

    });

}


/* Snapchat */

function snapGenerate(){

    const box=
        document.getElementById("snapResults");

    box.innerHTML="";

    for(let i=0;i<20;i++){

        const username=
            makeUser(
                6,
                "mixed"
            );

        const row=
            document.createElement("div");

        row.className="item";

        row.innerHTML=
        `<span>@${username}</span>
         <button class="copy"
         onclick="navigator.clipboard.writeText('@${username}')">
         نسخ
         </button>`;

        box.appendChild(row);

    }
}


/* أكواد تجريبية */

function codes(){

    const box=
        document.getElementById("codeResults");

    box.innerHTML="";

    const chars=
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    for(let i=0;i<10;i++){

        let code="";

        for(let j=0;j<12;j++){

            code+=chars[
                Math.floor(
                    Math.random()*chars.length
                )
            ];

        }

        const row=
            document.createElement("div");

        row.className="item";

        row.innerHTML=
        `<span>${code}</span>
         <button class="copy"
         onclick="navigator.clipboard.writeText('${code}')">
         نسخ
         </button>`;

        box.appendChild(row);

    }
}

</script>

</body>
</html>
