<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مولد يوزرات سناب</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111, #252525);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: #181818;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.5);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    .sub {
      color: #aaa;
      margin-bottom: 25px;
    }

    .options {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
    }

    .length {
      flex: 1;
      background: #333;
      color: white;
    }

    .length.active {
      background: #fffc00;
      color: #111;
      font-weight: bold;
    }

    .generate {
      width: 100%;
      background: #fffc00;
      color: #111;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 20px;
    }

    .generate:active,
    .copy:active {
      transform: scale(.97);
    }

    #results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .username {
      background: #292929;
      border-radius: 12px;
      padding: 15px 8px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
    }

    .copy {
      width: 100%;
      background: #444;
      color: white;
      margin-top: 8px;
      font-size: 14px;
    }

    .status {
      min-height: 25px;
      color: #aaa;
      margin-top: 10px;
    }

    .note {
      font-size: 12px;
      color: #777;
      margin-top: 20px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>👻 مولد يوزرات سناب</h1>

    <div class="sub">
      توليد احتمالات يوزرات من 3 أو 4 خانات
    </div>

    <div class="options">
      <button id="three" class="length" onclick="setLength(3)">
        3 خانات
      </button>

      <button id="four" class="length active" onclick="setLength(4)">
        4 خانات
      </button>
    </div>

    <button class="generate" onclick="generateUsernames()">
      🎲 توليد يوزرات
    </button>

    <div id="results"></div>

    <div class="status" id="status"></div>

    <div class="note">
      الأداة تولّد تركيبات عشوائية فقط، ولا تسجّل الدخول إلى حسابات
      أو تتجاوز أنظمة الحماية.
    </div>

  </div>

<script>

  let usernameLength = 4;

  // الأحرف المستخدمة
  const characters =
    "abcdefghijklmnopqrstuvwxyz0123456789._";

  function setLength(length) {

    usernameLength = length;

    document.getElementById("three")
      .classList.remove("active");

    document.getElementById("four")
      .classList.remove("active");

    if (length === 3) {
      document.getElementById("three")
        .classList.add("active");
    } else {
      document.getElementById("four")
        .classList.add("active");
    }

    generateUsernames();
  }


  function randomUsername() {

    let username = "";

    for (let i = 0; i < usernameLength; i++) {

      const randomIndex =
        Math.floor(Math.random() * characters.length);

      username += characters[randomIndex];
    }

    return username;
  }


  function generateUsernames() {

    const results =
      document.getElementById("results");

    results.innerHTML = "";

    const used = new Set();

    while (used.size < 20) {
      used.add(randomUsername());
    }

    used.forEach(username => {

      const container =
        document.createElement("div");

      container.className = "username";

      container.innerHTML = `
        <div>${username}</div>
        <button
          class="copy"
          onclick="copyUsername('${username}')">
          📋 نسخ
        </button>
      `;

      results.appendChild(container);

    });

    document.getElementById("status").textContent =
      "تم توليد 20 يوزر عشوائي";
  }


  async function copyUsername(username) {

    try {

      await navigator.clipboard.writeText(username);

      document.getElementById("status").textContent =
        "✅ تم نسخ: " + username;

    } catch (error) {

      document.getElementById("status").textContent =
        "❌ تعذر النسخ تلقائياً";

    }
  }


  // تشغيل الأداة أول مرة
  generateUsernames();

</script>

</body>
</html>
