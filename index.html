<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولد يوزرات</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

.box {
    background: #1d1d1d;
    padding: 15px;
    border-radius: 15px;
    margin-top: 15px;
}

label {
    display: block;
    margin: 10px 0 6px;
}

select,
button {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    font-size: 16px;
}

select {
    background: #292929;
    color: white;
}

button {
    background: #fffc00;
    color: #111;
    font-weight: bold;
    margin-top: 15px;
}

.result {
    background: #202020;
    border-radius: 12px;
    padding: 12px;
    margin-top: 8px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.username {
    direction: ltr;
    font-weight: bold;
    font-size: 17px;
}

.copy {
    width: auto;
    margin: 0;
    padding: 8px 12px;
    font-size: 13px;
}

.status {
    text-align: center;
    margin: 15px 0;
    color: #aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ مولد يوزرات سريع</h1>

<div class="box">

<label>طول اليوزر</label>

<select id="length">
    <option value="3">3 خانات</option>
    <option value="4" selected>4 خانات</option>
</select>

<label>عدد اليوزرات</label>

<select id="amount">
    <option value="10">10</option>
    <option value="25" selected>25</option>
    <option value="50">50</option>
    <option value="100">100</option>
</select>

<label>نوع اليوزر</label>

<select id="mode">
    <option value="mixed">حروف + أرقام</option>
    <option value="letters">حروف فقط</option>
    <option value="numbers">أرقام فقط</option>
</select>

<button onclick="generate()">
    ⚡ توليد اليوزرات
</button>

</div>

<div id="status" class="status">
    جاهز
</div>

<div id="results"></div>

</div>


<script>

const letters =
    "abcdefghijklmnopqrstuvwxyz";

const numbers =
    "0123456789";


function randomUsername(length, mode) {

    let characters;

    if (mode === "letters") {
        characters = letters;
    }

    else if (mode === "numbers") {
        characters = numbers;
    }

    else {
        characters = letters + numbers;
    }

    let username = "";

    for (let i = 0; i < length; i++) {

        const index =
            Math.floor(
                Math.random() * characters.length
            );

        username += characters[index];
    }

    return username;
}


function generate() {

    const length =
        Number(
            document.getElementById("length").value
        );

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const mode =
        document.getElementById("mode").value;

    const results =
        document.getElementById("results");

    const status =
        document.getElementById("status");


    results.innerHTML = "";


    const usernames =
        new Set();


    while (usernames.size < amount) {

        usernames.add(
            randomUsername(
                length,
                mode
            )
        );
    }


    usernames.forEach(username => {

        const item =
            document.createElement("div");

        item.className =
            "result";


        item.innerHTML = `

            <span class="username">
                @${username}
            </span>

            <button
                class="copy"
                onclick="copy('${username}')">
                نسخ
            </button>

        `;


        results.appendChild(item);

    });


    status.textContent =
        `✅ تم توليد ${amount} يوزر بسرعة`;
}


async function copy(username) {

    try {

        await navigator.clipboard.writeText(
            username
        );

        alert(
            "✅ تم نسخ @" + username
        );

    }

    catch {

        alert(
            "انسخ اليوزر يدويًا: @" +
            username
        );
    }
}

</script>

</body>
</html>
