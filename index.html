<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد يوزرات Snapchat</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #101010;
  color: white;
  padding: 20px;
}

.container {
  max-width: 600px;
  margin: auto;
}

.card {
  background: #1d1d1d;
  border-radius: 22px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

h1 {
  text-align: center;
  margin-top: 0;
}

.description {
  text-align: center;
  color: #aaa;
  margin-bottom: 22px;
}

.options {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  cursor: pointer;
}

.length {
  flex: 1;
  background: #333;
  color: white;
}

.length.active {
  background: #fffc00;
  color: #111;
  font-weight: bold;
}

.generate {
  width: 100%;
  background: #fffc00;
  color: #111;
  font-weight: bold;
  font-size: 18px;
}

#results {
  display: grid;
  gap: 10px;
  margin-top: 20px;
}

.username {
  background: #292929;
  border-radius: 15px;
  padding: 14px;
}

.name {
  text-align: center;
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.actions {
  display: flex;
  gap: 8px;
}

.actions button {
  flex: 1;
  font-size: 14px;
}

.copy {
  background: #444;
  color: white;
}

.open {
  background: #fffc00;
  color: #111;
  font-weight: bold;
}

.status {
  text-align: center;
  color: #aaa;
  margin-top: 15px;
}

.note {
  color: #888;
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>👻 مولّد يوزرات Snapchat</h1>

    <div class="description">
      توليد يوزرات ثلاثية أو رباعية بدون تكرار
    </div>

    <div class="options">

      <button
        id="three"
        class="length"
        onclick="setLength(3)">
        3 خانات
      </button>

      <button
        id="four"
        class="length active"
        onclick="setLength(4)">
        4 خانات
      </button>

    </div>

    <button
      class="generate"
      onclick="generateUsernames()">
      🎲 توليد يوزرات
    </button>

    <div id="results"></div>

    <div id="status" class="status"></div>

    <div class="note">
      زر «فتح» يفتح صفحة Snapchat الخاصة باليوزر.
      وجود صفحة أو عدم وجودها ليس ضمانًا للتوفر؛
      التأكيد النهائي يكون من داخل Snapchat.
    </div>

  </div>

</div>


<script>

let usernameLength = 4;

const characters =
  "abcdefghijklmnopqrstuvwxyz0123456789";


function setLength(length) {

  usernameLength = length;

  document
    .getElementById("three")
    .classList.remove("active");

  document
    .getElementById("four")
    .classList.remove("active");

  if (length === 3) {

    document
      .getElementById("three")
      .classList.add("active");

  } else {

    document
      .getElementById("four")
      .classList.add("active");

  }

  generateUsernames();
}


function createUsername() {

  let username = "";

  for (let i = 0; i < usernameLength; i++) {

    const index =
      Math.floor(
        Math.random() * characters.length
      );

    username += characters[index];

  }

  return username;
}


function generateUsernames() {

  const results =
    document.getElementById("results");

  results.innerHTML = "";

  const usernames = new Set();

  // توليد 30 يوزر مختلف
  while (usernames.size < 30) {
    usernames.add(createUsername());
  }

  usernames.forEach(username => {

    const box =
      document.createElement("div");

    box.className = "username";

    const name =
      document.createElement("div");

    name.className = "name";

    name.textContent = username;


    const actions =
      document.createElement("div");

    actions.className = "actions";


    const copy =
      document.createElement("button");

    copy.className = "copy";

    copy.textContent = "📋 نسخ";

    copy.onclick = () => copyUsername(username);


    const open =
      document.createElement("button");

    open.className = "open";

    open.textContent = "👻 فتح في Snapchat";

    open.onclick = () => openSnapchat(username);


    actions.appendChild(copy);
    actions.appendChild(open);

    box.appendChild(name);
    box.appendChild(actions);

    results.appendChild(box);

  });


  document.getElementById("status").textContent =
    "تم توليد 30 يوزر " +
    (usernameLength === 3 ? "ثلاثي" : "رباعي") +
    " مختلف";
}


async function copyUsername(username) {

  try {

    await navigator.clipboard.writeText(username);

    document.getElementById("status").textContent =
      "✅ تم نسخ " + username;

  } catch {

    document.getElementById("status").textContent =
      "❌ تعذر النسخ";

  }
}


function openSnapchat(username) {

  const url =
    "https://www.snapchat.com/add/" +
    encodeURIComponent(username);

  window.open(url, "_blank");

}


// تشغيل تلقائي
generateUsernames();

</script>

</body>
</html>
