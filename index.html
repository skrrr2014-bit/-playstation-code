<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد يوزرات Snapchat</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #101010;
  color: white;
  padding: 18px;
}

.container {
  max-width: 650px;
  margin: auto;
}

.card {
  background: #1c1c1c;
  border-radius: 22px;
  padding: 22px;
  box-shadow: 0 12px 35px rgba(0,0,0,.4);
}

h1 {
  text-align: center;
  margin: 0 0 8px;
}

.description {
  text-align: center;
  color: #999;
  margin-bottom: 22px;
  font-size: 14px;
}

.options {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.length {
  flex: 1;
  border: 0;
  border-radius: 12px;
  padding: 14px;
  background: #333;
  color: white;
  font-size: 16px;
}

.length.active {
  background: #fffc00;
  color: #111;
  font-weight: bold;
}

.generate {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  background: #fffc00;
  color: #111;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 18px;
}

.generate:active,
button:active {
  transform: scale(.98);
}

.settings {
  background: #292929;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 18px;
}

.settings label {
  display: block;
  margin-bottom: 8px;
  color: #ccc;
}

select {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #404040;
  color: white;
  font-size: 15px;
}

#results {
  display: grid;
  gap: 10px;
}

.username {
  background: #292929;
  border-radius: 15px;
  padding: 14px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.name {
  font-size: 21px;
  font-weight: bold;
  letter-spacing: 1px;
  direction: ltr;
}

.score {
  font-size: 12px;
  color: #aaa;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 11px;
}

.actions button {
  flex: 1;
  border: 0;
  border-radius: 10px;
  padding: 11px;
  font-size: 14px;
}

.copy {
  background: #444;
  color: white;
}

.open {
  background: #fffc00;
  color: #111;
  font-weight: bold;
}

.status {
  text-align: center;
  color: #aaa;
  margin: 14px 0;
  min-height: 20px;
}

.note {
  margin-top: 18px;
  color: #777;
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>👻 مولد يوزرات Snapchat</h1>

<div class="description">
يولد ويصفي اقتراحات ثلاثية أو رباعية تلقائيًا
</div>

<div class="options">

<button
id="three"
class="length"
onclick="setLength(3)">
3 خانات
</button>

<button
id="four"
class="length active"
onclick="setLength(4)">
4 خانات
</button>

</div>

<div class="settings">

<label>نوع الترشيحات</label>

<select id="style">
<option value="balanced">
متوازنة
</option>

<option value="letters">
حروف أكثر
</option>

<option value="numbers">
أرقام أكثر
</option>

<option value="mixed">
مزيج عشوائي
</option>
</select>

</div>

<button
class="generate"
onclick="generate()">
🎲 توليد أفضل الاقتراحات
</button>

<div
id="status"
class="status">
</div>

<div id="results"></div>

<div class="note">
⭐ درجة الترشيح هي ترتيب داخلي لجودة الشكل فقط،
وليست نسبة توفر اليوزر.<br>
⚠️ لا يمكن للأداة تأكيد التوفر بدون تحقق رسمي من Snapchat.
</div>

</div>

</div>


<script>

let usernameLength = 4;

const letters =
"abcdefghijklmnopqrstuvwxyz";

const numbers =
"0123456789";


function setLength(length) {

  usernameLength = length;

  document
    .getElementById("three")
    .classList.remove("active");

  document
    .getElementById("four")
    .classList.remove("active");

  if (length === 3) {

    document
      .getElementById("three")
      .classList.add("active");

  } else {

    document
      .getElementById("four")
      .classList.add("active");

  }

  generate();
}


function randomFrom(text) {

  return text[
    Math.floor(Math.random() * text.length)
  ];

}


function makeUsername() {

  const type =
    document.getElementById("style").value;

  let result = "";

  for (let i = 0; i < usernameLength; i++) {

    let source;

    if (type === "letters") {

      source = letters;

    }

    else if (type === "numbers") {

      source = numbers;

    }

    else if (type === "mixed") {

      source =
        Math.random() < .5
        ? letters
        : numbers;

    }

    else {

      // متوازن
      source =
        Math.random() < .7
        ? letters
        : numbers;

    }

    result += randomFrom(source);

  }

  return result;
}


/*
  تقييم شكلي فقط.
  لا يمثل احتمالية توفر اليوزر.
*/
function scoreUsername(username) {

  let score = 50;

  const unique =
    new Set(username).size;

  if (unique === username.length) {
    score += 15;
  }

  if (unique === username.length - 1) {
    score += 8;
  }

  // مكافأة بعض الأنماط المتناسقة
  if (
    username.length >= 3 &&
    username[0] === username[2]
  ) {
    score += 10;
  }

  if (
    username.length === 4 &&
    username[1] === username[3]
  ) {
    score += 10;
  }

  // عدم الإكثار من الأرقام
  const digitCount =
    (username.match(/[0-9]/g) || []).length;

  if (digitCount === 0) {
    score += 5;
  }

  if (digitCount === username.length) {
    score -= 5;
  }

  return Math.max(1, Math.min(99, score));
}


function generate() {

  const results =
    document.getElementById("results");

  const status =
    document.getElementById("status");

  results.innerHTML = "";

  const usernames = new Set();

  while (usernames.size < 30) {

    usernames.add(makeUsername());

  }

  const list =
    [...usernames].map(username => {

      return {
        username,
        score: scoreUsername(username)
      };

    });

  list.sort(
    (a, b) => b.score - a.score
  );


  list.forEach(item => {

    const box =
      document.createElement("div");

    box.className = "username";

    const top =
      document.createElement("div");

    top.className = "top";

    const name =
      document.createElement("div");

    name.className = "name";

    name.textContent =
      item.username;

    const score =
      document.createElement("div");

    score.className = "score";

    score.textContent =
      "⭐ " + item.score + "/99";

    top.appendChild(name);
    top.appendChild(score);


    const actions =
      document.createElement("div");

    actions.className = "actions";


    const copy =
      document.createElement("button");

    copy.className = "copy";

    copy.textContent =
      "📋 نسخ";

    copy.onclick = function() {
      copyUsername(item.username);
    };


    const open =
      document.createElement("button");

    open.className = "open";

    open.textContent =
      "👻 فتح";

    open.onclick = function() {
      openSnapchat(item.username);
    };


    actions.appendChild(copy);
    actions.appendChild(open);

    box.appendChild(top);
    box.appendChild(actions);

    results.appendChild(box);

  });


  status.textContent =
    "تم توليد 30 اقتراحًا وترتيبها حسب شكل اليوزر";
}


async function copyUsername(username) {

  try {

    await navigator.clipboard.writeText(username);

    document.getElementById("status").textContent =
      "✅ تم نسخ " + username;

  } catch {

    document.getElementById("status").textContent =
      "❌ تعذر النسخ";

  }
}


function openSnapchat(username) {

  const url =
    "https://www.snapchat.com/add/" +
    encodeURIComponent(username);

  window.open(url, "_blank");

}


// تشغيل أولي
generate();

</script>

</body>
</html>
