<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snap Username Checker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.box {
    background: #1c1c1c;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 7px;
}

select,
input,
button {
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

input,
select {
    background: #292929;
    color: white;
}

button {
    background: #fffc00;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

#status {
    text-align: center;
    margin: 15px 0;
    font-weight: bold;
}

.result {
    background: #202020;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.username {
    font-weight: bold;
    direction: ltr;
}

.available {
    color: #00ff7f;
}

.unavailable {
    color: #ff5555;
}

.unknown {
    color: #ffaa00;
}

.small-btn {
    width: auto;
    padding: 8px 12px;
    margin: 0;
    font-size: 13px;
}

.note {
    color: #aaa;
    font-size: 13px;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ مولّد وفاحص اليوزرات</h1>

<div class="box">

<label>طول اليوزر</label>

<select id="length">
    <option value="3">3 أحرف</option>
    <option value="4" selected>4 أحرف</option>
</select>

<label>عدد اليوزرات</label>

<select id="amount">
    <option value="10">10</option>
    <option value="25" selected>25</option>
    <option value="50">50</option>
    <option value="100">100</option>
</select>

<label>نوع اليوزر</label>

<select id="mode">
    <option value="mixed">حروف + أرقام</option>
    <option value="letters">حروف فقط</option>
    <option value="numbers">أرقام فقط</option>
</select>

<label>API المصرّح لك باستخدامه</label>

<input
    id="apiUrl"
    type="url"
    placeholder="https://example.com/api/check"
/>

<button onclick="startCheck()">
    ⚡ توليد وفحص
</button>

</div>

<div id="status">
    جاهز
</div>

<div id="results"></div>

<div class="box note">
    ⚠️ التحقق الفعلي من توفر اسم مستخدم يتطلب API رسمي/مصرّح لك باستخدامه.
    الأداة لا تتجاوز حماية Snapchat ولا تتحقق مباشرة من خوادم Snapchat بدون واجهة مصرح بها.
</div>

</div>

<script>

const letters =
    "abcdefghijklmnopqrstuvwxyz";

const numbers =
    "0123456789";


/* =========================
   توليد يوزر عشوائي
========================= */

function generateUsername(length, mode) {

    let chars = "";

    if (mode === "letters") {
        chars = letters;
    }

    else if (mode === "numbers") {
        chars = numbers;
    }

    else {
        chars = letters + numbers;
    }

    let username = "";

    for (let i = 0; i < length; i++) {

        const randomIndex =
            Math.floor(Math.random() * chars.length);

        username += chars[randomIndex];
    }

    return username;
}


/* =========================
   توليد يوزرات بدون تكرار
========================= */

function generateUniqueUsernames(amount) {

    const length =
        Number(document.getElementById("length").value);

    const mode =
        document.getElementById("mode").value;

    const usernames = new Set();

    while (usernames.size < amount) {

        usernames.add(
            generateUsername(length, mode)
        );
    }

    return [...usernames];
}


/* =========================
   إنشاء عنصر النتيجة
========================= */

function createResultItem(username) {

    const results =
        document.getElementById("results");

    const item =
        document.createElement("div");

    item.className = "result";

    item.id =
        "result-" + username;

    item.innerHTML = `
        <span class="username">@${username}</span>

        <span class="unknown">
            ⏳ فحص...
        </span>

        <button
            class="small-btn"
            onclick="copyUsername('${username}')">
            نسخ
        </button>
    `;

    results.appendChild(item);
}


/* =========================
   تحديث النتيجة
========================= */

function updateResult(
    username,
    text,
    className
) {

    const item =
        document.getElementById(
            "result-" + username
        );

    if (!item) return;

    const status =
        item.querySelector("span:nth-child(2)");

    status.textContent =
        text;

    status.className =
        className;
}


/* =========================
   فحص يوزر عبر API
========================= */

async function checkUsername(
    username,
    apiUrl
) {

    try {

        const response =
            await fetch(apiUrl, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username: username
                })

            });


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }


        const data =
            await response.json();


        if (data.available === true) {

            updateResult(
                username,
                "✅ متاح",
                "available"
            );

        }

        else if (data.available === false) {

            updateResult(
                username,
                "❌ غير متاح",
                "unavailable"
            );

        }

        else {

            updateResult(
                username,
                "⚠️ استجابة غير معروفة",
                "unknown"
            );
        }

    }

    catch (error) {

        updateResult(
            username,
            "⚠️ تعذر التحقق",
            "unknown"
        );

        console.log(
            username,
            error
        );
    }
}


/* =========================
   نسخ اليوزر
========================= */

async function copyUsername(username) {

    try {

        await navigator.clipboard.writeText(
            username
        );

    }

    catch {

        const input =
            document.createElement("textarea");

        input.value =
            username;

        document.body.appendChild(input);

        input.select();

        document.execCommand("copy");

        input.remove();
    }
}


/* =========================
   الفحص السريع
========================= */

async function startCheck() {

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const apiUrl =
        document.getElementById("apiUrl")
            .value
            .trim();

    const results =
        document.getElementById("results");

    const status =
        document.getElementById("status");


    results.innerHTML = "";


    if (!apiUrl) {

        status.textContent =
            "⚠️ أدخل API مصرح لك باستخدامه";

        return;
    }


    const usernames =
        generateUniqueUsernames(amount);


    usernames.forEach(
        username => {

            createResultItem(
                username
            );

        }
    );


    status.textContent =
        "⚡ جاري الفحص السريع...";


    /*
       الفكرة هنا:

       بدلاً من فحص اليوزرات واحداً
       وراء الآخر، يتم إرسال الطلبات
       بالتوازي.

       هذا يقلل وقت الانتظار مع API
       المصرّح به.
    */

    const checks =
        usernames.map(
            username =>
                checkUsername(
                    username,
                    apiUrl
                )
        );


    await Promise.all(checks);


    status.textContent =
        "✅ انتهى الفحص";
}

</script>

</body>
</html>
