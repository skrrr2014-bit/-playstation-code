<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولد يوزرات</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.box{
    background:#1e1e1e;
    padding:18px;
    border-radius:16px;
    margin-top:15px;
}

label{
    display:block;
    margin:12px 0 6px;
}

select,button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    font-size:16px;
}

select{
    background:#292929;
    color:white;
}

button{
    background:#fffc00;
    color:#111;
    font-weight:bold;
    margin-top:15px;
}

.result{
    background:#202020;
    padding:12px;
    margin-top:8px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    direction:ltr;
}

.username{
    font-weight:bold;
}

.copy{
    width:auto;
    padding:8px 12px;
    margin:0;
    font-size:13px;
}

#status{
    text-align:center;
    margin:15px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ مولد اليوزرات</h1>

<div class="box">

<label>طول اليوزر</label>

<select id="length">
    <option value="3">3 خانات</option>
    <option value="4" selected>4 خانات</option>
</select>

<label>عدد اليوزرات</label>

<select id="amount">
    <option value="10">10</option>
    <option value="25" selected>25</option>
    <option value="50">50</option>
    <option value="100">100</option>
</select>

<label>نوع اليوزر</label>

<select id="mode">
    <option value="mixed">حروف + أرقام</option>
    <option value="letters">حروف فقط</option>
    <option value="numbers">أرقام فقط</option>
</select>

<button onclick="generate()">
    ⚡ توليد اليوزرات
</button>

</div>

<div id="status">
    جاهز للتوليد
</div>

<div id="results"></div>

</div>

<script>

const letters =
"abcdefghijklmnopqrstuvwxyz";

const numbers =
"0123456789";


function createUsername(length,mode){

    let chars;

    if(mode === "letters"){
        chars = letters;
    }
    else if(mode === "numbers"){
        chars = numbers;
    }
    else{
        chars = letters + numbers;
    }

    let username = "";

    for(let i=0;i<length;i++){

        username +=
        chars[
            Math.floor(
                Math.random()*chars.length
            )
        ];
    }

    return username;
}


function generate(){

    const length =
    Number(
        document.getElementById("length").value
    );

    const amount =
    Number(
        document.getElementById("amount").value
    );

    const mode =
    document.getElementById("mode").value;

    const results =
    document.getElementById("results");

    const status =
    document.getElementById("status");


    results.innerHTML = "";


    const usernames = new Set();


    while(usernames.size < amount){

        usernames.add(
            createUsername(
                length,
                mode
            )
        );
    }


    usernames.forEach(username => {

        const item =
        document.createElement("div");

        item.className = "result";


        item.innerHTML = `

            <span class="username">
                @${username}
            </span>

            <button
                class="copy"
                onclick="copyUsername('${username}')">
                نسخ
            </button>

        `;


        results.appendChild(item);

    });


    status.textContent =
    "✅ تم التوليد بسرعة";
}


async function copyUsername(username){

    try{

        await navigator.clipboard.writeText(
            username
        );

        alert(
            "✅ تم نسخ @" + username
        );

    }
    catch{

        alert(
            "انسخ @" + username + " يدويًا"
        );

    }

}

</script>

</body>
</html>
