<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداتي</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #111, #242424);
    color: white;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.card {
    background: #1c1c1c;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 10px 35px rgba(0,0,0,.4);
}

h1 {
    text-align: center;
    margin-top: 5px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.menu button,
.back,
.refresh {
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.menu button {
    background: #292929;
    color: white;
}

.menu button:hover {
    background: #3a3a3a;
}

.back {
    background: #444;
    color: white;
    margin-bottom: 15px;
    width: 100%;
}

.refresh {
    background: #fff;
    color: #111;
    width: 100%;
    margin-top: 15px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 15px;
}

.item {
    background: #292929;
    border-radius: 12px;
    padding: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    direction: ltr;
}

.username {
    font-weight: bold;
}

.status {
    font-size: 13px;
    color: #8cff8c;
}

.code {
    background: #292929;
    border-radius: 12px;
    padding: 17px 10px;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 2px;
    direction: ltr;
    margin-top: 15px;
    word-break: break-all;
}

.note {
    margin-top: 15px;
    background: #302d1c;
    color: #ffe98a;
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
}
</style>
</head>

<body>

<div id="codes"></div>

<button class="refresh" onclick="generateCodes()">
🔄 تجديد
</button>

<div class="note">
هذه رموز عشوائية تجريبية مكوّنة من 12 حرفًا ورقمًا،
وليست أكواد Store حقيقية أو مضمونة.
</div>

</div>

</div>
</div>


<script>

function showPage(page) {

    document.querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

    document.getElementById(page)
    .classList.add("active");

    if (page === "store") {
        generateCodes();
    }
}


/* توليد رمز عشوائي تجريبي من 12 خانة */

function randomCode() {

    const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let code = "";

    for (let i = 0; i < 12; i++) {

        code += characters[
            Math.floor(
                Math.random() * characters.length
            )
        ];

    }

    return code;
}


/* إنشاء مجموعة الرموز */

function generateCodes() {

    const box =
        document.getElementById("codes");

    box.innerHTML = "";

    for (let i = 0; i < 5; i++) {

        const code =
            document.createElement("div");

        code.className = "code";

        code.textContent =
            randomCode();

        box.appendChild(code);
    }
}

</script>
