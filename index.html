<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولد يوزرات</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

button, select {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
}

select {
    background: #292929;
    color: white;
    margin-bottom: 10px;
}

.generate {
    background: #fffc00;
    color: #111;
    font-weight: bold;
    margin: 10px 0 20px;
}

.result {
    background: #202020;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    direction: ltr;
}

.username {
    font-weight: bold;
    font-size: 17px;
}

.copy {
    width: auto;
    background: #333;
    color: white;
    padding: 8px 12px;
    font-size: 13px;
}

#status {
    text-align: center;
    color: #aaa;
    margin-bottom: 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ مولد اليوزرات</h1>

<select id="length">
    <option value="3">3 خانات</option>
    <option value="4" selected>4 خانات</option>
</select>

<select id="amount">
    <option value="10">10 يوزرات</option>
    <option value="25">25 يوزر</option>
    <option value="50">50 يوزر</option>
    <option value="100">100 يوزر</option>
</select>

<button class="generate" onclick="generate()">
    🎲 توليد اليوزرات
</button>

<div id="status">جاهز</div>

<div id="results"></div>

</div>

<script>

const chars =
"abcdefghijklmnopqrstuvwxyz0123456789";


function makeUsername(length) {

    let username = "";

    for (let i = 0; i < length; i++) {

        const random =
            Math.floor(
                Math.random() * chars.length
            );

        username += chars[random];
    }

    return username;
}


function generate() {

    const length =
        Number(
            document.getElementById("length").value
        );

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    const usernames = new Set();

    while (usernames.size < amount) {

        usernames.add(
            makeUsername(length)
        );
    }

    usernames.forEach(username => {

        const row =
            document.createElement("div");

        row.className = "result";

        row.innerHTML = `
            <span class="username">
                @${username}
            </span>

            <button
                class="copy"
                onclick="copyUsername('${username}')">
                📋 نسخ
            </button>
        `;

        results.appendChild(row);
    });

    document.getElementById("status").textContent =
        `✅ تم توليد ${amount} يوزر`;
}


async function copyUsername(username) {

    try {

        await navigator.clipboard.writeText(username);

        alert("✅ تم نسخ @" + username);

    } catch {

        const textarea =
            document.createElement("textarea");

        textarea.value = username;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        alert("✅ تم النسخ");
    }
}

</script>

</body>
</html>
