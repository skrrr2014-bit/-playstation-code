<html lang="ar" dir="rtl">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial,sans-serif;
color:white;
}

canvas{
display:block;
width:100%;
height:100%;
touch-action:none;

/* =========================
   الشاشات
========================= */

.screen{
position:fixed;
inset:0;
z-index:50;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(
circle at 50% 35%,
#292522 0%,
#0c0b0a 45%,
#000 100%
);
}

.panel{
width:90%;
max-width:520px;

padding:30px;

background:
rgba(7,6,6,.88);

border:
1px solid rgba(255,255,255,.15);

border-radius:15px;

box-shadow:
0 20px 80px #000;

text-align:center;
}

.title{

font-size:60px;

letter-spacing:5px;

margin:0;

0 0 30px #300;

.subtitle{
color:#888;
margin:12px 0 25px;
}

button{

width:100%;

padding:15px;

margin:7px 0;

border:
1px solid #555;

border-radius:9px;

background:#111;

color:white;

font-size:18px;

}

button:active{
transform:scale(.97);

}

.hidden{
display:none!important;
}


/* =========================
   شاشة اليوم الأول
========================= */

#dayScreen{

background:
linear-gradient(
rgba(0,0,0,.25),
rgba(0,0,0,.9)
),
url("");

}

#dayText{

font-size:52px;

letter-spacing:6px;

text-shadow:
0 0 20px #000,
0 0 40px #000;

animation:
dayAppear 3s ease;

}

#daySub{

margin-top:15px;

color:#aaa;

font-size:17px;

}

@keyframes dayAppear{

0%{
opacity:0;
transform:scale(1.3);
}

100%{
opacity:1;
transform:scale(1);
}

}


/* =========================
   HUD
========================= */

#hud{

position:fixed;

inset:0;

z-index:10;

pointer-events:none;

}

#objective{

position:absolute;

top:18px;

right:18px;

padding:11px 15px;

background:#0009;

border-radius:8px;

font-size:15px;

}

#crosshair{

position:absolute;

left:50%;

top:50%;

transform:
translate(-50%,-50%);

text-shadow:
0 0 5px #000;
}

#message{

position:absolute;

left:50%;

bottom:19%;

transform:
translateX(-50%);

width:90%;

text-align:center;

font-size:18px;

text-shadow:
0 2px 8px #000;
}

   عصا الحركة
========================= */

#joystick{

position:fixed;

left:20px;

bottom:25px;

width:135px;

height:135px;

z-index:20;

border:
2px solid #ffffff25;

border-radius:50%;

touch-action:none;
}

#stick{

position:absolute;

left:38px;

top:38px;

width:58px;

height:58px;

border-radius:50%;

background:#ffffff28;

border:
1px solid #ffffff40;

box-shadow:
0 0 15px #000;
}


/* =========================
   النظر
========================= */

#lookZone{

position:fixed;

right:0;

top:0;

width:65%;

height:80%;

z-index:15;

}


/* =========================
   زر التفاعل
========================= */

#action{

position:fixed;

right:22px;

bottom:28px;

width:70px;

height:70px;

border-radius:50%;

z-index:25;

/* =========================

========================= */

width:62px;

height:62px;

/* =========================

========================= */

#vignette{

radial-gradient(

/* =========================
   التلاشي
========================= */

#fade{

position:fixed;

inset:0;

/* =====================================================
   المواد
===================================================== */

function material(
color,
roughness=1,
metalness=0
){

return new THREE.MeshStandardMaterial({

color:color,

roughness:roughness,

metalness:metalness

});

}


/* =====================================================
   الجدران
===================================================== */

function createWall(
x,
y,
z,
width,
height,
depth,
color=0x302925
){

const wall=
new THREE.Mesh(

new THREE.BoxGeometry(
width,
height,
depth
),

material(color)

);

wall.position.set(
x,
y,
z
);

wall.castShadow=true;

wall.receiveShadow=true;

scene.add(wall);

return wall;

}


/* =====================================================
   الأثاث
===================================================== */

function furniture(
x,
y,
z,
width,
height,
depth,
color,
rotation=0
){

const item=
new THREE.Mesh(

new THREE.BoxGeometry(
width,
height,
depth
),

material(color)

);

item.position.set(
x,
y,
z
);

item.rotation.y=
rotation;

item.castShadow=true;

item.receiveShadow=true;

scene.add(item);

return item;

}

0x211d1b,

-Math.PI/2;

/* الجدران الخارجية */

createWall(

24,4,.4

createWall(
-12,2,0,
.4,4,24

createWall(
12,2,0,

/* الجدران الداخلية */

createWall(
-6,2,-3,
.3,4,12

createWall(
6,2,-3,
.3,4,12
);

createWall(
0,2,5,
12,.3,.3

/* =====================

===================== */

furniture(

3,.35,5,
0x342523

furniture(
0,.9,7,
2.8,.45,4.7,
0x161719

furniture(
0,1.17,8.5,
1.8,.2,.8,
0x77706b
);


/* =====================
   طاولة
===================== */

furniture(
-8,1,7,
2.8,.25,1.4,
0x3b2920
);

furniture(
-9.1,.5,7,
.18,1,.18,
0x3b2920

furniture(
-6.9,.5,7,
.18,1,.18,
0x3b2920

/* =====================
   كراسي
===================== */

for(
let i=0;
i<2;
i++
){

furniture(
-8+i*2,

5.5,

1.2,

===================== */

7,

4,

0x241817

/* مقابض الخزانة */

8

/* =====================================================
   إعداد المحرك
===================================================== */

function init(){

scene=
new THREE.Scene();


scene.background=
new THREE.Color(
0x080706
);


scene.fog=
new THREE.FogExp2(
0x080706,
.035
);


/* الكاميرا */

camera=
new THREE.PerspectiveCamera(
74,
innerWidth/innerHeight,
.05,
100
);

camera.rotation.order=
"YXZ";


/* الرندر */

renderer=
new THREE.WebGLRenderer({

antialias:true,

powerPreference:"high-performance"

});


renderer.setPixelRatio(
Math.min(
devicePixelRatio,
1.8
)
);


renderer.setSize(
innerWidth,
innerHeight
);


renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;


/* تحسين الصورة */

renderer.outputColorSpace=
THREE.SRGBColorSpace;

renderer.toneMapping=
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=
1.25;


document.body.insertBefore(
renderer.domElement,
document.body.firstChild
);


/* إضاءة عامة */

const ambient=
new THREE.HemisphereLight(
0x6e7680,
0x15100e,
.42
);

scene.add(ambient);


/* ضوء القمر */

const moon=
new THREE.DirectionalLight(
0x8796aa,
.75
);

moon.position.set(
-8,
12,
6
);

moon.castShadow=true;

scene.add(moon);


buildHouse();

createOldWoman();

createFlashlight();

bindControls();


window.addEventListener(
"resize",
resize
);

}


/* =====================================================
   التحكم باللمس
===================================================== */

function bindControls(){


/* العصا */

joystick.addEventListener(
"pointerdown",
e=>{

joystick.setPointerCapture(
e.pointerId
);

updateJoystick(e);

}
);


joystick.addEventListener(
"pointermove",
e=>{

if(
joystick.hasPointerCapture(
e.pointerId
)
){

updateJoystick(e);

}

}
);


joystick.addEventListener(
"pointerup",
()=>{

joystickX=0;

joystickY=0;

stick.style.transform=
"translate(0,0)";

}
);


function updateJoystick(e){

const rect=
joystick.getBoundingClientRect();

const centerX=
rect.left+
rect.width/2;

const centerY=
rect.top+
rect.height/2;

let dx=
e.clientX-centerX;

let dy=
e.clientY-centerY;


const max=42;

const length=
Math.hypot(dx,dy);


if(length>max){

dx=
dx/length*max;

dy=
dy/length*max;

}


joystickX=
dx/max;

joystickY=
dy/max;


stick.style.transform=
`translate(${dx}px,${dy}px)`;

}


/* =====================
   النظر
===================== */

lookZone.addEventListener(
"pointerdown",
e=>{

looking=true;

lastLookX=
e.clientX;

lastLookY=
e.clientY;

lookZone.setPointerCapture(
e.pointerId
);

}
);


lookZone.addEventListener(
"pointermove",
e=>{

if(!looking)return;


const dx=
e.clientX-lastLookX;

const dy=
e.clientY-lastLookY;


lastLookX=
e.clientX;

lastLookY=
e.clientY;


/* يمين ويسار */

yaw -=
dx*sensitivity;


/* فوق وتحت */

pitch -=
dy*sensitivity;


pitch=
Math.max(
-1.35,
Math.min(
1.35,
pitch
)
);

}
);


lookZone.addEventListener(
"pointerup",
()=>{
looking=false;
}
);


/* =====================
   الركض
===================== */

runButton.addEventListener(
"pointerdown",
()=>{
running=true;
}
);

runButton.addEventListener(
"pointerup",
()=>{
running=false;
}
);

runButton.addEventListener(
"pointercancel",
()=>{
running=false;
}
);


/* =====================
   التفاعل
===================== */

action.onclick=
interact;

}


/* =====================================================
   المشهد السينمائي
===================================================== */

function startCinematic(){

/*
المشهد هنا بصري:
الكاميرا تبدأ منخفضة فوق السرير،
ثم ترتفع تدريجيًا،
ثم تنظر للباب،
ثم يبدأ اللعب.
*/

camera.position.set(
0,
.75,
7
);

camera.rotation.set(
-.15,
Math.PI,
0
);


/* إخفاء HUD */

hud.classList.add(
"hidden"
);

joystick.classList.add(
"hidden"
);

lookZone.classList.add(
"hidden"
);

action.classList.add(
"hidden"
);

runButton.classList.add(
"hidden"
);


/* إخفاء اليوم الأول */

dayScreen.classList.add(
"hidden"
);


/* حركة الكاميرا */

const startTime=
performance.now();


function cinematicFrame(){

const elapsed=
(performance.now()-
startTime)/1000;


/* 0 - 2 ثواني */

if(
elapsed<2
){

const t=
elapsed/2;

camera.position.y=
.75+
t*.9;

camera.rotation.x=
-.15+
t*.1;

}


/* 2 - 4 ثواني */

else if(
elapsed<4
){

const t=
(elapsed-2)/2;

camera.rotation.y=
Math.PI-
t*.7;

}


/* 4 - 6 ثواني */

else if(
elapsed<6
){

const t=
(elapsed-4)/2;

camera.position.z=
7-
t*1.5;

camera.rotation.x=
-.05+
t*.15;

}


/* نهاية المشهد */

else{

cinematic=false;

showGameplay();

return;

}


requestAnimationFrame(
cinematicFrame
);

}


cinematicFrame();

}


/* =====================================================
   إظهار اللعب
===================================================== */

function showGameplay(){

hud.classList.remove(
"hidden"
);

joystick.classList.remove(
"hidden"
);

lookZone.classList.remove(
"hidden"
);

action.classList.remove(
"hidden"
);

runButton.classList.remove(
"hidden"
);

vignette.classList.remove(
"hidden"
);


/* العجوز تظهر */

enemyActive=true;

enemy.visible=true;

enemy.position.set(
0,
0,
-7
);


/* الهدف */

objective.textContent=
"الهدف: اهرب من البيت";


message.textContent=
"هناك شيء هنا... ابحث عن المفتاح.";

}


/* =====================================================
   التفاعل
===================================================== */

function interact(){

if(
!gameRunning ||
cinematic ||
dead ||
escaped
)return;


/* المفتاح */

if(
key.visible &&
distance(
player,
key.position
)<1.7
){

hasKey=true;

key.visible=false;

playSound(
650,
.15
);

message.textContent=
"وجدت المفتاح.";


objective.textContent=
"الهدف: اذهب إلى باب الخروج";


setTimeout(()=>{
message.textContent="";
},2200);


return;

}


/* الباب */

if(
distance(
player,
exitDoor.position
)<2
){

if(hasKey){

escaped=true;

finishGame(true);

}else{

message.textContent=
"الباب مقفل... تحتاج إلى مفتاح.";

setTimeout(()=>{
message.textContent="";
},2200);

}

}

}


/* =====================================================
   المسافة
===================================================== */

function distance(a,b){

return Math.hypot(
a.x-b.x,
a.z-b.z
);

}


/* =====================================================
   حركة اللاعب
===================================================== */

function updatePlayer(dt){

/*
الحركة الجديدة:
ليست مباشرة.
فيها تسارع وتباطؤ
حتى تصبح Smooth.
*/


let forward=
-joystickY;

let strafe=
joystickX;


/* السرعة */

let maxSpeed=
running &&
stamina>.05
?
4.2
:
2.4;


/* استهلاك stamina */

if(
running &&
(
Math.abs(forward)>.1 ||
Math.abs(strafe)>.1
)
){

stamina=
Math.max(
0,
stamina-dt*.4
);

}else{

stamina=
Math.min(
1,
stamina+dt*.22
);

}


/* اتجاه الكاميرا */

const sin=
Math.sin(yaw);

const cos=
Math.cos(yaw);


/* الاتجاه الصحيح */

const targetX=
(
strafe*cos+
forward*sin
)*maxSpeed;


const targetZ=
(
-strafe*sin+
forward*cos
)*maxSpeed;


/* Smooth acceleration */

const acceleration=
12;


player.vx=
THREE.MathUtils.damp(
player.vx,
targetX,
acceleration,
dt
);


player.vz=
THREE.MathUtils.damp(
player.vz,
targetZ,
acceleration,
dt
);


/* الحركة */

player.x +=
player.vx*dt;

player.z +=
player.vz*dt;


/* حدود البيت */

player.x=
THREE.MathUtils.clamp(
player.x,
-10,
10
);

player.z=
THREE.MathUtils.clamp(
player.z,
-10,
10
);


/* الكاميرا */

camera.position.x=
player.x;

camera.position.y=
player.y;

camera.position.z=
player.z;


/* النظر */

camera.rotation.x=
pitch;

camera.rotation.y=
yaw;

camera.rotation.z=0;


/* اهتزاز خفيف أثناء المشي */

const moving=
Math.hypot(
player.vx,
player.vz
)>0.2;


if(moving){

const bob=
Math.sin(
performance.now()*.009
)*.018;

camera.position.y=
player.y+bob;

}

}


/* =====================================================
   الذكاء الاصطناعي للعجوز
===================================================== */

function updateEnemy(dt){

if(!enemyActive)
return;


const dx=
player.x-
enemy.position.x;

const dz=
player.z-
enemy.position.z;

const distanceToPlayer=
Math.hypot(
dx,
dz
);


if(
distanceToPlayer<14
){

const speed=
.75*
enemySpeed[difficultyMode];


/* العجوز تقترب */

enemy.position.x +=
dx/distanceToPlayer*
speed*
dt;

enemy.position.z +=
dz/distanceToPlayer*
speed*
dt;


/* تنظر للاعب */

enemy.lookAt(
player.x,
1.2,
player.z
);


/* رعب */

if(
distanceToPlayer<6
){

vignette.style.opacity=
"0.65";

}else{

vignette.style.opacity=
"0.2";

}


/* قبضت عليك */

if(
distanceToPlayer<1.15
){

dead=true;

finishGame(false);

}

}

}


/* =====================================================
   تحديث الكشاف
===================================================== */

function updateFlashlight(){

flashlight.position.copy(
camera.position
);


/*
مهم:
الضوء يتبع اتجاه النظر
بدون عكس.
*/

const direction=
new THREE.Vector3(
0,
0,
-1
);

direction.applyQuaternion(
camera.quaternion
);


flashlight.target.position.copy(
camera.position
).add(
direction.multiplyScalar(10)
);

}


/* =====================================================
   الصوت
===================================================== */

function playSound(
frequency,
duration
){

if(!soundEnabled)
return;


try{

audioContext||=
new(
window.AudioContext||
window.webkitAudioContext
)();


const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();


oscillator.frequency.value=
frequency;

oscillator.type=
"sine";


gain.gain.value=.04;


oscillator.connect(gain);

gain.connect(
audioContext.destination
);


oscillator.start();


gain.gain.exponentialRampToValueAtTime(
.0001,
audioContext.currentTime+
duration
);


oscillator.stop(
audioContext.currentTime+
duration
);

}catch(e){}

}


/* =====================================================
   نهاية اللعبة
===================================================== */

function finishGame(won){

gameRunning=false;

hud.classList.add(
"hidden"
);

joystick.classList.add(
"hidden"
);

lookZone.classList.add(
"hidden"
);

action.classList.add(
"hidden"
);

runButton.classList.add(
"hidden"
);


fade.style.opacity=
"1";


setTimeout(()=>{

fade.style.opacity=
"0";


menu.classList.remove(
"hidden"
);


const panel=
menu.querySelector(
".panel"
);


if(won){

panel.innerHTML=`

<h1 class="title">
LaGranny
</h1>

<h2>
لقد هربت!
</h2>

<div class="subtitle">
خرجت من البيت... لكنك لا تعرف ماذا كان يعيش هناك.
</div>

<button id="restart">
العب من جديد
</button>

`;

}else{

panel.innerHTML=`

<h1 class="title">
LaGranny
</h1>

<h2>
لقد وجدتك...
</h2>

<div class="subtitle">
لم يكن البيت مهجورًا كما ظننت.
</div>

<button id="restart">
حاول مرة أخرى
</button>

`;

}


document
.getElementById("restart")
.onclick=
()=>{
location.reload();
};


},1200);

}


/* =====================================================
   الحلقة الرئيسية
===================================================== */

let lastTime=
performance.now();


function loop(){

requestAnimationFrame(
loop
);


const now=
performance.now();


const dt=
Math.min(
.05,
(now-lastTime)/1000
);


lastTime=now;


if(
gameRunning &&
!cinematic
){

updatePlayer(dt);

updateEnemy(dt);

updateFlashlight();

}


if(renderer){

renderer.render(
scene,
camera
);

}

}


loop();


/* =====================================================
   بدء شاشة القائمة
===================================================== */

</script>
