<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snap Username Finder</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#fff700,#ffeb3b,#ffffff);
    display:flex;
    justify-content:center;
    padding:25px 12px;
}

.container{
    width:100%;
    max-width:650px;
}

.card{
    background:rgba(255,255,255,.94);
    border-radius:25px;
    padding:22px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin:5px 0 8px;
    font-size:28px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:22px;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

label{
    font-weight:bold;
    margin-bottom:5px;
    display:block;
}

select,input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    background:white;
}

.full{
    grid-column:1 / -1;
}

button{
    width:100%;
    border:0;
    padding:14px;
    border-radius:13px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.generate{
    background:#111;
    color:white;
    margin-top:15px;
}

.generate:active{
    transform:scale(.98);
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.copy{
    background:#eee;
}

.clear{
    background:#eee;
}

.results{
    margin-top:20px;
}

.result{
    background:#f7f7f7;
    border-radius:15px;
    padding:13px;
    margin-bottom:9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.username{
    direction:ltr;
    font-weight:bold;
    font-size:17px;
}

.status{
    white-space:nowrap;
    padding:7px 10px;
    border-radius:10px;
    font-size:13px;
    font-weight:bold;
}

.waiting{
    background:#fff3cd;
    color:#856404;
}

.check{
    background:#111;
    color:white;
    width:auto;
    padding:8px 12px;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px;
}

.note{
    margin-top:18px;
    padding:13px;
    background:#fff8d7;
    border-radius:12px;
    color:#665900;
    font-size:13px;
    line-height:1.7;
}

.counter{
    text-align:center;
    margin-top:12px;
    color:#666;
    font-size:14px;
}

@media(max-width:500px){
    .controls{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .result{
        flex-wrap:wrap;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>👻 Snap Username Finder</h1>

<div class="subtitle">
مولّد أسماء مستخدمين مع تحقق يدوي رسمي
</div>

<div class="controls">

<div>
<label>طول اليوزر</label>
<select id="length">
<option value="3">3 أحرف</option>
<option value="4" selected>4 أحرف</option>
</select>
</div>

<div>
<label>العدد</label>
<select id="amount">
<option value="10">10</option>
<option value="25">25</option>
<option value="50" selected>50</option>
<option value="100">100</option>
</select>
</div>

<div class="full">
<label>نوع اليوزر</label>
<select id="mode">
<option value="mixed">حروف + أرقام</option>
<option value="letters">حروف فقط</option>
<option value="numbers">أرقام + حروف</option>
</select>
</div>

</div>

<button class="generate" onclick="generateUsers()">
⚡ توليد اليوزرات
</button>

<div class="actions">
<button class="copy" onclick="copyAll()">
📋 نسخ الكل
</button>

<button class="clear" onclick="clearResults()">
🗑️ مسح
</button>
</div>

<div class="counter" id="counter"></div>

<div class="results" id="results">
<div class="empty">
اضغط «توليد اليوزرات» للبدء
</div>
</div>

<div class="note">
⚠️ الحالة الظاهرة بجانب اليوزر هي «بانتظار التحقق».
اضغط 🔎 للتحقق عبر Snapchat مباشرة.
لن أعرض «متاح» أو «غير متاح» بشكل وهمي.
</div>

</div>
</div>

<script>

const letters = "abcdefghijklmnopqrstuvwxyz";
const numbers = "0123456789";

let generatedUsers = [];

/* توليد يوزر مطابق لقواعد سناب:
   يبدأ بحرف وينتهي بحرف أو رقم */
function randomUsername(length, mode){

    let first = letters[Math.floor(Math.random()*letters.length)];

    let chars = "";

    if(mode === "letters"){
        chars = letters;
    }
    else{
        chars = letters + numbers;
    }

    let username = first;

    for(let i=1;i<length;i++){
        username += chars[Math.floor(Math.random()*chars.length)];
    }

    return username;
}


function generateUsers(){

    const length =
        Number(document.getElementById("length").value);

    const amount =
        Number(document.getElementById("amount").value);

    const mode =
        document.getElementById("mode").value;

    generatedUsers = [];

    const used = new Set();

    while(generatedUsers.length < amount){

        const username =
            randomUsername(length, mode);

        if(!used.has(username)){
            used.add(username);
            generatedUsers.push(username);
        }
    }

    displayUsers();
}


function displayUsers(){

    const results =
        document.getElementById("results");

    results.innerHTML = "";

    generatedUsers.forEach(username => {

        const row =
            document.createElement("div");

        row.className = "result";

        row.innerHTML = `

            <div class="username">
                ${username}
            </div>

            <div class="status waiting">
                🟡 بانتظار التحقق
            </div>

            <button
                class="check"
                onclick="checkUsername('${username}')">
                🔎 تحقق
            </button>

        `;

        results.appendChild(row);
    });

    document.getElementById("counter").textContent =
        generatedUsers.length + " يوزر";
}


/*
   يفتح صفحة اليوزر على Snapchat.
   إذا كان الحساب موجودًا ستظهر لك صفحة الحساب.
   وإذا لم يكن موجودًا ستقدر تتأكد من Snapchat نفسه.
*/
function checkUsername(username){

    const url =
        "https://www.snapchat.com/add/" +
        encodeURIComponent(username);

    window.open(url, "_blank");
}


function copyAll(){

    if(generatedUsers.length === 0){
        alert("ولّد اليوزرات أولًا");
        return;
    }

    const text =
        generatedUsers.join("\n");

    navigator.clipboard.writeText(text)
    .then(() => {
        alert("✅ تم نسخ جميع اليوزرات");
    })
    .catch(() => {
        alert("تعذر النسخ تلقائيًا");
    });
}


function clearResults(){

    generatedUsers = [];

    document.getElementById("results").innerHTML = `
        <div class="empty">
            تم المسح 🗑️
        </div>
    `;

    document.getElementById("counter").textContent = "";
}

</script>

</body>
</html>
