<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RwL</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

/* فيديو العين الحقيقي */
#eyeVideo{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:0;
    filter:grayscale(100%) contrast(1.18) brightness(.55);
    opacity:.86;
}

/* التعتيم السينمائي */
.overlay{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
        radial-gradient(circle at center,
            transparent 5%,
            rgba(0,0,0,.18) 45%,
            rgba(0,0,0,.9) 100%),
        linear-gradient(
            rgba(0,0,0,.12),
            rgba(0,0,0,.52)
        );
}

/* الثلج */
#snow{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
}

/* المحتوى */
.app{
    position:relative;
    z-index:5;
    width:min(900px,94%);
    margin:auto;
    padding:25px 0 60px;
}

.screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    width:100%;
    padding:32px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:28px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(13px);
    box-shadow:
        0 25px 100px #000,
        inset 0 0 45px rgba(255,255,255,.018);
}

.logo{
    text-align:center;
    font-size:86px;
    font-weight:900;
    letter-spacing:-9px;
    text-shadow:
        0 0 12px rgba(255,255,255,.3),
        0 0 45px rgba(255,255,255,.1);
}

.subtitle{
    text-align:center;
    color:#8b8b8b;
    letter-spacing:7px;
    font-size:10px;
    margin-top:-8px;
    margin-bottom:30px;
}

.welcomeText{
    text-align:center;
    color:#aaa;
    font-size:13px;
    margin-bottom:20px;
}

button{
    font:inherit;
    cursor:pointer;
}

.mainBtn{
    width:100%;
    padding:16px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.14);
    color:#fff;
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.12),
        rgba(255,255,255,.025)
    );
    transition:.2s;
}

.mainBtn:hover{
    transform:translateY(-2px);
    border-color:rgba(255,255,255,.35);
    box-shadow:0 12px 35px #000;
}

input{
    width:100%;
    padding:16px;
    margin:10px 0;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.12);
    outline:none;
    background:rgba(0,0,0,.65);
    color:#fff;
    text-align:center;
    font-size:16px;
}

.error{
    min-height:20px;
    color:#ff5368;
    text-align:center;
    font-size:12px;
    margin-top:8px;
}

#login,
#home{
    display:none;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:20px 0;
}

.tab{
    padding:14px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    color:#fff;
}

.tab.active{
    background:#fff;
    color:#000;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.list{
    display:grid;
    gap:8px;
    margin-top:16px;
    max-height:420px;
    overflow:auto;
}

.user{
    display:flex;
    align-items:center;
    justify-content:space-between;
    direction:ltr;
    gap:8px;
    padding:12px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.04);
}

.actions{
    display:flex;
    gap:6px;
}

.small{
    border:1px solid rgba(255,255,255,.12);
    background:#111;
    color:#fff;
    padding:8px 11px;
    border-radius:9px;
}

.status{
    text-align:center;
    color:#777;
    font-size:11px;
    margin-top:12px;
}

/* زر الصوت */
.musicBtn{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:20;
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.78);
    color:#fff;
    font-size:18px;
}

@media(max-width:600px){
    .logo{
        font-size:64px;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .card{
        padding:23px;
    }
}
</style>
</head>

<body>

<!-- ضع فيديو العين الحقيقي هنا باسم eye.mp4 -->
<video id="eyeVideo"
       autoplay
       muted
       loop
       playsinline>
    <source src="eye.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<canvas id="snow"></canvas>

<div class="app">

<!-- البداية -->
<div class="screen" id="welcome">

<div class="card">

<div class="logo">RwL</div>

<div class="subtitle">
UNKNOWN • USERNAME • LAB
</div>

<div class="welcomeText">
العين تراقب... والباقي عليك.
</div>

<button class="mainBtn" onclick="openLogin()">
مرحبًا بك — اضغط للدخول
</button>

</div>

</div>


<!-- الرمز -->
<div class="screen" id="login">

<div class="card">

<h2 style="text-align:center">
🔐 فضلاً اكتب الرمز
</h2>

<div class="welcomeText">
أدخل رمز RwL للمتابعة
</div>

<input
    id="code"
    type="password"
    inputmode="numeric"
    placeholder="••••">

<button class="mainBtn" onclick="unlock()">
دخول
</button>

<div class="error" id="error"></div>

</div>

</div>


<!-- الرئيسية -->
<div id="home">

<div class="card">

<div class="logo" style="font-size:55px">
RwL
</div>

<div class="subtitle">
CONTROL PANEL
</div>

<div class="tabs">

<button class="tab active"
        onclick="changeTab('tiktok',this)">
🎵 TikTok
</button>

<button class="tab"
        onclick="changeTab('snapchat',this)">
👻 Snapchat
</button>

</div>


<!-- TikTok -->
<div id="tiktok" class="section active">

<div class="controls">

<input id="ttLength"
       type="number"
       min="3"
       max="24"
       value="6"
       placeholder="طول اليوزر">

<input id="ttCount"
       type="number"
       min="1"
       max="100"
       value="20"
       placeholder="العدد">

</div>

<button class="mainBtn"
        onclick="generate('tt')">
⚡ توليد يوزرات TikTok
</button>

<div class="list" id="ttList"></div>

</div>


<!-- Snapchat -->
<div id="snapchat" class="section">

<div class="controls">

<input id="scLength"
       type="number"
       min="3"
       max="24"
       value="6"
       placeholder="طول اليوزر">

<input id="scCount"
       type="number"
       min="1"
       max="100"
       value="20"
       placeholder="العدد">

</div>

<button class="mainBtn"
        onclick="generate('sc')">
⚡ توليد يوزرات Snapchat
</button>

<div class="list" id="scList"></div>

</div>

<div class="status">
«نسخ» ينسخ اليوزر بدون @
</div>

</div>

</div>

</div>


<!-- زر الموسيقى -->
<button class="musicBtn"
        id="musicBtn"
        onclick="toggleMusic()">
🔇
</button>


<script>

/* =========================
   الدخول
========================= */

function openLogin(){

    document.getElementById("welcome")
        .style.display="none";

    document.getElementById("login")
        .style.display="flex";

    startMusic();
}

function unlock(){

    const code =
        document.getElementById("code").value;

    if(code === "2112"){

        document.getElementById("login")
            .style.display="none";

        document.getElementById("home")
            .style.display="block";

    }else{

        document.getElementById("error")
            .textContent="الرمز غير صحيح 🔴";

    }
}


/* =========================
   التبويبات
========================= */

function changeTab(id,button){

    document
        .querySelectorAll(".section")
        .forEach(x =>
            x.classList.remove("active")
        );

    document
        .querySelectorAll(".tab")
        .forEach(x =>
            x.classList.remove("active")
        );

    document
        .getElementById(id)
        .classList.add("active");

    button.classList.add("active");
}


/* =========================
   توليد اليوزرات
========================= */

function randomUsername(length){

    const chars =
        "abcdefghijklmnopqrstuvwxyz0123456789";

    let name = "";

    for(let i=0;i<length;i++){

        name += chars[
            Math.floor(Math.random()*chars.length)
        ];

    }

    return name;
}

function generate(type){

    let length;
    let count;
    let list;

    if(type === "tt"){

        length =
            Number(
                document.getElementById("ttLength").value
            ) || 6;

        count =
            Number(
                document.getElementById("ttCount").value
            ) || 20;

        list =
            document.getElementById("ttList");

    }else{

        length =
            Number(
                document.getElementById("scLength").value
            ) || 6;

        count =
            Number(
                document.getElementById("scCount").value
            ) || 20;

        list =
            document.getElementById("scList");
    }

    length = Math.max(3,Math.min(24,length));
    count = Math.max(1,Math.min(100,count));

    list.innerHTML="";

    const names = new Set();

    while(names.size < count){
        names.add(randomUsername(length));
    }

    names.forEach(name => {

        const row =
            document.createElement("div");

        row.className="user";

        const text =
            document.createElement("span");

        text.textContent=name;

        const actions =
            document.createElement("div");

        actions.className="actions";


        /* نسخ */
        const copy =
            document.createElement("button");

        copy.className="small";
        copy.textContent="نسخ";

        copy.onclick = async() => {

            try{

                await navigator.clipboard
                    .writeText(name);

            }catch{

                const area =
                    document.createElement("textarea");

                area.value=name;
                document.body.appendChild(area);
                area.select();
                document.execCommand("copy");
                area.remove();

            }

            copy.textContent="تم ✓";

            setTimeout(()=>{
                copy.textContent="نسخ";
            },900);

        };


        /* فتح الحساب */
        const open =
            document.createElement("button");

        open.className="small";
        open.textContent="فتح";

        open.onclick = () => {

            if(type === "tt"){

                window.open(
                    "https://www.tiktok.com/@" +
                    encodeURIComponent(name),
                    "_blank"
                );

            }else{

                window.open(
                    "https://www.snapchat.com/add/" +
                    encodeURIComponent(name),
                    "_blank"
                );

            }

        };

        actions.append(copy,open);
        row.append(text,actions);
        list.appendChild(row);

    });
}


/* =========================
   ثلج خفيف
========================= */

const canvas =
    document.getElementById("snow");

const ctx =
    canvas.getContext("2d");

let flakes=[];

function resizeSnow(){

    canvas.width=innerWidth;
    canvas.height=innerHeight;

}

resizeSnow();

window.addEventListener(
    "resize",
    resizeSnow
);

for(let i=0;i<100;i++){

    flakes.push({
        x:Math.random()*innerWidth,
        y:Math.random()*innerHeight,
        r:Math.random()*2+.4,
        speed:Math.random()*.65+.2,
        drift:Math.random()*.35-.175
    });

}

function drawSnow(){

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    flakes.forEach(f => {

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle="rgba(255,255,255,.55)";
        ctx.fill();

        f.y += f.speed;
        f.x += f.drift;

        if(f.y > innerHeight + 5){

            f.y=-5;
            f.x=Math.random()*innerWidth;

        }

    });

    requestAnimationFrame(drawSnow);
}

drawSnow();


/* =========================
   نغمة غامضة خفيفة
========================= */

let audioContext=null;
let masterGain=null;
let oscillators=[];
let musicOn=false;

function startMusic(){

    if(audioContext){

        if(audioContext.state === "suspended"){
            audioContext.resume();
        }

        return;
    }

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    masterGain =
        audioContext.createGain();

    masterGain.gain.value=.018;

    masterGain.connect(
        audioContext.destination
    );

    /*
       عدة نغمات منخفضة جدًا
       تعطي جوًا غامضًا هادئًا
    */

    const notes=[
        55,
        65.41,
        73.42
    ];

    notes.forEach((frequency,index)=>{

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type="sine";
        osc.frequency.value=frequency;

        gain.gain.value=.12;

        osc.connect(gain);
        gain.connect(masterGain);

        osc.start();

        oscillators.push({
            osc,
            gain,
            base:frequency
        });

    });

    musicOn=true;

    document.getElementById("musicBtn")
        .textContent="🔊";
}

function toggleMusic(){

    if(!audioContext){

        startMusic();
        return;
    }

    if(musicOn){

        masterGain.gain.setTargetAtTime(
            0,
            audioContext.currentTime,
            .15
        );

        musicOn=false;

        document.getElementById("musicBtn")
            .textContent="🔇";

    }else{

        masterGain.gain.setTargetAtTime(
            .018,
            audioContext.currentTime,
            .15
        );

        musicOn=true;

        document.getElementById("musicBtn")
            .textContent="🔊";

    }

}

</script>

</body>
</html>
