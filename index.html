<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RwL Store Checker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at 15% 20%, rgba(55,90,255,.20), transparent 35%),
    radial-gradient(circle at 85% 80%, rgba(145,40,220,.20), transparent 35%),
    #020205;
  font-family: Arial, sans-serif;
  color: white;
}

.card {
  width: min(100%, 370px);
  padding: 28px;
  border-radius: 28px;
  background: linear-gradient(145deg, rgba(32,32,42,.97), rgba(7,7,11,.98));
  border: 1px solid rgba(255,255,255,.13);
  box-shadow: 0 30px 90px rgba(0,0,0,.8);
}

.brand {
  text-align: center;
  font-size: 48px;
  font-weight: 900;
  letter-spacing: 8px;
  background: linear-gradient(90deg,#fff,#80aaff,#fff,#c58cff,#fff);
  background-size: 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}

@keyframes shine {
  from { background-position: 0%; }
  to { background-position: 300%; }
}

.subtitle {
  text-align: center;
  color: #888;
  font-size: 10px;
  letter-spacing: 3px;
  margin: 4px 0 23px;
}

.label {
  display: block;
  color: #bbb;
  font-size: 12px;
  margin-bottom: 8px;
}

#codeInput {
  width: 100%;
  height: 54px;
  padding: 0 14px;
  border-radius: 14px;
  border: 1px solid #34343e;
  outline: none;
  background: #030305;
  color: white;
  text-align: center;
  direction: ltr;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 2px;
}

#codeInput:focus {
  border-color: #637cff;
  box-shadow: 0 0 22px rgba(80,110,255,.20);
}

.status {
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  margin-top: 12px;
  padding: 12px;
  border-radius: 14px;
  background: #08080c;
  border: 1px solid #25252d;
  color: #999;
  font-size: 12px;
  line-height: 1.6;
}

button {
  width: 100%;
  min-height: 47px;
  margin-top: 9px;
  padding: 11px;
  border: 0;
  border-radius: 12px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:active {
  transform: scale(.96);
}

.check {
  background: linear-gradient(90deg,#00c6ff,#4169ff);
  color: white;
}

.copy {
  background: #292930;
  color: white;
}

.clear {
  background: transparent;
  border: 1px solid #30303a;
  color: #999;
}

.info {
  margin-top: 17px;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,.08);
  text-align: center;
  font-size: 9px;
  line-height: 1.8;
  color: #666;
}
</style>
</head>

<body>

<div class="card">

  <div class="brand">RwL</div>

  <div class="subtitle">
    PLAYSTATION STORE CHECKER
  </div>

  <label class="label">
    أدخل رمز PlayStation Store
  </label>

  <input
    id="codeInput"
    type="text"
    maxlength="12"
    autocomplete="off"
    autocapitalize="characters"
    spellcheck="false"
    placeholder="XXXXXXXXXXXX"
  >

  <div id="status" class="status">
    بانتظار إدخال الرمز
  </div>

  <button class="check" onclick="checkCode()">
    التحقق من الكود
  </button>

  <button class="copy" onclick="copyCode()">
    نسخ الرمز
  </button>

  <button class="clear" onclick="clearCode()">
    مسح
  </button>

  <div class="info">
    يتم تنظيف الكود تلقائيًا وفحص صيغته فقط.
  </div>

</div>

<script>

const input = document.getElementById("codeInput");
const status = document.getElementById("status");

/* تنظيف تلقائي:
   A-Z + 0-9 فقط
*/
input.addEventListener("input", function () {

  input.value = input.value
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "")
    .slice(0, 12);

});


/* التحقق من الصيغة */
function checkCode() {

  const code = input.value;

  if (code.length === 0) {

    showStatus(
      "⚠️ أدخل الكود أولًا.",
      "#ffcc66"
    );

    return;
  }

  if (code.length < 12) {

    showStatus(
      "❌ الكود ناقص — يجب أن يكون 12 خانة.",
      "#ff7777"
    );

    return;
  }

  if (!/^[A-Z0-9]{12}$/.test(code)) {

    showStatus(
      "❌ الكود يحتوي على أحرف أو رموز غير مسموحة.",
      "#ff7777"
    );

    return;
  }

  showStatus(
    "✓ صيغة الكود صحيحة: 12 خانة A-Z / 0-9",
    "#8cffb0"
  );

}


/* نسخ الكود */
function copyCode() {

  const code = input.value;

  if (!code) {

    showStatus(
      "⚠️ أدخل الكود أولًا.",
      "#ffcc66"
    );

    return;
  }

  navigator.clipboard.writeText(code)
    .then(function () {

      showStatus(
        "✓ تم نسخ الكود.",
        "#8cffb0"
      );

    })
    .catch(function () {

      const area = document.createElement("textarea");

      area.value = code;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();

      showStatus(
        "✓ تم نسخ الكود.",
        "#8cffb0"
      );

    });

}


/* مسح */
function clearCode() {

  input.value = "";

  showStatus(
    "بانتظار إدخال الرمز",
    "#999"
  );

  input.focus();

}


/* رسالة الحالة */
function showStatus(message, color) {

  status.textContent = message;
  status.style.color = color;

}


/* زر Enter */
input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    checkCode();
  }

});

</script>

</body>
</html>
