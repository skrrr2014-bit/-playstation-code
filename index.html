<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RwL Tools</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    padding:18px;
    color:white;
    background:
    radial-gradient(circle at 20% 10%,#6d3cff 0%,transparent 35%),
    radial-gradient(circle at 90% 80%,#ff2d95 0%,transparent 30%),
    #08080e;
}

.container{
    max-width:600px;
    margin:auto;
}

.card{
    background:rgba(20,20,30,.92);
    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;
    padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.cover{
    text-align:center;
    padding:18px 0 28px;
}

.logo{
    width:100px;
    height:100px;
    margin:auto;
    border-radius:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    font-size:30px;
    font-weight:900;
    box-shadow:0 12px 40px rgba(124,58,237,.4);
}

.title{
    font-size:32px;
    font-weight:900;
    margin-top:16px;
}

.subtitle{
    color:#aaa;
    margin-top:6px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:12px;
}

button{
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.menu button,
.back{
    padding:17px;
    border-radius:16px;
    background:#272733;
    color:white;
    font-size:17px;
}

.back{
    width:100%;
    margin-bottom:16px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:15px 0;
}

.action{
    padding:14px;
    border-radius:14px;
    background:white;
    color:#111;
    font-size:15px;
}

.refresh{
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    color:white;
}

.list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.item{
    display:grid;
    grid-template-columns:1fr auto auto;
    align-items:center;
    gap:8px;
    padding:12px;
    border-radius:14px;
    background:#242431;
    direction:ltr;
}

.name{
    font-weight:bold;
    overflow:hidden;
    text-overflow:ellipsis;
}

.status{
    direction:rtl;
    font-size:12px;
    padding:7px 8px;
    border-radius:9px;
    background:#403d21;
    color:#ffe66d;
    white-space:nowrap;
}

.copyOne{
    background:#353544;
    color:white;
    border-radius:9px;
    padding:8px 10px;
}

.code{
    display:grid;
    grid-template-columns:1fr auto;
    gap:8px;
    align-items:center;
    padding:12px;
    margin-bottom:8px;
    background:#242431;
    border-radius:14px;
}

.codeText{
    direction:ltr;
    text-align:center;
    font-weight:bold;
    letter-spacing:2px;
    overflow:hidden;
    word-break:break-all;
}

.note{
    margin-top:15px;
    padding:13px;
    border-radius:13px;
    background:#29261a;
    color:#e8d889;
    font-size:12px;
    line-height:1.7;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<!-- الرئيسية -->
<section id="home" class="page active">

<div class="cover">
<div class="logo">RwL</div>
<div class="title">RwL Tools</div>
<div class="subtitle">Username Generator</div>
</div>

<div class="menu">
<button onclick="openPage('tiktok')">🎵 يوزرات تيك توك</button>
<button onclick="openPage('snap')">👻 يوزرات سناب</button>
<button onclick="openPage('store')">🎟️ تخمين ستور</button>
</div>

</section>


<!-- تيك توك -->
<section id="tiktok" class="page">

<button class="back" onclick="openPage('home')">← رجوع</button>

<h2>🎵 يوزرات تيك توك</h2>

<div class="actions">
<button class="action refresh" onclick="generateTikTok()">🔄 تجديد</button>
<button class="action" onclick="copyAll(tiktokUsers)">📋 نسخ الكل</button>
</div>

<div id="tikList" class="list"></div>

</section>


<!-- سناب -->
<section id="snap" class="page">

<button class="back" onclick="openPage('home')">← رجوع</button>

<h2>👻 يوزرات سناب</h2>

<div class="actions">
<button class="action refresh" onclick="generateSnap()">🔄 تجديد</button>
<button class="action" onclick="copyAll(snapUsers)">📋 نسخ الكل</button>
</div>

<div id="snapList" class="list"></div>

</section>


<!-- ستور -->
<section id="store" class="page">

<button class="back" onclick="openPage('home')">← رجوع</button>

<h2>🎟️ تخمين ستور</h2>

<div class="actions">
<button class="action refresh" onclick="generateCodes()">🔄 تجديد</button>
<button class="action" onclick="copyAll(storeCodes)">📋 نسخ الكل</button>
</div>

<div id="codeList"></div>

<div class="note">
الرموز هنا عشوائية من 12 حرفًا ورقمًا، وليست أكواد Store مؤكدة الصلاحية.
</div>

</section>

</div>
</div>


<script>

const letters =
"abcdefghijklmnopqrstuvwxyz";

const chars =
"abcdefghijklmnopqrstuvwxyz0123456789";

let tiktokUsers=[];
let snapUsers=[];
let storeCodes=[];


/* الانتقال */

function openPage(page){

    document
    .querySelectorAll(".page")
    .forEach(x=>x.classList.remove("active"));

    document
    .getElementById(page)
    .classList.add("active");

    if(page==="tiktok")
        generateTikTok();

    if(page==="snap")
        generateSnap();

    if(page==="store")
        generateCodes();
}


/* توليد يوزر */

function makeUsername(){

    let lengths=[4,4,4,4,4,5,5,6,7,8];

    let length =
        lengths[
            Math.floor(Math.random()*lengths.length)
        ];

    let username =
        letters[
            Math.floor(Math.random()*letters.length)
        ];

    for(let i=1;i<length;i++){

        username +=
            chars[
                Math.floor(Math.random()*chars.length)
            ];
    }

    return username;
}


/* قائمة يوزرات */

function makeUsers(amount=30){

    let set=new Set();

    while(set.size<amount){
        set.add(makeUsername());
    }

    return [...set];
}


/* عرض اليوزرات */

function renderUsers(users,id){

    const box=document.getElementById(id);

    box.innerHTML="";

    users.forEach(user=>{

        const row=document.createElement("div");

        row.className="item";

        row.innerHTML=`
            <span class="name">@${user}</span>

            <span class="status">
                🟡 غير متحقق
            </span>

            <button
                class="copyOne"
                onclick="copyOne('${user}')">
                📋
            </button>
        `;

        box.appendChild(row);
    });
}


/* تيك */

function generateTikTok(){

    tiktokUsers=makeUsers(30);

    renderUsers(
        tiktokUsers,
        "tikList"
    );
}


/* سناب */

function generateSnap(){

    snapUsers=makeUsers(30);

    renderUsers(
        snapUsers,
        "snapList"
    );
}


/* كود ستور */

function makeCode(){

    let code="";

    for(let i=0;i<12;i++){

        code +=
            chars[
                Math.floor(Math.random()*chars.length)
            ].toUpperCase();
    }

    return code;
}


function generateCodes(){

    let set=new Set();

    while(set.size<10){
        set.add(makeCode());
    }

    storeCodes=[...set];

    const box=
        document.getElementById("codeList");

    box.innerHTML="";

    storeCodes.forEach(code=>{

        const row=
            document.createElement("div");

        row.className="code";

        row.innerHTML=`
            <span class="codeText">
                ${code}
            </span>

            <button
                class="copyOne"
                onclick="copyOne('${code}')">
                📋 نسخ
            </button>
        `;

        box.appendChild(row);
    });
}


/* نسخ عنصر واحد */

function copyOne(text){

    navigator.clipboard
    .writeText(text)
    .then(()=>{
        alert("✅ تم النسخ");
    });
}


/* نسخ الكل */

function copyAll(list){

    if(!list.length) return;

    navigator.clipboard
    .writeText(list.join("\n"))
    .then(()=>{
        alert("✅ تم نسخ الكل");
    });
}


/* تشغيل أولي */

generateTikTok();

</script>

</body>
</html>
