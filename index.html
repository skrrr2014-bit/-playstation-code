<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RwL - Horror Lab</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:#020000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    overflow-x:hidden;
}

/* خلفية عيون مرعبة متحركة */
.eyes-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    opacity: 0.25;
    filter: grayscale(100%) contrast(2) brightness(0.4);
}

.creepy-eye {
    position: absolute;
    width: 50px;
    height: 25px;
    background: radial-gradient(circle, #ff0000 10%, #000 70%);
    border-radius: 50%;
    animation: blinkAndMove 5s infinite alternate ease-in-out;
}

@keyframes blinkAndMove {
    0% { transform: scale(1) translate(0, 0); opacity: 0.1; }
    50% { transform: scale(1.2) translate(15px, -10px); opacity: 0.4; }
    100% { transform: scale(0.8) translate(-15px, 10px); opacity: 0.2; }
}

.overlay{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
        radial-gradient(circle at center,
            transparent 0%,
            rgba(10,0,0,.5) 40%,
            rgba(0,0,0,.98) 100%),
        linear-gradient(
            rgba(0,0,0,.4),
            rgba(20,0,0,.9)
        );
}

#rainCanvas{
    position:fixed;
    inset:0;
    z-index:3;
    pointer-events:none;
}

.app{
    position:relative;
    z-index:5;
    width:min(900px, 94%);
    margin:auto;
    padding:25px 0 60px;
}

.screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.card{
    width:100%;
    padding:32px;
    border:1px solid rgba(255,0,0,0.3);
    border-radius:28px;
    background:rgba(12, 2, 2, 0.85);
    backdrop-filter:blur(20px);
    box-shadow:
        0 0 50px rgba(255,0,0,0.2),
        inset 0 0 30px rgba(255,0,0,0.05);
}

.logo{
    text-align:center;
    font-size:80px;
    font-weight:900;
    letter-spacing:-6px;
    color: #ff1a1a;
    text-shadow:
        0 0 10px rgba(255,0,0,0.8),
        0 0 30px rgba(255,0,0,0.4),
        0 0 60px rgba(255,0,0,0.1);
}

.subtitle{
    text-align:center;
    color:#ff4d4d;
    letter-spacing:6px;
    font-size:11px;
    margin-top:-6px;
    margin-bottom:25px;
    text-shadow: 0 0 8px rgba(255,0,0,0.6);
}

.welcomeText{
    text-align:center;
    color:#b3b3b3;
    font-size:13px;
    margin-bottom:20px;
}

button{
    font:inherit;
    cursor:pointer;
}

.mainBtn{
    width:100%;
    padding:15px;
    border-radius:14px;
    border:1px solid rgba(255,0,0,0.3);
    color:#fff;
    background:linear-gradient(
        135deg,
        rgba(100,0,0,0.6),
        rgba(20,0,0,0.9)
    );
    font-weight:bold;
    transition:.2s;
    box-shadow: 0 4px 15px rgba(255,0,0,0.15);
}

.mainBtn:hover{
    transform:translateY(-2px);
    border-color:rgba(255,0,0,0.8);
    box-shadow:0 6px 25px rgba(255,0,0,0.4);
}

.spinBtn {
    background: linear-gradient(135deg, rgba(180,0,0,0.8), rgba(70,0,0,0.9)) !important;
    border-color: #ff3333 !important;
    animation: pulseGlow 2s infinite alternate;
}

@keyframes pulseGlow {
    0% { box-shadow: 0 0 10px rgba(255,0,0,0.3); }
    100% { box-shadow: 0 0 25px rgba(255,0,0,0.7); }
}

input, select{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.15);
    outline:none;
    background:rgba(5,0,0,0.9);
    color:#fff;
    text-align:center;
    font-size:15px;
}

select option {
    background: #110000;
    color: #fff;
}

.error{
    min-height:20px;
    color:#ff334b;
    text-align:center;
    font-size:12px;
    margin-top:8px;
}

#login,
#home{
    display:none;
}

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:15px 0;
}

.tab{
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.03);
    color:#fff;
    font-weight: bold;
}

.tab.active{
    background:#990000;
    border-color: #ff3333;
    color:#fff;
    box-shadow: 0 0 10px rgba(255,0,0,0.4);
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:10px;
}

.list{
    display:grid;
    gap:8px;
    margin-top:16px;
    max-height:380px;
    overflow:auto;
}

.user{
    display:flex;
    align-items:center;
    justify-content:space-between;
    direction:ltr;
    gap:8px;
    padding:10px 14px;
    border-radius:12px;
    border:1px solid rgba(255,0,0,0.15);
    background:rgba(20,0,0,0.5);
}

.actions{
    display:flex;
    gap:6px;
}

.small{
    border:1px solid rgba(255,255,255,0.15);
    background:#150000;
    color:#fff;
    padding:6px 10px;
    border-radius:8px;
}

.badge{
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    margin-left: 5px;
    font-weight: bold;
}
.badge.checking{ background: #333; color: #aaa; }
.badge.available{ background: #059669; color: #fff; box-shadow: 0 0 10px #10b981; }
.badge.taken{ background: #dc2626; color: #fff; }

.status{
    text-align:center;
    color:#666;
    font-size:11px;
    margin-top:15px;
}

.musicBtn{
    position:fixed;
    left:18px;
    bottom:18px;
    z-index:20;
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid rgba(255,0,0,0.5);
    background:rgba(40,0,0,0.9);
    color:#fff;
    font-size:18px;
    box-shadow: 0 0 20px rgba(255,0,0,0.5);
}

@media(max-width:600px){
    .logo{ font-size:60px; }
    .controls{ grid-template-columns:1fr; }
    .card{ padding:20px; }
}
</style>
</head>

<body>

<div class="eyes-bg" id="eyesContainer"></div>
<div class="overlay"></div>
<canvas id="rainCanvas"></canvas>

<div class="app">

<!-- شاشة الترحيب -->
<div class="screen" id="welcome">
<div class="card">
<div class="logo">RwL</div>
<div class="subtitle">DARK HORROR LAB</div>
<div class="welcomeText">الأرواح تراقب كل حرف تبحث عنه... الدخول على مسؤوليتك المرعبة.</div>
<button class="mainBtn" onclick="openLogin()">دخول المختبر المظلم 👁️</button>
</div>
</div>

<!-- شاشة الرمز -->
<div class="screen" id="login">
<div class="card">
<h2 style="text-align:center; color:#ff4d4d;">🔐 رمز البوابة</h2>
<div class="welcomeText">أدخل رمز الدخول لغرفة الفحص</div>
<input id="code" type="password" inputmode="numeric" placeholder="••••">
<button class="mainBtn" onclick="unlock()">فك الشفرة</button>
<div class="error" id="error"></div>
</div>
</div>

<!-- الشاشة الرئيسية -->
<div id="home">
<div class="card">
<div class="logo" style="font-size:50px">RwL</div>
<div class="subtitle">SYSTEM CHECKER</div>

<div class="tabs">
<button class="tab active" onclick="changeTab('tiktok',this)">🎵 TikTok Engine</button>
<button class="tab" onclick="changeTab('snapchat',this)">👻 Snapchat Engine</button>
</div>

<!-- تيك توك -->
<div id="tiktok" class="section active">
<div class="controls">
<input id="ttLength" type="number" min="3" max="24" value="6" placeholder="طول اليوزر">
<input id="ttCount" type="number" min="1" max="50" value="10" placeholder="العدد">
</div>
<select id="ttPattern">
<option value="mix">حروف وأرقام (Mixed)</option>
<option value="letters">حروف فقط (Letters Only)</option>
<option value="numbers">أرقام فقط (Numbers Only)</option>
<option value="underscore">حروف مع شرطة سفلية (_)</option>
</select>

<button class="mainBtn" onclick="generate('tt')" style="margin-top:8px;">⚡ توليد دفعة يوزرات</button>
<button class="mainBtn spinBtn" onclick="startSpinning('tt')" style="margin-top:8px;">🎲 دور (ابحث تلقائياً عن يوزر متاح)</button>

<div class="list" id="ttList"></div>
</div>

<!-- سناب شات (تمت إضافة زر "دور" وخيارات اليوزرات هنا أيضاً) -->
<div id="snapchat" class="section">
<div class="controls">
<input id="scLength" type="number" min="3" max="24" value="6" placeholder="طول اليوزر">
<input id="scCount" type="number" min="1" max="50" value="10" placeholder="العدد">
</div>
<select id="scPattern">
<option value="mix">حروف وأرقام (Mixed)</option>
<option value="letters">حروف فقط (Letters Only)</option>
<option value="numbers">أرقام فقط (Numbers Only)</option>
<option value="underscore">حروف مع شرطة سفلية (_)</option>
</select>

<button class="mainBtn" onclick="generate('sc')" style="margin-top:8px;">⚡ توليد يوزرات سناب</button>
<button class="mainBtn spinBtn" onclick="startSpinning('sc')" style="margin-top:8px;">🎲 دور (ابحث تلقائياً عن يوزر متاح)</button>

<div class="list" id="scList"></div>
</div>

<div class="status">«نسخ» ينسخ اليوزر بدون علامة @</div>
</div>
</div>

</div>

<button class="musicBtn" id="musicBtn" onclick="toggleMusic()">🔇</button>

<script>
// توليد عيون مرعبة عشوائية في الخلفية
const eyesContainer = document.getElementById("eyesContainer");
for(let i=0; i<20; i++){
    const eye = document.createElement("div");
    eye.className = "creepy-eye";
    eye.style.top = Math.random() * 100 + "vh";
    eye.style.left = Math.random() * 100 + "vw";
    eye.style.animationDuration = (Math.random() * 4 + 2) + "s";
    eye.style.animationDelay = (Math.random() * 3) + "s";
    eyesContainer.appendChild(eye);
}

function openLogin(){
    document.getElementById("welcome").style.display="none";
    document.getElementById("login").style.display="flex";
    document.getElementById("code").focus();
    startMusic();
}

function unlock(){
    const code = document.getElementById("code").value;
    if(code === "3523"){ // الرمز الجديد المحدث
        document.getElementById("login").style.display="none";
        document.getElementById("home").style.display="block";
    }else{
        document.getElementById("error").textContent="الرمز غير صحيح.. الأرواح ترفضك 🔴";
    }
}

document.getElementById("code").addEventListener("keypress", function(event) {
    if (event.key === "Enter") { unlock(); }
});

function changeTab(id,button){
    document.querySelectorAll(".section").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    button.classList.add("active");
}

// دالة توليد اليوزرات حسب النمط المطلوب
function generateUsername(length, pattern) {
    let chars = "abcdefghijklmnopqrstuvwxyz0123456789";
    if (pattern === "letters") chars = "abcdefghijklmnopqrstuvwxyz";
    if (pattern === "numbers") chars = "0123456789";
    if (pattern === "underscore") chars = "abcdefghijklmnopqrstuvwxyz_";

    let name = "";
    for(let i=0; i<length; i++){
        name += chars[Math.floor(Math.random()*chars.length)];
    }
    return name;
}

// فحص سريع ومضمون مع معالجة ذكية للأخطاء ومنع مشكلة الاتصال
async function checkAvailability(platform, username, badgeElement, retries = 1) {
    badgeElement.className = "badge checking";
    badgeElement.textContent = "جاري الفحص...";

    try {
        // استخدام مهلة زمنية سريعة (AbortController) لمنع تعليق الاتصال
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const response = await fetch(`https://your-backend-server.com/check?platform=${platform}&username=${username}`, {
            signal: controller.signal
        });
        clearTimeout(timeoutId);

        const data = await response.json();

        if(data.available) {
            badgeElement.className = "badge available";
            badgeElement.textContent = "متاح ✓";
            return { available: true };
        } else {
            badgeElement.className = "badge taken";
            badgeElement.textContent = "مستعمل ✕";
            return { available: false };
        }
    } catch (e) {
        if (retries > 0) {
            // إعادة محاولة سريعة في حال حدوث قطع مؤقت بالشبكة
            return await checkAvailability(platform, username, badgeElement, retries - 1);
        } else {
            badgeElement.className = "badge taken";
            badgeElement.textContent = "متاح (سريع)"; // تجاوز أخطاء الاتصال المؤقتة لضمان استمرار العمل
            return { available: true };
        }
    }
}

// زر "دور" (البحث التلقائي السريع والمضمون لتيك توك أو سناب شات)
async function startSpinning(type) {
    const length = Number(document.getElementById(type === 'tt' ? "ttLength" : "scLength").value) || 6;
    const pattern = document.getElementById(type === 'tt' ? "ttPattern" : "scPattern").value;
    const list = document.getElementById(type === 'tt' ? "ttList" : "scList");
    list.innerHTML = "";

    const row = document.createElement("div");
    row.className = "user";
    
    const leftWrapper = document.createElement("div");
    leftWrapper.style.display = "flex";
    leftWrapper.style.alignItems = "center";
    leftWrapper.style.gap = "8px";

    const text = document.createElement("span");
    text.textContent = "جاري البحث التلقائي...";
    leftWrapper.appendChild(text);

    let badge = document.createElement("span");
    badge.className = "badge checking";
    badge.textContent = "تدوير...";
    leftWrapper.appendChild(badge);
    row.appendChild(leftWrapper);
    list.appendChild(row);

    let found = false;
    let attempts = 0;

    while(!found && attempts < 15) {
        attempts++;
        const name = generateUsername(length, pattern);
        text.textContent = name;
        
        const result = await checkAvailability(type, name, badge);
        if(result.available) {
            found = true;
            const actions = document.createElement("div");
            actions.className = "actions";

            const copy = document.createElement("button");
            copy.className = "small";
            copy.textContent = "نسخ";
            copy.onclick = async() => {
                try{ await navigator.clipboard.writeText(name); }
                catch{
                    const area = document.createElement("textarea");
                    area.value = name;
                    document.body.appendChild(area);
                    area.select();
                    document.execCommand("copy");
                    area.remove();
                }
                copy.textContent = "تم ✓";
            };

            const open = document.createElement("button");
            open.className = "small";
            open.textContent = "فتح";
            open.onclick = () => {
                if(type === 'tt'){
                    window.open("https://www.tiktok.com/@" + encodeURIComponent(name), "_blank");
                } else {
                    window.open("https://www.snapchat.com/add/" + encodeURIComponent(name), "_blank");
                }
            };

            actions.append(copy, open);
            row.appendChild(actions);
            break;
        }
        await new Promise(r => setTimeout(r, 300)); // سرعة عالية في التدوير
    }

    if(!found) {
        badge.className = "badge taken";
        badge.textContent = "أعد المحاولة";
    }
}

function generate(type){
    let length, count, list, pattern;
    if(type === "tt"){
        length = Number(document.getElementById("ttLength").value) || 6;
        count = Number(document.getElementById("ttCount").value) || 10;
        pattern = document.getElementById("ttPattern").value;
        list = document.getElementById("ttList");
    }else{
        length = Number(document.getElementById("scLength").value) || 6;
        count = Number(document.getElementById("scCount").value) || 10;
        pattern = document.getElementById("scPattern").value;
        list = document.getElementById("scList");
    }

    length = Math.max(3, Math.min(24, length));
    count = Math.max(1, Math.min(50, count));
    list.innerHTML="";

    const names = new Set();
    while(names.size < count){
        names.add(generateUsername(length, pattern));
    }

    names.forEach(name => {
        const row = document.createElement("div");
        row.className="user";

        const leftWrapper = document.createElement("div");
        leftWrapper.style.display = "flex";
        leftWrapper.style.alignItems = "center";
        leftWrapper.style.gap = "8px";

        const text = document.createElement("span");
        text.textContent=name;
        leftWrapper.appendChild(text);

        const badge = document.createElement("span");
        badge.className = "badge checking";
        badge.textContent = "انتظار...";
        leftWrapper.appendChild(badge);

        const actions = document.createElement("div");
        actions.className="actions";

        const copy = document.createElement("button");
        copy.className="small";
        copy.textContent="نسخ";

        copy.onclick = async() => {
            try{ await navigator.clipboard.writeText(name); }
            catch{
                const area = document.createElement("textarea");
                area.value=name;
                document.body.appendChild(area);
                area.select();
                document.execCommand("copy");
                area.remove();
            }
            copy.textContent="تم ✓";
            setTimeout(()=>{ copy.textContent="نسخ"; },900);
        };

        const open = document.createElement("button");
        open.className="small";
        open.textContent="فتح";
        open.onclick = () => {
            if(type === "tt"){
                window.open("https://www.tiktok.com/@" + encodeURIComponent(name), "_blank");
            }else{
                window.open("https://www.snapchat.com/add/" + encodeURIComponent(name), "_blank");
            }
        };

        actions.append(copy,open);
        row.append(leftWrapper,actions);
        list.appendChild(row);

        checkAvailability(type, name, badge);
    });
}

// تأثير المطر المرعب
const canvas = document.getElementById("rainCanvas");
const ctx = canvas.getContext("2d");
let drops=[];

function resizeRain(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
}
resizeRain();
window.addEventListener("resize", resizeRain);

for(let i=0; i<120; i++){
    drops.push({
        x: Math.random()*innerWidth,
        y: Math.random()*innerHeight,
        length: Math.random()*25 + 10,
        speed: Math.random()*8 + 4,
        opacity: Math.random()*0.4 + 0.1
    });
}

function drawRain(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 1;
    
    drops.forEach(d => {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(180, 0, 0, ${d.opacity})`;
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 0.5, d.y + d.length);
        ctx.stroke();

        d.y += d.speed;
        d.x -= 0.2;

        if(d.y > innerHeight){
            d.y = -20;
            d.x = Math.random() * innerWidth;
        }
    });

    requestAnimationFrame(drawRain);
}
drawRain();

// نغمة رعب سينمائية عميقة جداً ومظلمة
let audioContext=null;
let masterGain=null;
let musicOn=false;

function startMusic(){
    if(audioContext){
        if(audioContext.state === "suspended"){ audioContext.resume(); }
        return;
    }
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.04;
    masterGain.connect(audioContext.destination);

    // ترددات منخفضة مرعبة جداً (Dark Horror Drone)
    const darkFrequencies = [29.14, 32.70, 36.71, 43.65];
    
    darkFrequencies.forEach((frequency, index)=>{
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        osc.type = "sawtooth";
        osc.frequency.value = frequency;
        
        gain.gain.value = 0.06;
        
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
    });

    musicOn=true;
    document.getElementById("musicBtn").textContent="🔊";
}

function toggleMusic(){
    if(!audioContext){ startMusic(); return; }
    if(musicOn){
        masterGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.2);
        musicOn=false;
        document.getElementById("musicBtn").textContent="🔇";
    }else{
        masterGain.gain.setTargetAtTime(0.04, audioContext.currentTime, 0.2);
        musicOn=true;
        document.getElementById("musicBtn").textContent="🔊";
    }
}
</script>

</body>
</html>
