<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولد يوزرات</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #0f0f0f;
  color: white;
  padding: 18px;
}

.container {
  max-width: 700px;
  margin: auto;
}

.card {
  background: #1b1b1b;
  border-radius: 22px;
  padding: 22px;
}

h1 {
  text-align: center;
  margin-top: 0;
}

.sub {
  text-align: center;
  color: #999;
  margin-bottom: 20px;
}

.row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

button,
select {
  border: 0;
  border-radius: 12px;
  padding: 13px;
  font-size: 15px;
}

.length {
  flex: 1;
  background: #333;
  color: white;
}

.length.active {
  background: #fffc00;
  color: #111;
  font-weight: bold;
}

select {
  width: 100%;
  background: #333;
  color: white;
  margin-bottom: 12px;
}

.generate {
  width: 100%;
  background: #fffc00;
  color: #111;
  font-weight: bold;
  font-size: 18px;
}

#results {
  margin-top: 20px;
  display: grid;
  gap: 8px;
}

.item {
  background: #292929;
  border-radius: 12px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.name {
  flex: 1;
  direction: ltr;
  text-align: left;
  font-weight: bold;
  font-size: 18px;
}

.item button {
  background: #444;
  color: white;
  padding: 10px;
}

.open {
  background: #fffc00 !important;
  color: #111 !important;
}

.status {
  text-align: center;
  color: #aaa;
  margin-top: 15px;
}

.note {
  color: #777;
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
  margin-top: 18px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>👻 مولّد اليوزرات</h1>

<div class="sub">
توليد تلقائي لاقتراحات ثلاثية ورباعية
</div>

<div class="row">

<button
id="three"
class="length"
onclick="setLength(3)">
3 خانات
</button>

<button
id="four"
class="length active"
onclick="setLength(4)">
4 خانات
</button>

</div>

<select id="amount">

<option value="50">50 يوزر</option>
<option value="100">100 يوزر</option>
<option value="250">250 يوزر</option>
<option value="500">500 يوزر</option>
<option value="1000">1000 يوزر</option>

</select>

<select id="style">

<option value="mixed">
مزيج حروف وأرقام
</option>

<option value="letters">
حروف فقط
</option>

<option value="numbers">
أرقام فقط
</option>

</select>

<button
class="generate"
onclick="generate()">
🎲 توليد
</button>

<div
id="status"
class="status">
</div>

<div id="results"></div>

<div class="note">
⚠️ هذه الأداة تولّد اقتراحات فقط ولا تؤكد توفر اليوزر.
استخدم زر «فتح» للتحقق من اليوزر يدويًا.
</div>

</div>

</div>


<script>

let length = 4;

const letters =
"abcdefghijklmnopqrstuvwxyz";

const numbers =
"0123456789";


function setLength(value) {

  length = value;

  document
    .getElementById("three")
    .classList.remove("active");

  document
    .getElementById("four")
    .classList.remove("active");

  document
    .getElementById(
      value === 3 ? "three" : "four"
    )
    .classList.add("active");

  generate();
}


function randomChar(source) {

  return source[
    Math.floor(
      Math.random() * source.length
    )
  ];
}


function createUsername() {

  const type =
    document.getElementById("style").value;

  let username = "";

  for (let i = 0; i < length; i++) {

    let source;

    if (type === "letters") {

      source = letters;

    } else if (type === "numbers") {

      source = numbers;

    } else {

      source =
        Math.random() < 0.65
        ? letters
        : numbers;

    }

    username += randomChar(source);
  }

  return username;
}


function generate() {

  const amount =
    Number(
      document.getElementById("amount").value
    );

  const results =
    document.getElementById("results");

  const status =
    document.getElementById("status");

  results.innerHTML = "";

  const usernames = new Set();

  while (usernames.size < amount) {

    usernames.add(createUsername());

  }


  usernames.forEach(username => {

    const item =
      document.createElement("div");

    item.className = "item";


    const name =
      document.createElement("div");

    name.className = "name";

    name.textContent = username;


    const copy =
      document.createElement("button");

    copy.textContent = "📋";

    copy.title = "نسخ";

    copy.onclick = () =>
      copyUsername(username);


    const open =
      document.createElement("button");

    open.className = "open";

    open.textContent = "👻 فتح";

    open.onclick = () =>
      openSnapchat(username);


    item.appendChild(name);
    item.appendChild(copy);
    item.appendChild(open);

    results.appendChild(item);

  });


  status.textContent =
    `تم توليد ${amount} يوزر`;
}


async function copyUsername(username) {

  try {

    await navigator.clipboard.writeText(username);

    document.getElementById("status").textContent =
      "✅ تم نسخ " + username;

  } catch {

    document.getElementById("status").textContent =
      "❌ تعذر النسخ";

  }
}


function openSnapchat(username) {

  const url =
    "https://www.snapchat.com/add/" +
    encodeURIComponent(username);

  window.open(url, "_blank");
}


generate();

</script>

</body>
</html>
