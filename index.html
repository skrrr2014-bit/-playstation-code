<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مولد الأكواد</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
  font-family: Arial, sans-serif;
  color: white;
}

/* القائمة صغيرة */
.box {
  width: 280px;
  background: #1c1c1c;
  padding: 16px;
  border-radius: 14px;
  text-align: center;
}

h2 {
  font-size: 18px;
  margin: 0 0 12px;
}

#code {
  background: #000;
  padding: 11px 6px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1.5px;
  direction: ltr;
  margin-bottom: 9px;
  white-space: nowrap;
}

button {
  width: 100%;
  padding: 9px;
  margin-top: 6px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.generate {
  background: white;
  color: black;
}

.copy {
  background: #444;
  color: white;
}

.playstation {
  background: #006fcd;
  color: white;
}
</style>
</head>

<body>

<div class="box">

  <h2>مولد الأكواد</h2>

  <div id="code">اضغط توليد</div>

  <button class="generate" onclick="generateCode()">
    توليد
  </button>

  <button class="copy" onclick="copyCode()">
    نسخ
  </button>

  <button class="playstation" onclick="openPlayStation()">
    PlayStation
  </button>

</div>

<script>

function generateCode() {

  // المسموح فقط:
  // A-Z + 0-9
  const characters =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  let code = "";

  // 12 خانة بالضبط
  for (let i = 0; i < 12; i++) {
    code += characters.charAt(
      Math.floor(Math.random() * characters.length)
    );
  }

  document.getElementById("code").textContent = code;
}


function copyCode() {

  const code =
    document.getElementById("code").textContent;

  if (code !== "اضغط توليد") {

    navigator.clipboard.writeText(code);

    alert("تم نسخ الكود ✅");
  }
}


function openPlayStation() {

  // فتح تطبيق PlayStation مباشرة
  window.location.href = "playstation://";
}

</script>

</body>
</html>
