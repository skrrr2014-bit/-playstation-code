<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فاحص صيغة يوزر</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      background: #1d1d1d;
      padding: 25px;
      border-radius: 22px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .info {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid #444;
      border-radius: 12px;
      background: #292929;
      color: white;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #fffc00;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
    }

    .check {
      background: #fffc00;
      color: #111;
      font-weight: bold;
    }

    .clear {
      background: #444;
      color: white;
    }

    #result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      display: none;
      line-height: 1.8;
    }

    .valid {
      display: block !important;
      background: #173d22;
      border: 1px solid #2e8b57;
    }

    .invalid {
      display: block !important;
      background: #421c1c;
      border: 1px solid #a33;
    }

    .rules {
      margin-top: 22px;
      text-align: right;
      background: #292929;
      padding: 15px;
      border-radius: 14px;
      color: #bbb;
      font-size: 14px;
      line-height: 2;
    }

    .ok {
      color: #5cff8d;
    }

    .bad {
      color: #ff7777;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>👻 فاحص صيغة اليوزر</h1>

    <div class="info">
      يفحص التنسيق محليًا فقط ولا يتصل بـ Snapchat
    </div>

    <input
      id="username"
      type="text"
      placeholder="اكتب اليوزر هنا"
      autocomplete="off"
      spellcheck="false"
    >

    <div class="buttons">
      <button class="check" onclick="checkUsername()">
        🔎 فحص
      </button>

      <button class="clear" onclick="clearInput()">
        🗑️ مسح
      </button>
    </div>

    <div id="result"></div>

    <div class="rules">
      <b>شروط الفحص:</b><br>
      <span id="lengthRule">⚪ الطول من 3 إلى 4 خانات</span><br>
      <span id="characterRule">⚪ أحرف إنجليزية وأرقام فقط</span><br>
      <span id="spaceRule">⚪ بدون مسافات</span><br>
      <span id="symbolRule">⚪ بدون رموز غير مسموحة</span>
    </div>

  </div>

<script>

function checkUsername() {

  const input =
    document.getElementById("username");

  const result =
    document.getElementById("result");

  const username =
    input.value.trim();

  const lengthRule =
    document.getElementById("lengthRule");

  const characterRule =
    document.getElementById("characterRule");

  const spaceRule =
    document.getElementById("spaceRule");

  const symbolRule =
    document.getElementById("symbolRule");


  // إعادة ضبط
  result.className = "";

  if (username.length >= 3 && username.length <= 4) {
    lengthRule.innerHTML =
      "✅ الطول من 3 إلى 4 خانات";
  } else {
    lengthRule.innerHTML =
      "❌ يجب أن يكون الطول 3 أو 4 خانات";
  }


  const charactersOK =
    /^[a-zA-Z0-9]+$/.test(username);

  if (charactersOK) {
    characterRule.innerHTML =
      "✅ الأحرف والأرقام مسموحة";
  } else {
    characterRule.innerHTML =
      "❌ يحتوي على أحرف أو رموز غير مسموحة";
  }


  const spacesOK =
    !/\s/.test(username);

  if (spacesOK) {
    spaceRule.innerHTML =
      "✅ بدون مسافات";
  } else {
    spaceRule.innerHTML =
      "❌ يحتوي على مسافة";
  }


  const symbolsOK =
    /^[a-zA-Z0-9]+$/.test(username);

  if (symbolsOK) {
    symbolRule.innerHTML =
      "✅ لا توجد رموز غير مسموحة";
  } else {
    symbolRule.innerHTML =
      "❌ توجد رموز غير مسموحة";
  }


  const valid =
    username.length >= 3 &&
    username.length <= 4 &&
    charactersOK &&
    spacesOK &&
    symbolsOK;


  if (valid) {

    result.className = "valid";

    result.innerHTML = `
      <strong>✅ الصيغة صالحة</strong><br>
      اليوزر <b>${escapeHTML(username)}</b>
      مطابق لشروط الفحص المحلي.
      <br><br>
      ⚠️ هذا لا يعني أن اليوزر متاح أو غير مستخدم.
    `;

  } else {

    result.className = "invalid";

    result.innerHTML = `
      <strong>❌ الصيغة غير صالحة</strong><br>
      عدّل اليوزر حسب الشروط الموضحة بالأعلى.
    `;
  }
}


function clearInput() {

  document.getElementById("username").value = "";

  const result =
    document.getElementById("result");

  result.style.display = "none";
  result.className = "";
  result.innerHTML = "";

}


function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// الفحص عند الضغط على Enter
document
  .getElementById("username")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      checkUsername();
    }

  });

</script>

</body>
</html>
