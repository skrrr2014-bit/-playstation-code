<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد الأكواد</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
  font-family: Arial, sans-serif;
  color: white;
}
.box {
  width: 90%;
  max-width: 450px;
  background: #1d1d1d;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
}
h1 {
  margin-bottom: 25px;
}
#code {
  background: #000;
  padding: 18px;
  border-radius: 12px;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 3px;
  direction: ltr;
  margin-bottom: 20px;
  word-break: break-all;
}
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
.generate {
  background: white;
  color: black;
}
.copy {
  background: #444;
  color: white;
}
.playstation {
  background: #006fcd;
  color: white;
}
</style>
</head>
<body>
<div class="box">
<h1>مولد الأكواد</h1>
<div id="code">اضغط توليد</div>
<button class="generate" onclick="generateCode()">
توليد كود
</button>
<button class="copy" onclick="copyCode()">
نسخ
</button>
<button class="playstation" onclick="openPlayStation()">
فتح PlayStation
</button>
</div>
<script>
function generateCode() {
  const characters =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let code = "";
  // 12 خانة بالضبط
  for (let i = 0; i < 12; i++) {
    code += characters[
      Math.floor(Math.random() * characters.length)
    ];
  }
  document.getElementById("code").textContent = code;
}
function copyCode() {
  const code =
  document.getElementById("code").textContent;
  if (code !== "اضغط توليد") {
    navigator.clipboard.writeText(code);
    alert("تم نسخ الكود ✅");
  }
}
function openPlayStation() {
  window.location.href = "playstation://";
}
</script>
</body>
</html>
