<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Username Generator</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#050507;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.cover{
  height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 20% 30%,#ff005522,transparent 35%),
    radial-gradient(circle at 80% 40%,#00f2ea22,transparent 35%),
    linear-gradient(135deg,#15151a,#050507);
  border-bottom:1px solid #29292e;
}

.cover h1{
  margin:0;
  font-size:30px;
}

.cover p{
  color:#aaa;
}

.logo{
  font-size:60px;
}

.app{
  width:92%;
  max-width:650px;
  margin:-35px auto 30px;
  position:relative;
}

.card{
  background:#121216f2;
  backdrop-filter:blur(18px);
  border:1px solid #29292e;
  border-radius:22px;
  padding:18px;
  box-shadow:0 20px 60px #0009;
}

label{
  display:block;
  margin:12px 0 6px;
  color:#ccc;
}

select,input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #333;
  background:#0b0b0e;
  color:#fff;
  font-size:16px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:15px;
}

button{
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  font-weight:bold;
}

.start{
  background:#fff;
  color:#000;
}

.copy{
  background:#29292f;
  color:#fff;
}

.stop{
  width:100%;
  margin-top:9px;
  background:#4b2020;
  color:#fff;
}

#status{
  text-align:center;
  color:#aaa;
  margin:18px 0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:15px;
}

.stat{
  background:#0d0d10;
  border:1px solid #29292e;
  border-radius:11px;
  padding:10px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:19px;
}

.green{color:#70ff90}
.red{color:#ff7070}
.yellow{color:#ffe16b}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  background:#0d0d10;
  border:1px solid #29292e;
  border-radius:11px;
  padding:11px;
  margin:7px 0;
}

.item a{
  color:#fff;
  text-decoration:none;
  background:#222;
  padding:6px 9px;
  border-radius:7px;
  font-size:12px;
}

.note{
  color:#777;
  text-align:center;
  font-size:12px;
  line-height:1.7;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="cover">
  <div>
    <div class="logo">🎯</div>
    <h1>TikTok Username Scanner</h1>
    <p>ثلاثي • رباعي • خماسي</p>
  </div>
</div>

<div class="app">
<div class="card">

<label>نوع اليوزر</label>

<select id="length">
  <option value="3">ثلاثي</option>
  <option value="4">رباعي</option>
  <option value="5">خماسي</option>
  <option value="all">ثلاثي + رباعي + خماسي</option>
</select>

<label>عدد اليوزرات</label>

<input
  id="amount"
  type="number"
  min="1"
  max="500"
  value="50"
>

<div class="grid">

<button class="start" onclick="generate()">
🚀 توليد
</button>

<button class="copy" onclick="copyAll()">
📋 نسخ الكل
</button>

</div>

<button class="stop" onclick="stop()">
⛔ إيقاف
</button>

<div id="status">
جاهز
</div>

<div class="stats">

<div class="stat">
<b id="total">0</b>
<span>الإجمالي</span>
</div>

<div class="stat">
<b id="three" class="green">0</b>
<span>ثلاثي</span>
</div>

<div class="stat">
<b id="four" class="green">0</b>
<span>رباعي</span>
</div>

</div>

<div id="results"></div>

<div class="note">
الأداة تولّد أسماء محتملة فقط ولا تؤكد توفر الاسم للحجز.
اضغط «فتح» للتحقق من الاسم على TikTok.
</div>

</div>
</div>

<script>

const chars =
"abcdefghijklmnopqrstuvwxyz0123456789";

let stopped=false;
let usernames=[];

function randomUsername(){

  const type=
    document.getElementById("length").value;

  let length;

  if(type==="all"){

    const list=[3,4,5];

    length=
      list[
        Math.floor(Math.random()*list.length)
      ];

  }else{

    length=Number(type);

  }

  let username="";

  for(let i=0;i<length;i++){

    username+=
      chars[
        Math.floor(Math.random()*chars.length)
      ];

  }

  return username;
}

function sleep(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}

async function generate(){

  stopped=false;
  usernames=[];

  document.getElementById("results")
    .innerHTML="";

  document.getElementById("total")
    .textContent="0";

  document.getElementById("three")
    .textContent="0";

  document.getElementById("four")
    .textContent="0";

  const amount=
    Math.min(
      500,
      Math.max(
        1,
        Number(
          document.getElementById("amount").value
        ) || 50
      )
    );

  let three=0;
  let four=0;
  let five=0;

  for(let i=0;i<amount;i++){

    if(stopped)break;

    let username;

    do{

      username=randomUsername();

    }while(
      usernames.includes(username)
    );

    usernames.push(username);

    const item=
      document.createElement("div");

    item.className="item";

    const name=
      document.createElement("span");

    name.textContent="@"+username;

    const link=
      document.createElement("a");

    link.href=
      "https://www.tiktok.com/@"+
      encodeURIComponent(username);

    link.target="_blank";

    link.textContent="فتح";

    item.appendChild(name);
    item.appendChild(link);

    document.getElementById("results")
      .appendChild(item);

    if(username.length===3)three++;
    if(username.length===4)four++;
    if(username.length===5)five++;

    document.getElementById("total")
      .textContent=usernames.length;

    document.getElementById("three")
      .textContent=three;

    document.getElementById("four")
      .textContent=four;

    document.getElementById("status")
      .textContent=
      `🚀 توليد ${i+1} / ${amount}`;

    await sleep(10);
  }

  document.getElementById("status")
    .textContent=
    `✓ انتهى التوليد — ${usernames.length} يوزر`;
}

function stop(){

  stopped=true;

  document.getElementById("status")
    .textContent="⛔ تم الإيقاف";
}

async function copyAll(){

  if(!usernames.length){

    document.getElementById("status")
      .textContent=
      "ولّد اليوزرات أولًا";

    return;
  }

  const text=
    usernames
      .map(x=>"@"+x)
      .join("\n");

  try{

    await navigator.clipboard.writeText(text);

  }catch{

    const area=
      document.createElement("textarea");

    area.value=text;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();
  }

  document.getElementById("status")
    .textContent=
    "📋 تم نسخ جميع اليوزرات";
}

</script>

</body>
</html>
